const BOOK = {"title": "内心的重建", "tracks": [{"index": 1, "title": "第一章 心理成长，需要科学指导", "file": "audio/neixin_chongjian/01_第一章_心理成长，需要科学指导.mp3", "duration": 1554}, {"index": 2, "title": "第二章 心理成长的钥匙：认知疗法", "file": "audio/neixin_chongjian/02_第二章_心理成长的钥匙_认知疗法.mp3", "duration": 2445}, {"index": 3, "title": "第三章 内心强大的神器：三种思维", "file": "audio/neixin_chongjian/03_第三章_内心强大的神器_三种思维.mp3", "duration": 1407}, {"index": 4, "title": "第四章 影响我们的神秘力量：驱力", "file": "audio/neixin_chongjian/04_第四章_影响我们的神秘力量_驱力.mp3", "duration": 1171}, {"index": 5, "title": "第五章 少有人掌握的情绪奥秘", "file": "audio/neixin_chongjian/05_第五章_少有人掌握的情绪奥秘.mp3", "duration": 1841}, {"index": 6, "title": "第六章 童年会伤人，如何看待环境影响", "file": "audio/neixin_chongjian/06_第六章_童年会伤人，如何看待环境影响.mp3", "duration": 1501}, {"index": 7, "title": "第七章 为什么说成功学害人不浅", "file": "audio/neixin_chongjian/07_第七章_为什么说成功学害人不浅.mp3", "duration": 1584}, {"index": 8, "title": "第八章 接纳不完美的自己", "file": "audio/neixin_chongjian/08_第八章_接纳不完美的自己.mp3", "duration": 1072}, {"index": 9, "title": "第九章 顺其自然的人生态度", "file": "audio/neixin_chongjian/09_第九章_顺其自然的人生态度.mp3", "duration": 1599}, {"index": 10, "title": "第十章 如何有效改善性格", "file": "audio/neixin_chongjian/10_第十章_如何有效改善性格.mp3", "duration": 1758}, {"index": 11, "title": "第十一章 建立良好的人际关系", "file": "audio/neixin_chongjian/11_第十一章_建立良好的人际关系.mp3", "duration": 883}, {"index": 12, "title": "第十二章 心理问题是可以理解的", "file": "audio/neixin_chongjian/12_第十二章_心理问题是可以理解的.mp3", "duration": 2285}], "transcripts": [{"title": "第一章 心理成长，需要科学指导", "text": "各位朋友，你好。欢迎来到《内心的重建》听读时间。我是这档语音读书的主讲人。\n\n今天我们要一起走进的第一章，叫作\"心理成长，需要科学指导\"。这是整本书的基石，也是作者维尼老师把自己二十多年心理成长心得敞开来、和盘托出的地方。如果说后面每一章都是一把具体的钥匙，那么第一章要解决的，是那个最根本的问题：我们明明想改变自己的心态、控制自己的情绪、改善自己的性格，为什么常常是\"懂得了很多道理，却依然过不好这一关\"？维尼老师的回答一针见血——因为心理成长，需要科学的指导；方法不对，光靠蛮力是不行的。\n\n这一章我打算分几条线索和你聊。第一，维尼老师自己是怎么从一个被心理问题深深困扰的年轻人，一步步摸索出一套方法的；第二，那本让他\"醍醐灌顶\"的书，到底讲了一句什么话，以至于他坐在草地上，觉得山谷都亮了；第三，他用自己接待过的一个真实咨询案例，演示\"改变认知\"到底怎么落地、怎么把一个抑郁自卑的女孩从黑洞里拉出来；第四，心理成长的目标到底是什么——是不是非要做个完美的圣人？情绪有没有好坏之分？最后，也是很多人最容易踩的坑：光靠意志，能不能解决心理问题？\n\n先说维尼老师的成长故事。我想特别把这一部分放在前面，是因为它特别能打动人，也特别能破除一个迷思：会写心理成长书的人，是不是天生就心理强大、从来没烦恼？完全不是。维尼老师坦承，他的青年时代有过不少心理问题，内心烦恼和困扰相当多，那时候他根本不懂怎么改善情绪、行为和习惯，对性格也不满意。\n\n这些问题的种子，是高中时埋下的。童年的他，父母宽容、鼓励，基本上是让他顺其自然地成长，没太多要求，倒是挺健康的。转折发生在高中——他开始看《读者文摘》《青年文摘》这类读物，里面励志和成功学的思想鼓舞了他，让他更努力、意志更顽强。听起来是好事对吧？但正是这些思想，让他常常过于勉强自己、违背用脑规律。比如头脑已经疲劳了，他也不休息，还要求自己在不适合的状态下依旧高效学习。结果高三时患上了肌肉紧张性头痛。而且，这些思想也让他过于执着、追求完美、目标过高，过于勉强而不知顺其自然，过于强调主观能动性而违背规律，于是常常紧张、焦虑、急躁，那种肌肉紧张性头痛跟随了他很多年，后来还品尝过短暂的抑郁，也被强迫症、抽动症困扰过。\n\n听到这里，不知道你有没有一点熟悉感？我们这代人，谁没被\"头悬梁锥刺股\"\"吃得苦中苦方为人上人\"\"逼自己一把\"这类话语浸泡过呢。维尼老师用自己的亲身经历告诉我们：违背规律地勉强自己，往往是心理问题的重要来源。这一点，后面讲成功学、讲顺其自然的时候，我们还会反复回到。\n\n1990年考入国防科大后，他说大部分时间都会头痛，这和心理——主要是情绪和用脑习惯——关系很大。所以他苦苦寻求解决之道，读了一些心理学书籍，却总觉得不得其门，无法改变自己。在烦闷之中，他常感叹：朝闻道，夕死可矣！改变的钥匙到底在哪里啊！\n\n转机出现在1993年。大三结束的暑假，他读了一本书叫《你的潜能》，书里有一句话，大意是：你的行为与感觉，并不源于事物的本来面目，而是源于你对这些事物持有的认知、看法或想象。他还记得，当时正坐在老家小山的草地上。看到这句话，顿觉醍醐灌顶，恍然大悟，青翠的山谷仿佛也更明亮了。从此，他找到了心理成长的钥匙：想改变情绪和行为，首先要改变认知和看法。从此，心理成长之门就打开了。\n\n我想请你停一下，体会这句话的分量。我们习惯以为是\"那件事\"让我们痛苦——是老板批评了我，是孩子不听话，是考试失利，是别人歧视我。但《你的潜能》这句话点破了一个真相：直接决定你情绪和行为的，不是事情本身，而是你对事情的看法。这就好比同样是半杯水，有人看见\"只剩半杯\"而焦虑，有人看见\"还有半杯\"而庆幸。杯子没变，变的是看法；看法一变，感受就变了。\n\n维尼老师说，很多人觉得性格、情绪、行为难以改变，其实是因为没掌握方法。就像锁上的门，使出全身力气也推不开，而有了钥匙就简单多了。改变认知的方法，就是心理成长的钥匙之一。当然，方法看起来简单，过程却并不容易。当时没人指导，也找不到合适的书，主要靠自己内省、思考、摸索、领悟，所以成长对他来说是个漫长的过程。\n\n有意思的是，四五年之后他才知道，自己摸索出来的方法，其实就是心理咨询里\"认知疗法\"的核心思想。1950年代，美国心理学家艾里斯就已经提出了认知疗法的主要理念；维尼老师四十年后才通过读书接触到；而六十年后，很多读者还不知道。他感慨：西方心理学大师辈出，留下不少珍宝，值得学习和吸收；以心理学的理论为依据去心理成长，是扎实、可靠、科学的。\n\n这里我特别想强调\"科学\"这两个字。维尼老师反复说，心理成长不是玄学，不是靠一句\"你要坚强\"\"你要正能量\"就能解决的；它背后有规律，认知疗法就是被大量实践和研究所验证的科学方法。他本人前六七年的心理成长，每天要花两三个甚至六七个小时学习、思考，梳理遇到的情绪行为问题，分析心理机制，探寻规律，摸索方法。其中改变认知是主要方法：识别不适合的情绪和行为背后的不合理认知，建立合理的认知，形成习惯性思维，问题就逐渐解决了。经过二十多年不断内省和反思，之前困扰他的诸多问题基本解决，他收获了幸福自在。\n\n2000年左右，他开始做心理咨询，发现人的心理规律那么相似，心理问题的内在机制也相同，从自身经验总结的方法同样适用于别人。2010年，他研究家庭教育，把理念用到家长孩子的情绪管理、性格改变、行为改善、抗挫折能力培养上，结果迅速得到读者认可，他的《顺应心理，孩子更合作》广受欢迎。很多读者说，读这本书不但改善了亲子、夫妻、同事关系，心态也发生了积极变化。这进一步证明了方法的有效性。现在他把这些方法系统总结出来分享给大家——有了这些指导，读者可以少走弯路，不必像他当年那样经过漫长努力，能较快捷地实现心理成长。\n\n讲到这儿，第一章的核心态度已经立起来了：心理成长有科学方法，认知是钥匙，而维尼老师既是方法的受益者，也是验证者。\n\n接下来，他用自己接待过的一个真实案例，把\"改变认知\"演示得淋漓尽致。注意，这个案例信息量很大，几乎浓缩了后面很多章的方法。\n\n那是一个阳光明媚的上午，他坐在星巴克窗边，等一位大学研二的女生。女生通过微信找他，简单聊过几次，能感受到她情绪的低落和无助。她朋友圈有一条消息：\"一直以来都活得很辛苦，突然好想走。\"这让他心惊，所以当女生求助时，他答应了。女生外形普通，不善衣着，本是青春妙龄，却有些抑郁，阳光没照进她心里。\n\n坐下后，她开口就谈父母，低着头。高中时妈妈经常向她抱怨：\"都是为了你，我和你爸才经常吵架，才搬家到这里，才不工作来照顾你……\"这让她自责，觉得欠妈妈很多，压力很大。妈妈控制欲强，什么都说了算，不听就生气。她在家很听话，却被深深压抑，所以在学校反而经常顶撞老师、欺负同学。妈妈对她的优点觉得理所当然，从不表扬，只盯缺点。所以她学习虽好却自卑，当维尼问她有何优点，她肯定地说：我觉得自己没什么优点。\n\n维尼老师先点出一个根本原理：过去就在那里，不可改变，也不可重来。直接决定我们情绪和行为的，不是事情本身，而是对事情的认知。过去已经不可改变，我们可以改变认知，认知变，情绪变。他说，这位女生还是有悟性的，理解了意思。比如她从小想当然觉得父亲欠她的，现在想来并非如此——父亲没有伤害她，只是能力不够、运气不好，像人生激流中的一艘小舟，掌握不了命运，也怪不得他。认知改变了，对父亲的感觉就变了。\n\n更进一步，如果理解妈妈，改变认知，怨恨也会少很多。妈妈的原生家庭也有问题，姥姥从小不关心不爱护妈妈，妈妈可能深深体会到这样对孩子不好，所以对女儿特别关心爱护，只是不小心走向另一个极端——过多控制，让她压抑。母亲不懂家庭教育，其实很正常，中国这样的父母何其多！毕竟本意是为她好。再说，目前的心理状态也不能都归因于父母，她本身的性格就属于敏感型，从小这一特点就明显。理解了，就容易宽容了。她抬起头，渐渐露出笑容。认知变了，想起过去、想起妈妈，也就轻松许多。\n\n注意这里的一个深层洞见：过去的经历，常常会沉淀为认知或习惯性思维来影响我们。所以，放下过去的包袱之后，重点分析当下影响心理的主要因素——包括认知、情绪、习惯等——就可以了。也就是说，理解过去是为了放下，但成长的重点要回到当下。\n\n然后维尼老师帮她重建自我形象。她的自卑感，主要来自对自己没有一个合理的自我形象，\"我觉得自己没什么优点\"。维尼请她罗列优点，她想了想，找出不少：学习悟性高、成绩好，不怕吃苦，能艰苦奋斗，勤奋，有毅力，有恒心……这怎么能说没什么优点呢？很多父母发现自己孩子有这些优点，做梦都会笑出来。她过多受了母亲影响，对优点视而不见，只关注缺点。\n\n维尼又请她罗列缺点。她先想到自理能力差，维尼认为这其实没什么，结婚后想学也很快，可以忽略。她想了想，说很多时是自己要求太高，所以处处觉得自己不行——比如觉得以目前能力水平很难赚到很多钱。其实这很正常，能赚到很多钱的人很少。当然她确有缺点，比如衣着打扮一般，性格情绪还有问题，这些不妨老老实实承认、坦然接受，就不会那么难受。何况这些也可以改进。如此分析，会发现缺点原来不像想象中那么多、那么严重。\n\n她还有一些困惑：她想按自己喜欢的方式生活，但每当和妈妈意见相左，妈妈就生气说\"我再也不管你了\"，她在意妈妈感受，妈妈的反应让她害怕担心，怕气坏妈妈，所以压抑。维尼请她转换认知：我们对亲人只应该负有限的责任，妈妈有自己的命运，我们也只能做自己能做的事，管不了那么多。毕竟，自己这么痛苦也是妈妈不想看到的。所以，还是大胆做自己吧。这里有句维尼小语特别好：学会理直气壮，就会有底气，不过于在意别人看法，有助于建立自信。\n\n但维尼老师没有到此为止，他极其清醒地指出：她目前还处在抑郁状态，情绪对她有强大作用。在低落情绪下，她对负面消极的东西特别敏感，对积极的方面却很迟钝，所以开出的\"药方\"即使适合，也会被淹没在情绪漩涡中。所以，目前首先要做的是调节情绪，多转移注意力，比如跑步健身、多和同学聊聊、多参加活动……情绪好转之后，再去慢慢改变认知、形成合理的习惯性思维。这样，才会从抑郁中逐渐走出来，而且效果稳定。\n\n又一句维尼小语：情绪对认知有重要作用，所以有时需要先调节情绪，再改变认知。这句话太重要了，它直接点破了很多人\"道理都懂却走不出来\"的困境——不是你不想懂，是情绪把你困住了，这时候光讲道理没用，得先让情绪平复下来。\n\n案例结尾很温暖：她回去先换个发型、找同学买件时尚衣服，换换心情。过了几天发讯息说在坚持跑步，虽然时好时坏，但知道了方向，不像以前不知所措。一个月后说好多了；两个月后说活着很幸福。你看，从\"好想走\"到\"活着很幸福\"，中间隔着的就是认知的改变加上情绪的调节。\n\n讲完案例，第一章进入几个非常通透的小节。\n\n\"发现自己的本性，做自己就好\"。维尼老师讲了个趣事：他写过一篇文章批评某个心理学派，一位热心读者疑惑地建议：您作为咨询师不是应该包容一切吗，为什么要批评？这涉及心理成长的目标。一个人是否需要做到完美和极致？是否要用圣人的标准要求自己？显然他做不到，读者也做不到，也不需要做到。他是比较宽容的人，但只要批评是理性客观的，批评又有何妨？心理成长，可以\"随心而动\"，适合自己就好，自己喜欢、觉得舒服自在、不影响他人、适应生活工作就可以了，可以保留自己的特色和本性，做自己。\n\n比如有人喜欢安静，过多交际是不愉快的事，就不必非要变得善于交际，能正常自然交往也不错。有人喜欢直率，就没必要变得很委婉，可以表达真实想法，只要考虑别人感受即可。一个不风趣的人没必要费尽心思变幽默，一个俏皮的人也不必非要变得庄重。人不是孙悟空，不能想变什么样就变什么样，适合自己、适合当下就好。那些看起来不同的性格，内向外向、爱表现不爱表现，哪个更好？性格本身没有优劣之分，只要适应生活工作、不过度、不构成障碍，都可以。性格成长可以顺势而为，在保持本色的基础上调整改变，更轻松自然。\n\n什么样的心理状态好？没有统一标准。有人喜欢紧张刺激，有人喜欢平静从容；有人享受淡淡忧伤，有人希望愉悦常在。自己喜欢就好。不同年龄感觉也不同：年轻时多愁善感有些诗意激情，中年后理性客观平静淡定，都不错。同一场合不同角色适合的心理状态也不同——2016年奥运女排决赛，观众若太紧张执着可能更感受比赛精彩，太淡定超脱趣味就少；而队员太紧张执着于输赢容易发挥失常，淡定超脱些则有利稳定发挥。尺度也重要：观众太紧张输了会懊恼，队员太淡定不兴奋也不利发挥。总体，心理成长可以\"随心而动\"，适合生活工作、喜欢满意，就是好的；不满意不喜欢、对生活工作造成障碍，才需要改变。维尼说，生活在世间，七情六欲带来烦恼也带来幸福，所以想获得幸福自在没有必要无欲无求，可以照常生活、照常追求，只是学会合理、适度、合乎自然。\n\n\"情绪本身并无好坏之分\"。我们常说要克服不良情绪，什么是不良情绪？其实情绪本身无所谓好坏，关键在于是否适度、是否适合情况。忧伤，只是淡淡的、有些诗意，也不错；但忧伤过度成了抑郁，就成了不良情绪。高兴一般美好，但过于激动兴奋可能乐极生悲。悲痛在某种场合也适合，但过头就需要调节。适度焦虑推动解决问题，过度则让人煎熬。适当恐惧让我们警醒远离危险，过度则成障碍。适度紧张提高兴奋激发潜能，过度则方寸大乱发挥失常。平静淡定一般是理想境界，但火烧眉毛还不着急，恐怕延误时机。所以，任何情绪都可能成为不良情绪，也可以是良好情绪；不良情绪是指过度的、不适合的、让我们痛苦甚至构成障碍的情绪。\n\n\"依靠意志能解决心理问题吗\"。维尼老师给的答案很实在：每一个人或早或晚都会遇到心理问题，这很正常，也是成长的机遇。但是，心理不是想改变就能改变的。比如知道不应该害怕，但还是恐惧；知道应该自信，但还是自卑；知道不应该紧张，越想不紧张就越紧张！很多时候心理有\"不由自主\"的特性，意志力有时苍白无力。心理有规律，改变需要专门方法，这也是心理学是一门科学的原因。\n\n他举了几个例子。在过于低落的情绪下，即使有意想正面积极方面，感觉也迟钝；此时会不由自主对负面消极更敏感，继续产生低落情绪，往往难以摆脱甚至抑郁——这就是情绪影响认知的规律，所以首先要调节情绪，而不是思来想去。情绪产生后，会通过植物性神经引起生理反应，如肌肉、心跳、呼吸变化，这种反应会持续一段时间；植物性神经不受意识控制，所以有时用意志调节情绪效果不佳，不如用运动等转移注意力的方法让情绪慢慢平静。\n\n驱力也会影响意志。比如很生气，情绪驱动我们发火，有时想忍也忍不住；喝酒吸烟成瘾，明知不该却不由自主，这是欲望的驱动力。习惯性思维会强力影响情绪，比如看到孩子又做错题或没听懂，如果你的习惯性思维是\"他不该做错、该听懂\"，就可能不由自主生气发火；如果学会理解孩子，改变认知，觉得\"孩子这样有原因，其实该做错该听不懂，我觉得容易是从成人视角，对孩子还是难的\"，情绪就平静得多。\n\n害怕也是不由自主的。维尼大学时对跳马有种莫名恐惧，难以克服，后来依靠\"系统脱敏法\"成功消除恐惧，最后还获全校跳马冠军——方法比意志力更有效。公开发言会不由自主紧张，越告诉自己别紧张反而越紧张，意志帮不了多少；此时若改变认知，比如\"就像平常一样说话就可以，那样表现反而最好\"，可能就不紧张了。太在意别人眼光和评价，说话做事没底气；若学会\"理直气壮\"的方法，就能有底气，这是靠意志难做到的。压力太大，凭意志能坚持但让人煎熬，此时改变认知、学会\"做能做的事，其他的顺其自然\"，压力自然小很多。\n\n再谈强迫症，维尼认为其实质是习惯性出现的怀疑，怀疑出现后产生驱力，驱动你去消除它，这是不由自主的；若对抗不顺应该想法，可能紧张焦虑。比如有洁癖的孩子，怀疑手不干净时，抑制不住反复洗手，父母不让洗孩子会很难受。抽动症，抽动动作是对紧张焦虑或不舒服感的习惯性宣泄，紧张焦虑时自动出现，如眨眼、耸肩、动鼻子、鼓肚子、清嗓子等，也是不由自主的。儿童抽动症康复不靠控制，而是解决引起紧张焦虑的根本原因，比如改善孩子敏感性格、改变父母教育方式等。所以，心理有时是不由自主的，意志在某些情况下会失效，懂得心理规律、掌握恰当方法，对心理成长很重要。\n\n好，第一章我们就聊到这里。我想请你带走三句话：第一，心理成长有科学方法，改变认知是钥匙；第二，认知变，情绪变，世界变——但有时要先调节情绪再改变认知；第三，心理往往\"不由自主\"，别再一味责怪自己\"不够坚强\"\"意志不坚定\"，方法比蛮力管用。下一章，我们就去认识这把钥匙本身——认知疗法，到底是何方神圣。我们下章见。\n"}, {"title": "第二章 心理成长的钥匙：认知疗法", "text": "各位朋友，我们接着聊《内心的重建》的第二章——\"心理成长的钥匙：认知疗法\"。\n\n上一章我们说到，维尼老师当年感叹\"朝闻道，夕死可矣\"，是认知疗法让他豁然开朗，打开了心理成长之门。这一章，我们就把这把钥匙拿在手里，认认真真看一看它到底长什么样、怎么用。\n\n我会顺着书的脉络，和你聊这么几块：第一，认知疗法最核心的那个理论——ABC理论，三两句话就把\"为什么你总被情绪绑架\"说清楚了；第二，一个特别重要、但很多人从没注意过的概念——\"自动化思维\"，尤其是其中的\"习惯性思维\"，它才是躲在幕后影响你几十年的真正主角；第三，怎么给自己的心修一道\"认知防火墙\"，挡住过去的伤痛和焦虑；第四，怎么去识别情绪和行为背后的认知，并把它重建；第五，也是全章最扎心的部分——为什么道理都懂，却还是改不了？维尼老师用\"认知树\"和\"认知体系\"这两个比喻，把这件事讲透了；最后，他还会告诉你，怎样用\"认知咒语\"说服自己，以及为什么心理成长急不得，要\"慢慢等待开悟\"。\n\n先说ABC理论。这是美国心理学家埃利斯提出的，是认知疗法里最具代表性的理论。听起来洋气，其实一句话就懂：直接决定情绪和行为（C，consequence，后果）的，不是事情（A，activating event，前因），而是你对事情的认知（B，belief，信念）。而认知是可以改变的。所以，你可以通过改变认知B，来改变情绪和行为C。\n\n维尼老师讲了一个德国华人妈妈的真实故事。这位妈妈在德国，有一次邻居看了她一眼，她本来是敏感纠结的性格，一下子就觉得：这人是不是对我有种族歧视？然后，因为孩子的德语不好，她开始担心孩子在学校是不是也会被歧视。结果，她陷入抑郁焦虑，不得已回国治疗了4个月，花了几万块钱，差点住进精神病院。后来康复回到德国，见到那个邻居，邻居热情地和她打招呼，好像什么都没发生。看来人家根本不是种族歧视，可能只是觉得她漂亮，多看了几眼。维尼老师点破：让我焦虑和抑郁的罪魁祸首，不是邻居，而是我错误的认知。\n\n你看，同样一个\"邻居看了一眼\"，认知不同，天差地别。这就像书里那个反复出现的例子：参加比赛输了（A），如果认知B是\"我很失败、我不行、我不该输、输了很糟糕\"，情绪C自然是沮丧低落；但如果改变认知，告诉自己\"坏事变好事，输了有助于发现自己的问题，更好改进；输很正常，没什么，谁都会输；输就输了吧，顺其自然\"，这种新认知更积极淡定，情绪就平静得多。\n\n再比如面对困难或挑战性工作（A），如果认知B是\"我一定要完成，不完成的后果很严重\"，压力必然大（C）；如果换成\"做自己能做的事就可以了，其他的顺其自然\"，压力就少很多（C）。这两种认知不能说谁对谁错——前一种给人更大动力，也给人更大压力；后一种在保持一定积极性的同时减轻压力，是更平衡的认知。\n\n某方面能力比较弱（A），如果总和最优秀的人比，或和过高的要求比，可能觉得自己失败无能（B），感觉自卑（C）；如果学会接纳自己，认为有弱点\"很正常、没什么\"，只要能进步就可以（B），就容易坦然面对（C）。\n\n维尼老师总结得很漂亮：认知疗法的理论虽然很简单，但却是改变情绪和行为的一个很有效的方法。事情往往难以改变，但改变了认知，也就改变了情绪和行为。认知变，世界变。\n\n书里还附了一位来访者的亲述，特别有代表性。2000年左右，他陷入心理危机，对过去耿耿于怀，迷惑为什么多年拼搏之后还是伤痕累累，去心理咨询、去寺庙教堂寻求解脱都没得到答案。认识维尼老师后，老师告诉他：直接造成所谓伤痕的，其实不是过去的经历，而是对经历的认知；不是别人直接给了你伤害，而是对事情的认知让你觉得被伤害。改变了认知，就能从过去解脱。\n\n这位来访者以前总纠结农村中学老师的经历，觉得自己倒霉。学了认知疗法后转变想法：正因为去农村当了老师，才逼迫他奋发图强考上研究生，成为青岛的大学老师；如果分到县城中学，可能就安于现状了。这不是幸运吗？以前想到干爸关键时刻没好好帮他，就很受伤害；讨论后发现是自己期望太高，干爸没那么强，而且毕竟是\"干\"爸，关系没那么好，人家没全力帮也是人之常情，自己的人生还要自己承担。其实不是干爸伤害了他，是他的想法让自己觉得受了伤害。认知疗法看似简单，却开启了改变之门。当然，改变说起来简单却不易——多年形成的习惯性思维根深蒂固，加上不良情绪影响，转变过程不容易。所谓病去如抽丝，成长需要不断努力，每天反省，慢慢改变。所幸多年努力后，他彻底走出了困境。\n\n好，现在我要请你特别注意书里提出的这个概念：自动化思维。这是认知疗法的核心秘密，也是维尼老师最有价值的发挥之一。\n\n认知的产生通常有两种：有意识思维和自动化思维。有意识思维就是你熟悉的、主动的思考，比如分析利弊、决定怎么应对、订计划。它相对理性，但也难免产生不合理认知。而自动化思维听起来神秘陌生，虽然天天相伴，很多人却从未注意过。它的定义是：无意识的、不带意图目的的、自然而然且不需要努力的思维，是美国心理学家贝克首先提出的。它是人进化中自然形成的机能，帮我们更轻松生活——试想事事都要有意识思考，多辛苦。\n\n维尼老师又把自动化思维细分为两种：直觉式思维和习惯性思维。\n\n直觉式思维，是在面临新的、不太熟悉的事情时，有时一种即时反应，不是经过有意识思考，而是立刻、想当然产生一些看法。比如给孩子讲题，孩子总听不懂，你可能马上想\"他怎么这么笨\"，一下就火了。这种认知没经过深入有意识思考，凭直觉想当然得出，理性成分相对少，不合理成分相对多。那位德国华人妈妈没好好分析，就想当然认为邻居种族歧视，就是一种直觉式思维，与事实不符。一位男士用微信约心仪的女孩吃饭，女孩简单说抱歉今天没时间，男士立刻想到女孩是不是有意冷落他，感到沮丧——其实女孩可能真的忙，直觉式思维不符合事实，却实实在在地影响了情绪。这种思维普遍存在，在家庭教育中常出现：孩子表现出乎意料，我们没了解真相就想过他捣蛋不上进，火气就来了。事后反省，识别火气背后的不合理认知，再分析它是否合理、合理的认知是什么。比如孩子写作业磨蹭，可能有内在原因——作业太多太难、缺乏兴趣和信心，这样就可理解，父母该做的是\"找原因、想办法\"帮助孩子，认知变了，情绪就平静了。\n\n第二种，也是更关键的——习惯性思维。它就是在某种情况下习惯性地自动出现的认知和想法。因为它自动出现，如果不去有意识地识别，甚至觉察不到它存在。这些认知是原有的，来源广泛：有的来自他人影响，有的来自书报杂志，有的是自己思考的结果。就像习惯形成过程，某种情况下某种认知多次出现，慢慢就成了习惯性思维。比如维尼高中常看《读者文摘》，一些成功学思想给他鼓舞，他慢慢应用到生活学习，形成相应习惯性思维，但因辩证吸收能力不强，这些认知有不合理处，导致他过于勉强、过于执着，对情绪行为产生不少负面影响。他又受《奇特的一生》影响，形成了一些节约时间的方法，逐渐成为习惯性思维，但这些认知不太合理——比如累了还继续学习思考、不适合的场合也思考、同时想几件事，养成不合理用脑习惯，结果头脑容易疲劳，头痛持续多年。\n\n习惯性思维形成后，会自动出现，不需要有意思考。比如明明头脑累了，他会自动、习惯性地想到要节约时间，所以不去休息而是继续用脑；做琐碎事时，习惯性地认为在浪费时间，所以烦躁，或习惯性地认为应该快速完成，导致头脑易疲劳。从来源看，书籍或他人的观点本身可能不合理，我们的理解也可能片面极端，自己思考得出的认知也可能不合理，所以习惯性思维自然可能有不合理方面。比如有的父母受《夏令营中的较量》影响，认为孩子很多问题都是娇生惯养造成的，所以应该严格严厉，甚至有意制造挫折让孩子吃苦。这篇文章观点本身有不合理处，读者若不辩证吸收、想当然或片面理解，结论自然不合理；形成习惯性思维后，会自动出现，甚至觉察不到，把它当理所当然正确的结论去应用，想不到质疑是否合理。\n\n维尼年轻时认为，如果不能实现远大目标、活得精彩成功，如果四十多岁还是平凡的，人生就是灰暗痛苦、遗憾终生的。他发现很多受成功学影响的来访者有类似习惯性思维，大概来自成功学理念。这个想法不知何时形成，也没深入去分析是否真是这样，就想当然觉得正确，成为习惯性思维，影响他好几年。遇到不顺时，会想到自己能力不像想象中强大，将来可能平凡，由于这个习惯性思维影响，就焦虑担忧。后来他识别出这种思维影响情绪，重新分析，发现并不合理——即使平凡的人生也可以有不少精彩时刻，也会幸福，那烦恼什么？习惯性思维改变了，心态自然好多了。\n\n书里有个案例特别形象：一位六年级女孩特别在意字写得怎么样，不满意就要擦掉，不然不舒服难受，每天浪费不少时间。比如\"准\"字，要求右边四个横都很平且平行，等号也要求平行。为什么？上小学时老师要求横平竖直，所以她一直觉得字\"横平竖直\"才是应该的，这成了习惯性思维。维尼和她探讨：老师为什么这样要求？因为小孩子没规矩可能写乱，所以有了这个规矩，照此写应该还可以，但有些呆板。维尼让她观察硬笔书法作品，发现即使楷书也几乎没有横平竖直的，变化才产生美，不横平竖直也是好看的。慢慢地，她的习惯性思维改变了，问题行为逐渐消失了。\n\n维尼强调：识别情绪和行为背后的不合理认知是心理成长的重点。不合理认知可能来自有意识思考，也可能来自直觉思维和习惯性思维。其中习惯性思维是重中之重——不少性格、情绪、行为问题背后都存在不合理的习惯性思维，因为它自动出现，不仔细识别甚至觉察不到，自然不会怀疑其是否合理。而它就那样默默地、有力地影响我们的心理，可能持续几十年甚至一生。\n\n这里有个\"维尼小语\"谈习惯性思维与潜意识。我们熟知的\"潜意识\"是弗洛伊德精神分析最著名的概念，但显得有些\"玄\"、不易理解。习惯性思维与潜意识有相通之处：习惯性思维自动出现，我们常没意识到它存在，却默默有力自动地影响我们。不过相比潜意识，习惯性思维更容易理解，更符合常识。\n\n接下来是\"抵御伤痛、焦虑的认知防火墙\"。经历强烈刺激、伤痛后，可能想到这些事就紧张焦虑痛苦。其实直接让我们痛苦的，不是事情本身，而是对事情的认知。如果我们建立新认知、逐渐形成习惯性思维，每当想到这些事就会自动想到新的习惯性思维，就建立起\"认知防火墙\"，有力阻隔负面影响。\n\n比如有人想起父母对自己造成的伤害就心痛，对于过去的认知才是直接原因。过去无法改变，但可以改变认知，比如用三种思维重新看待过去：第一，坏事变好事——过去的痛苦经历，可以提醒我们别在孩子身上犯同样错误，也是好事；第二，很正常、没什么——父母那样做是因为不懂教育，那个年代很多父母可能都那样，这也源于父母原生家庭的影响；第三，顺其自然——过去就过去吧，过多纠结没意义，不妨放下过去面对未来。经过多次这样思考，新认知会成为习惯性思维，每当想到童年经历首先想到它们，形成认知防火墙，就能坦然面对。\n\n又如失恋往往痛苦，一想就心痛。若能重新认知、慢慢形成习惯性思维、有了认知防火墙，面对失恋也能坦然。为什么\"时间是治愈伤口的良药\"？也是基于同样道理——出于本能，人会不知不觉寻求解脱、\"看开\"此事，慢慢形成习惯性cción思维，就不再心痛了。那些曾给我们创伤的事件既然无法改变，不妨建立认知防火墙，有了它帮助，心情会平静很多。\n\n再聊\"识别情绪、行为背后的认知\"。当情绪或行为出问题（不适合工作生活、自己不满意），背后一般存在不合理认知，所以识别是改变的第一步。有的容易找到，有的要费工夫。识别后分析其不合理处，进行认知重建，得到合理认知。这里\"合理\"认知，更多指能产生适应情绪和行为的认知；\"适应\"指适合工作生活、自己满意。不合理认知指产生不适应情绪和行为的认知。世界复杂，认知本身有时难以简单判断正确与否，也因人而异。\n\n比如你觉得微信聊天有意思，花大量时间耽误工作，你也觉得不好，那\"微信聊天很有意思\"就是一种不合理或不适应认知，需改变；若没耽误什么，还有娱乐作用，那就是合理适应认知，不需改变。维尼做单调枯燥工作或乏味费时家务时常烦躁急躁，有不良影响，想去解决。他识别烦躁背后的认知：觉得这些工作价值不大、浪费时间，所以既不愿做又想赶快做完，这种习惯性思维自然容易让人烦躁。他采用新认知：这些事也是人生一种经历，既然是人生一部分，自然应安然接受，即使看起来价值不大或浪费时间。有了这认知就平静多了，形成新习惯性思维后问题解决。原来的习惯性思维一直在，但因自动出现且对他算小事，他没有意识别，所以没意识到存在，自然没去改变，让这不合理习惯性思维影响了他二十多年。可见原有的和新认知难以断言谁对谁错，只是原有产生不适应情绪（烦躁）所以不合理，新的产生适应情绪（平静）所以合理。\n\n书里有个\"认知改变，行为改变\"的案例。十年前维尼在科研机构当科研小组组长，别人都说他犟。比如科长和他沟通，他常坚持己见，导致和领导关系不好、自然\"吃亏\"，引起他反思。其实他和朋友家人相处好商量、不犟，为什么工作中犟？是习惯性思维作怪：他认为为了做好工作、坚持正确意见是应该的、不必考虑别人感受。这思维来自刚工作时一位老前辈的影响（老前辈就是这态度），也和维尼\"坚持真理\"的核心思维有关。思维形成后想当然觉得对，从没怀疑过可能不合理。经历重大挫折后他才反省，识别出不合理习惯性思维，重新思考分析，有了新认知（参考第11章第5节\"别太较真，保持适度自我怀疑\"）。认知变了，行为改变就轻松了，很快在工作中不大犟了。\n\n家庭教育中，很多父母有不合理习惯性思维。维尼在《顺应心理，孩子更合作》里剖析了很多。比如辅导作业导致家长发火的常见习惯性思维：孩子应该会、应该懂、应该做对、应该记得住、做作业时应该专心、应该不为家里事吸引。有了这些，孩子做不到时就觉得他不应该如此，容易发火。如果学会理解孩子，会发现：存在就是合理的，孩子表现有原因、可能是应该的——这些知识我们看来简单，对孩子有难度，所以他其实应该不会、应该不懂、应该做错；他还是孩子，做不到完全专心，偶尔想玩动一下也正常；孩子好奇，被家里事吸引也正常。认知变了，对孩子发火就少多了。本书会针对常见问题分析背后可能的不合理习惯性思维，提供合理认知参考，这些认知有广泛适用性。当然什么是合理认知没有标准答案，读者可去发现更适合自己的。\n\n现在进入最扎心的部分：\"为什么改变认知并不容易\"。维尼和大二男生交流，男生对自己要求高、追求完美，很多小事要求极致，很累。维尼建议改认知，他说改很难，认知之间环环相套，想改时总有其他认知在支持，难以说服自己。比如他为什么对小事追求极致，除了追求完美的核心思维，还有\"细节决定成败\"\"积少成多\"等认知根源在支持。心理成长方法简单，主要是改变认知，但做到不易，因为目标认知往往不是独立存在的，它像一棵树，下面往往有多条认知\"根系\"支持它。这些根源不改，就难说服自己放下原有认知、建立新认知。\n\n比如这男生虽想放下对小事的执着，但一想到\"细节决定成败\"就放不下——他认为细节能决定成败，小事也是细节，关系自己成败，怎么放？问题在于他对\"细节决定成败\"理解不合理。怎么理解更合理？维尼小语专门拆解：这句话本身有道理，某些情况下所有细节都要做好否则可能失败，比如宇宙飞船制造设计、飞行前飞机检查。但大多数情况下不需要关注所有细节，不是所有细节都能决定成败。比如组织重大会议，尽量把细节做好，但某些细节做不好影响可能不大。另外人的时间精力有限，细节分配时间过多，主要方面时间必然少，影响整体效果。比如考试若对每个题抓不放，最终时间可能不够，连容易得分都丢，得不偿失。所以对细节也不要过于重视。何况人生很多事没有紧密联系，新机遇总会有，\"祸兮福所倚，福兮祸所伏\"，一件事没做好对总体人生成败影响有限，更谈不上细节决定成败，何况人生有时难以用成败衡量。\n\n维尼举了初中女孩案例：她认为成绩很重要，压力过大，不但期中紧张焦虑，连月考周测都恐惧，以至于无法上学。需改变\"成绩很重要\"这一认知。深入交流发现目标认知有多种根源：一是很高目标，一定要考北大，平常成绩不理想预示可能实现不了，所以重视、怕考不好；二是担心考不好同学嘲笑议论；三是认为成绩不好说明能力不行，从而否定自己。不改这几个根源，就难放下对成绩的过多执着。认知树的概念类似萨提亚家庭治疗的冰山理论：看到的只是表面很少部分，更大内在藏更深层次。从认知树角度，表面是目标认知，其实多种根源藏在下面支持它，需改变这些根源才能改变目标认知。这些根源不难发现，只是常习以为常，不探索分析就不会意识到存在或和目标认知联系起来。\n\n还有一个比利时华人妈妈的案例：她状态不错，突然因两件小事心理近乎崩溃。姥姥从国内来比利时送五岁儿子上学，到校门口孩子不让姥姥进，妈妈认为儿子因姥姥不会说比利时语言觉得没面子才这样，认为儿子不孝敬老人，很生气。另外儿子爱逗一岁多妹妹玩，故意堵门不让妹妹出，妹妹着急，妈妈说了好几次、冲他发火甚至打他，孩子不改。这些其实是小事，姥姥也不在意，在旁观者看来很正常没什么，为什么让她陷入焦虑抑郁？深入交谈发现，她执着于孩子小错误有深层认知根源：她身体不好，常看《刘善人讲病》，刘善人认为要逐一检点反省错误（含孝道），真诚忏悔改正才能彻底恢复健康，所以她特别重视反省错误，总在找错误；又一直学中国传统文化课程，特别重视孝道，认为孩子不孝敬是大问题，学久了不知不觉期望孩子完美、自己完美。所以孩子有问题就焦虑（孩子不完美），因对孩子无可奈何、冲孩子发火打孩子而自责（自己不完美）。其实刘善人理论和孝道本身有道理，但她理解有误，形成不合理认知，放大了事情影响，所以一下子焦虑甚至快抑郁。她没意识到这些认知是焦虑抑郁原因，维尼和她探讨后她才恍然大悟。找到并转变这些认知根源后，她很快放下：其实孩子表现很正常没什么；逗妹妹玩也是孩子们玩的一种方式，妹妹着急把妹妹拉过来就行，没什么了不起。认知转变，情绪很快好转。\n\n所以维尼提倡读者自己反省、自助式心理成长，但\"当局者迷，旁观者清\"，有时自己难识别情绪背后的认知，此时需要他人帮助。\n\n再深入一层，\"不合理的认知体系，使改变不易发生\"。成长中我们从各种途径得到并相信一些道理——父母老师同学、书报、自己思考体会，形成一些核心信念。这些道理本身有一定合理性，但也可能有不合理处，或我们理解有问题；一旦相信，每个不尽合理的核心信念会生根发芽，形成不合理的认知体系。比如深受成功学、励志课程影响，若太执着、过于追求完美，会有一些不合理核心信念，每个又衍生多个不太合理的中间信念，每个中间信念又有多不尽合理的习惯性思维，形成不合理的认知体系。而且我们往往存在多个不合理认知体系，互相影响渗透支持，根深叶茂，改变不易。\n\n以家庭教育认知体系为例：父母信奉\"对孩子要严格管教、不能娇惯\"（核心信念），可能在生活习惯、学习、品质多方面都认为应严格要求孩子（多个中间信念）；进一步每方面又形成多个习惯性思维，以生活习惯为例，会在卫生、自理能力、吃饭等各方严格要求。这样核心信念、中间信念、习惯性思维形成认知体系。这些中间信念和习惯性思维的形成也受其他认知影响，比如\"对孩子生活习惯要严格要求\"这中间信念，除与核心信念有关，还可能与\"好习惯决定孩子一生\"\"生活不认真，学习生活怎么认真\"等其他认知根源有关。在这个体系中，\"对孩子应严格要求\"核心信念本身有不合理性（比如学习应严格要求，生活习惯未必），有人理解有偏差，严格要求成了过于严格。由此演绎出的中间信念、习惯性思维自然也可能不合理。其他认知根源也可能不合理，比如生活习惯上\"好习惯决定孩子一生\"可能夸大了生活习惯影响。所以认知体系可能存在诸多不合理认知。\n\n一位女士有痛苦童年，父母要求高也执着，她讨厌这些，但不知不觉内化成性格，对自己要求高也执着，在很多具体方面形成习惯性思维，根深蒂固，常陷入痛苦情绪低落。遇到事没做好就自责否定自己。她知道改变认知重要，试图说服自己转换认知，但感觉困难，因为要想清楚一连串问题才能说服自己。由于每个问题背后可能有一个认知体系，认知环环相扣互相支持，需改变多个相关认知才会有效果。\n\n\"识别深层认知，说服自己去改变\"。识别出不合理的习惯性思维后，需说服自己、建立新的合理习惯性思维。说服过程可能较长，但最后可归结为一两句话，维尼称为\"认知咒语\"，代表说服的全部含义，以后遇到相应情况就用这句认知咒语说服自己。比如一位五年级女生写作业时总想把字、字母、数字、等号写好看，不满意就难受、忍不住擦掉，耽误很多时间，是强迫症状。探讨发现几个认知根源：一是老师以前这样要求，二是觉得学习好的孩子都要写得好看，三是觉得写得好看有价值。三种认知都有不合理处。需说服自己：老师现在已不大要求好看了，到初中更不会；学习好的孩子很多作业写得也不美观，好看与否与成绩关系没那么大；为字写好看每天至少耽误半小时，真不值得。她觉得有道理，最后归结为一句话（认知咒语）：作业写得好不好看没那么大的关系。以后想擦时用这句话说服自己。先多次模拟练习，再在写作业时练习（过程中若还想擦也不要对抗，想擦就擦，心情会放松），这样新认知逐渐成为习惯性思维，就不大去擦了。\n\n再比如：一位来访者父母从小对她要求高，她学习又不好，情急下常打骂她，她感到被羞辱受伤害，想到过去就心痛。维尼建议她学会理解父母，用三种思维重新看待过去，更好面对未来。这不易，她花不少时间说服自己，理由可能好几页纸，最后总结为几句话：父母本意是为我好，只是不懂教育心理才伤害我，这也是命运安排，过去的就过去了吧。这就是认知咒语，代表那些说服自己的理由，以后再想到过去先回忆这句话，慢慢认知咒语成了习惯性思维，建立起认知防火墙，就不再为过去心痛了。\n\n最后是\"慢慢等待开悟\"。维尼讲了个很有意思的体验：听马未都讲收藏，那些价值几千万几亿的文物瓷器，其实不见得比当代优秀瓷器做得更好更精美，只是因年代久远稀少或概念炒作而显珍贵。我们追求的很多东西不也这样吗？其实不像表面那样让人难以放下。那一刻他恍然大悟，满身轻松，好像可以放下执着。但没多久轻松感离去，\"放下\"并不像说得那样简单。他参加过多次追悼会，每次都好像醍醐灌顶，想想生活中那么执着干什么，为名利奔忙有多大意义，离去了一切成空。但回来还是涛声依旧，很多事做不到那么释然。同去很多人可能都有类似感觉。\n\n为什么？当年禅宗六祖慧能和神秀有顿悟渐悟之争，心理成长中需要顿悟还是渐悟？顿悟指顿然领悟，明白一个道理（核心信念），相应很多道理（中间信念、习惯性思维）一下子明白，这种情况部分存在。但由于认知树存在，且已形成习惯性思维，即使核心信念改变，相应的中间信念和习惯性思维大部分也不会自动改变，顿悟就不易发生，所以还需要渐悟，去一一反省和认知重建。另外，一般人还要过正常生活，有世俗追求、家庭责任，完全放下不可能；至少从家庭角度，不能要求爱人孩子像自己一样\"放下\"；很多世俗名利物质也会给人幸福，对心理可能有益。即使禅宗也提倡用出世精神入世，而非完全出世。所以对一般人，需要做的不是完全放下，而是适度放下；不是不执着，而是不要太执着，学会适度执着。在很多具体方面需把握好度，但尺度难把握，需反复实践思考，做起来不易。所以心理成长常常是渐进过程。顿悟有作用，有时会一下子想明白不少东西，但更需要渐悟，慢慢开悟，慢慢来。\n\n好，第二章就到这里。我想请你记住几个关键词：ABC理论——情绪来自认知而非事情；自动化思维尤其是习惯性思维——躲在幕后几十年的主角；认知树和认知体系——为什么道理懂了还改不了；认知咒语——把说服自己的理由浓缩成一句话；以及最重要的一句话：心理成长是渐进的过程，慢慢来，别指望顿悟一步到位。下一章，我们要认识维尼老师最著名的发明——\"三种思维\"，那是内心真正强大的神器。我们下章见。\n"}, {"title": "第三章 内心强大的神器：三种思维", "text": "各位朋友，我们来到第三章——\"内心强大的神器：三种思维\"。\n\n这一章是整本书里流传最广、被读者用得最多的一章。维尼老师常说的\"三种思维\"，可以说就是他心理成长体系里最核心、最实用的一件武器。什么叫真正的坚强？书里开篇就给了个很颠覆的答案：真正的坚强，不是能够承受痛苦，而是面对挫折和失败时\"不管风吹浪打，胜似闲庭信步\"。学会三种思维，改变自己的认知，面对挫折就能淡定从容，收获真正的坚强。\n\n这一章我会和你聊这几块：第一，为什么\"忍耐力强\"不等于坚强，真正的坚强到底是什么；第二，三种思维到底是哪三种，怎么用；第三，用三种思维做到实事求是，它和阿Q精神到底有什么本质区别；第四，两个真实的读者来信，让你看看\"很正常，没什么\"六个字怎么把人从抑郁边缘拉回来；第五，怎么通过自我觉察改变不合理思维；最后，维尼老师也会坦白认知疗法的局限性，帮你建立完整认知。\n\n先说那个记者朋友的故事。有一次维尼和一位记者朋友聊天，朋友说自己压力很大，经常焦虑低沉，心里像压了块石头，但是他能承受，总能振作起来继续工作。这种承受能力算强的——虽感到痛苦、烦躁、焦虑、抑郁、沉重，但能忍受、能坚持。这种忍耐和坚持的能力，就是一般人所说的坚强。但是，这是一个痛苦的过程，颇为煎熬，有时也会觉得难以承受，甚至真的崩溃。所以这种坚强虽要赞许，但并不是真正的坚强。\n\n那么什么是真正的坚强？面对各种挫折、失败、不如意，开始可能也有些心理冲击，但经过心理调节，很快能做到内心平静淡定，\"不管风吹浪打，胜似闲庭信步\"。这样一来，自然不需要忍耐、坚持，就能轻松承受挫折——因为本来就没多少痛苦，不费多大力气，不需要多强大的忍耐力。这种坚强才真正可靠。而这种方法，就是认知疗法。\n\n回忆认知疗法原理：不是事情本身，而是对事情的认知直接导致了情绪和行为。所以改变对事情的认知，就改变了情绪和行为。换言之，遇到挫折失败，让我们痛苦的最直接来源不是挫折失败本身，而是对挫折失败的认知。人为什么会敏感脆弱？往往不是神经类型等生理因素决定的，而是更多地看到消极面，放大负面影响，把事情看得太严重，或过于执着、不肯接纳现实，这样自然容易引起不良情绪，显得敏感脆弱。如果改变认知，用合理积极的方式看待挫折，自然容易淡定从容。多做这样的练习，逐渐形成习惯性思维，建立认知防火墙，面对挫折时自动用合理思维应对，心态自然轻松，承受力增强，能坦然面对挫折，坚强的性格就形成了。\n\n书里一位女孩在维尼这里咨询，缺乏自信，常受领导批评，总开心不起来，感觉痛苦。她恨自己为什么不能坚强起来、勇敢承受痛苦折磨。听了维尼关于坚强的观点，她恍然大悟：变得坚强的根本途径，不是看起来很能承受、内心痛苦却强作欢颜，而是学会改变认知，从而淡定面对一切。遇到挫折失败打击，内心不起多大波澜，很快坦然从容。她感到这种坚强是可以通过努力做到的。\n\n那么如何改变认知？古今中外有个普遍心理规律：面对挫折失败，如果我们觉得这事很糟糕、很严重、难以接受，自然感到沮丧痛苦懊恼焦虑；但如果改变认知——发现坏事也有好的一面，或经过努力可能变好事；或事情不像想象中那样糟糕，可能很正常没什么；或虽然有些糟糕，但应该接受现实，努力之后顺其自然——自然就淡定平和，容易坦然面对。上面三句话就是三种思维。\n\n第一，坏事变好事：坏事也有好的一面，或经过努力可能变好事。第二，很正常，没什么：事情不像想象中那样糟糕，可能很正常没什么。第三，顺其自然：虽然事情有些糟糕，但努力之后不妨接受现实，顺其自然。\n\n维尼举了两个自己的生活例子。一次回老家，高速公路临时封路，堵得厉害，预计可能赶不上火车。但有了三种思维，一路安然淡定。第一，坏事变好事：乘火车从没误点改签过，如果误点了，也是一种经历，对心态是一次磨炼，也是好事。第二，很正常没什么：出现不顺利意外本是人生常态，改签一样可以回家，不过是耽误些时间，其实没什么大不了。第三，顺其自然：高速封路是预料不到的，且已提前两小时出门，堵车就堵车吧，无法改变就安然对待。这样想，自然风轻云淡。\n\n另一次从青岛去山西太原图书大厦讲座，快开始了，组织者歉意地说：\"维尼老师，今天不知怎么回事，才来了十几个人，您那么远过来……\"维尼笑笑说没关系，来多少算多少。为什么能泰然处之？因为三种思维帮助。首先，虽人少，但来的都有诚意，可充分互动交流，也是好事。其次，书店讲座就这特点，历来人不多，再说自己也不是明星，这样很正常没什么。第三，组织者做了该做的事、必要宣传，最后来多少顺其自然。即使一个人来，也怀着诚意去讲。有了这心态，讲得自然生动，观众慢慢聚集越来越多，效果不错。\n\n好，三种思维具体怎么展开？\n\n坏事变好事。我们遇到的挫折不顺利，看起来是坏事，但\"塞翁失马，焉知非福\"，坏事本来就有好的一面，或经过努力可变成好事。这是很普通平常的道理，人人都知道，但很少有人把它变成习惯性思维，所以遇到事想不起来，自然用不上，需要有意识地运用，逐渐形成习惯性思维。遇到\"坏事\"先想想有无好的一面，或经努力变好事，心情自然轻松。维尼有段时间腿受伤，虽是坏事，但可在家安心写作，也不错。孩子某次考试成绩不理想，也有警醒作用，能及早暴露问题及时改进，坏事变好事。遇到心理问题，虽暂时困扰，也是成长机遇，通过努力可变成财富。一位刚毕业老师被分到当地最差初中，学生素质差、课堂乱、家长不重视，她很伤心哭了两天。维尼鼓励：坏事也可变好事，在相对差学校，成绩压力小，可潜心研究教育课题，如处理和学生的关系、维护课堂秩序、激励后进学生，把精力放孩子全面成长上，更能体现教师价值。她听后好多了，后来体会这学校给了她很多不同锻炼机遇，若分到好学校反而没这机会。《道德经》说：反者道之动。转念之间，豁然开朗。\n\n很正常，没什么。维尼以前是个容易纠结的人，常为一些事烦恼。有个朋友挺想得开，常乐呵呵，他常说一句话\"多大的事儿啊\"，让维尼若有所悟——很多时候是自己把事情看得太严重，才有那么多纠结烦恼，其实可能不是什么事儿，没什么了不起。后来，\"很正常，没什么\"成了维尼的六字真言，看似平常，却是淡定从容的秘诀。为什么会痛苦沮丧？可能因为觉得事情很严重。但事情真的严重吗？是不是夸大了影响、看得过于严重。\"很正常、没什么\"提醒我们看到真相，不要放大影响。\n\n不顺利时若感叹怎么这么倒霉，自然沮丧懊悔；换个角度，人生不如意事十之八九，不顺利可能正常，谁都会遇到，可能就觉得没什么了。比赛输了，难受也无济于事，可劝慰：这很正常，谁都可能输，有什么了不起，下次再来！不小心丢钱，可能懊恼，但有用吗？转念一想，丢钱很正常，谁都会遇到，以后注意就行，多大的事啊！做一件事因不熟悉没处理好，心里遗憾；换个角度，没经验自然易出差错，很正常，总结教训就有经验了。认知变，情绪变。网络约车司机有时来晚了，埋怨焦急也没用，其实理解别人，司机不可能熟悉每段路，有时迟到也正常，晚了一般也没多大关系，这样安然欣赏路边风景也不错。古罗马斯多葛派爱比克泰德举过例子：去澡堂前先想，有人会推搡、骂人、偷东西，这些是自然的，这样真遇到就不会被打扰。知道哪些事正常，就会从容面对。\n\n一个男孩在维尼这里咨询，为很多事做得不够好而自卑，其实他才20多岁，做得不够好也\"很正常、没什么\"。情绪有些低落，他为此苦恼：怎么就不能调节好心理呢？其实心理调节是一门学问，他没学过，不懂如何调节也正常，不代表无能。认知转变，感觉轻松多了。当然，有些挫折失败不是\"没什么\"的，而是严重的，但细分析，可能不像想象中那么糟糕。比如高考失利没考上理想大学，较严重，但真那么糟糕吗？未必。大学只是四年，学习是一生的事，这四年能决定一生吗？未来竞争是综合素质竞争，学历差异只是部分，机遇总在，可坦然面对。事情真的那么严重吗？真的有必要那么纠结痛苦吗？其实大部分只是想当然的结果，换个角度，原来是很正常没什么的。佛法讲的\"空\"是心超然万物的境界，很多人不知如何达到，\"很正常，没什么\"是帮助人们\"放下执着\"的方法，向超然境界进了一步。\n\n顺其自然。维尼有一种核心思维：努力去做，对结果顺其自然。遇到\"坏事\"应去努力，争取变好事，但自然会有不好的一面，可能还有些糟糕，不是\"没什么\"的，此时还需要顺其自然。顺其自然后，心就静了，不去懊悔自责，面向未来做实在努力，这是淡定而积极的态度。\"顺其自然\"类似\"尽人事由天命\"中的\"由天命\"，通俗说就是\"听天由命\"\"服从命运安排\"，听起来有些消极。很多人在成功学、励志课程激励下，常相信意志坚强、\"只要努力梦想就一定能实现\"，所以对此难接受。努力进取也要遵循中庸之道，可努力克服艰难险阻、争取掌握命运实现梦想，但如果尽力了，因主客观条件所限没达到预期，不妨顺其自然听天由命。小事情同理。这样心情平静，减少内耗，有助继续努力；不肯接纳现实、陷入懊悔痛苦自责，只增内耗削弱动力。\"由天命\"不是说一生下来命运注定不可改变，只是说一个人力量有限，不是想怎样就怎样，一件事能否成功由很多主客观条件决定，所以尽力后可安然接纳现实，服从所谓\"命运\"安排。\n\n孔子说五十知天命。曾国藩年轻时信奉\"人定胜天\"，推崇意志力量，说\"志之所向，金石为开，谁能御之\"，靠意志才能做出许多事。但在由\"大荣\"转瞬变\"大辱\"后，他陷入抑郁常失眠，此时才体悟人力无奈、命运难测，开始\"畏天命\"。体悟之后，曾国藩一改过去急切急躁，处理大事从容不迫，反而立下不世之功。听天由命看似消极，但在\"尽人事\"之后\"由天命\"就是积极的——知道\"人不是想怎样就怎样\"\"有些事自己不能决定\"后，所要做的就是在尽可能范围内尽自己能力，而不必把失败责任都揽在自己肩上。这样面对不顺利失败会坦然坚强，进而振作继续努力。毕竟人生是马拉松不是百米冲刺，不把精力消耗在痛苦懊悔自责中，反而更可能达到胜利终点。\"尽人事，由天命\"\"努力之后顺其自然\"，这是中庸之道，帮助我们安然宁静。\n\n学会三种思维，做到实事求是。面对挫折失败，可按三种思维顺序分析：先想想有无可能变好事，如有好的一面或能变好事，心情自然平静些；如果变不成好事，再看这件坏事是否很正常没什么，不像想象中那么糟糕，可能进一步淡定；如果确实是比较糟糕的事，努力之后顺其自然就行。\n\n有人问：三种思维是否自欺欺人的阿Q精神？维尼答：阿Q精神与认知疗法道理一样，也是通过改变对事情的认知调节情绪。但阿Q精神是自欺欺人的，分明挨了打，他却想\"这是儿子打老子\"，用虚假胜利自我安慰。而三种思维是实事求是的：坏事本来就有好的一面，或经努力可变成好事；人容易夸大负面影响，其实事情本身不像想象中那么糟糕；有时也只能面对现实顺其自然。其中饱含传统文化智慧。\n\n看似简单，却是解脱的法门。一位德国华人妈妈在维尼这里咨询，\"很正常，没什么\"给她带来成长改变。她说自己容易纠结、太执着，虽学佛多年不知如何将佛法用于生活，所以没多少长进。现在看来维尼老师说的\"很正常，没什么\"就是佛法在生活中的应用。这六个字看似简单，用处非常大，能让她放下执着、心情平静、学会接纳他人接纳事实。她以前特别纠结孩子（4岁）不尊重她，认为这是特别大问题，非常生气，为此打骂孩子、睡不着觉，差点抑郁。维尼说孩子还小，表现很正常没什么，可能是情绪宣泄，不代表不尊重。后来一想确实没什么大不了，对这年龄孩子正常，也就没火气了。现在孩子偶尔好像不尊重她，她一想\"小孩子，很正常，没什么\"，就不纠结了，也不冲孩子发火；确需沟通，等情绪平复后再说。\"很正常，没什么\"用多了成习惯性思维，很多事一想就放下执着、心情平静放松，也有智慧解决问题了。\n\n比如以前她觉得薯片吃多会上火，执着非要严格定规矩限制孩子吃薯片，现在想想多吃几片真会上火吗？多喝点水就好了，其实没什么大不了，小孩想吃几片也正常。所以现在能灵活变通，本来说好给两片，他实在还想吃就多给两片，大家都开心，孩子和她关系也很好。她理解孩子某些额外要求很正常没什么。维尼认为规则执行要有弹性。一两个月过去，她情绪越来越好。以前一生气紧张就胃胀气背痛，现在胃好了背痛好转，肌肉没那么紧张。以前每当事情达不到要求就想不通不接受、心里不高兴抱怨别人，情绪逐渐积累，时间长有些抑郁进而睡不着，更抑郁焦虑。比如生孩子时，她觉得生了儿子，婆婆老公应好好照顾她，他们没达到要求她就抱怨、情绪糟糕以致睡不着，负面情绪越来越严重，还让她胃胀气失眠，最后得产后抑郁症。现在想想，当时若能及早改变认知，理解婆婆老公没达到要求其实\"很正常，没什么\"——他们有些事可能想不到，这很正常——负面情绪不积累，也就不会抑郁。\n\n以前婆婆说她一句，她会想凭什么说我啊，很不高兴无法接纳。现在想想为什么不接受呢，那是别人的话，我控制不了，想让婆婆把话收回也不可能；再说了，婆婆说就说吧，很正常，其实没什么了不起，觉得婆婆说得不对不去管就可以，就不纠结了。\"很正常，没什么\"，看似简单，却是解脱的法门。回想曾经有过的纠结烦恼怒气，恍若隔世。\n\n自我觉察，改变不合理思维。这是一位妈妈的领悟，标题是\"抑郁、焦虑，只因太勉强自己\"。她一直觉得自己是个心理有问题的人，常觉得活着没意思很累。有时不明白，别人能悠闲走在明媚阳光下，为什么她做不到。女儿到来带来的不是喜悦而是忧虑，怕女儿像她这样活着，快三十岁一事无成连朋友都没有，这世界没人理解她，多可悲的人生。她一度不能看到听到\"一生、一辈子\"这样的词，否则抑制不住流泪。有段时间陷入痛苦无法自拔，好像世界没东西能让她感兴趣，这感觉太可怕。恐惧痛苦中开始失眠掉头发嘴巴起泡。她觉得不能再这样，找到维尼帮忙。第一次电话咨询情绪失控，边哭边语无伦次诉说从小到大种种痛苦，她是那样渴望被理解被倾听。维尼认真听完，告诉她有这种情绪很正常、理解她，她感动得再次哭泣。一个多小时后情绪慢慢平静，老师才一点点指出她困惑和痛苦源头：她不接纳现在的自己，要强，总在勉强自己。维尼提的几个问题，是她自己从未意识到的。原来一直自卑悲观，为克服读了很多励志书和名人传记，通通没效果，反而因做不到压力更大。她疑惑：看这么多书为什么还这么痛苦？现在明白了，从未认清病症所在，没对症下药，怎么会好。\n\n第二天整个下午她看维尼几篇博文反复看。几小时后认知疗法派上用场。她的习惯性思维：怎么一下午才看这么几篇博文啊？都是因为学历低所以悟性差！这时她很不舒服。但马上想到认知疗法：又在勉强自己了，又没人规定一天必须看几篇，也没人逼自己，学会才是目的啊！改变认知后她自己都笑了，总和自己较劲活得多累，为什么不能顺其自然。找到根源对症下药，疗效不是一般好，她感觉每天在进步。有天晚上请老公帮她把地图粘墙上，胶带都准备好了，老公说明天再弄，她叫了几次老公坚持明天。若是原来的她，不是找老公发脾气就是气得睡不着。此时她转变认知：明天就明天呗，顺其自然，只是晚一天，有什么大不了？为什么那么追求完美非要今天弄完？这样就不生气了安心睡觉。就这样，有不良情绪时她学会识别背后不合理习惯性思维，逐渐建立合理习惯性思维，情绪越来越好。\n\n前几天老公嫌电脑慢重装系统，她发现女儿从出生到现在所有照片视频都没了，多珍贵啊，火气一下子起来，马上给上班的老公打电话指责。孩子感觉到她坏情绪非常害怕一直要她抱。她意识到这样解决不了问题还会吓着孩子，尝试改变认知：老公有时想不到其实很正常，他也不是故意的也不想这样，他也很后悔。这样想就平静些。另外事情真那么严重吗？想想QQ空间有一部分照片、相机里一小部分、妹妹那儿也有一部分，算一下损失不像想象中严重。而且坏事也可变好事：总结经验教训，以后一定备份，再买个移动硬盘和电脑双保险，避免再出问题。几分钟后她彻底平静，又给老公打电话把想法转变说了一遍，老公受用，对她的宽容感动。这次事件把俩人关系拉得更近，还真坏事变好事。调整好心态才有正确思考判断。以前心态不好走很多弯路浪费时间，以读育儿书为例，以前遇到不懂的理念方法，习惯性思维就是\"我学历低我无能我对不起女儿\"，感到沮丧没信心劲头学习。现在认知改变：就是因为不懂我才要学习啊，学会了不就懂了吗？道理就这么简单，原来的她却像被施魔法深陷其中。现在破解魔法的咒语就是认知疗法。\"静能生慧\"，心态平和了她开始思考适合女儿的小方法，女儿两岁多玩动物串珠能坐半天，她想可以和女儿一起玩，说小动物英文名字让她找来串，女儿学了不少英文玩得开心。她学会三种思维，把这淡定思维模式传给孩子。孩子用积木摆高楼，开始摆几次不高就倒，后来不肯摆总要求妈妈摆。妈妈摆时也故意摆不高就倒，轻松说\"倒了也没什么关系啊，很正常的，再摆时轻一点哦\"，几次下来孩子受感染不再抗拒\"高楼倒塌\"，开始自己摆，倒了还不忘说\"轻一点哦\"，学得真快。原来她不明白自己为什么那样，看很多育儿书了解到不快乐源于童年，越了解越无法释怀，给自己贴标签后拿放大镜找童年种种被伤害，让活在当下的她很痛苦。读了维尼博文《不再抱怨父母，自己担起责任》后豁然开朗——怪父母没用，心态可通过改变认知改善。现在再回忆童年也不尽是伤害，也有父母爱。放下对童年纠结，顿感轻松。心态变好世界变美好，她和老公关系及教育女儿心态都走上良性循环。认知改变，是她人生美好的开始。\n\n认知疗法的局限性。改变认知是心理成长最重要的方法，应用广泛。但心理复杂，与多种因素有关如情绪习惯，所以认知疗法有其局限性，某些情况需要其他方法配合，单纯运用效果不好。比如强烈情绪状态如抑郁愤怒烦躁焦虑时，最好先通过运动等转移注意力调节情绪，等情绪平静后再调节认知，效果更好。再如恐惧这类情绪常莫名，改变认知效果不大，此时系统脱敏法（行为疗法一种，逐步循序渐进适应克服恐惧，每一步恐惧都易接受克服）可能效果更好。再举一例，维尼认为强迫症实质是习惯性怀疑，与习惯有很大关系，只改变认知不能取得良好效果，需综合解决方案。\n\n好，第三章就到这里。三句话送给你：真正坚强是\"胜似闲庭信步\"的淡定，不是咬牙硬扛；三种思维——坏事变好事、很正常没什么、顺其自然——是人人可用的神器；而\"很正常，没什么\"这六个字，是维尼老师的六字真言，值得你天天念。下一章，我们去认识一个更\"神秘\"的东西——驱力，搞懂为什么我们有时难以自控。我们下章见。\n"}, {"title": "第四章 影响我们的神秘力量：驱力", "text": "各位朋友，第四章——\"影响我们的神秘力量：驱力\"。\n\n如果说前面认知疗法、三种思维，解决的是\"怎么想\"的问题，那么这一章要解决的，是\"为什么想明白了却做不到\"的问题。维尼老师这一章开头就抛出一个很多人困惑的现象：我们为什么有时难以自控，行为、情绪不听意志的指挥？这往往是由于驱力对我们的影响。在心理学界，对驱力的研究一百多年前就开始了，却不为大众所知，也没充分应用到心理成长中。让我们一起来了解这种神秘的力量。\n\n这一章我会和你聊：第一，什么叫驱力，为什么我们体内好像有两股力量在打架；第二，常见的驱力来源有哪些——情绪、思想意识、欲望、习惯；第三，怎么去驾驭驱力、提高自控力，这里有一整套实用方法；第四，怎么用综合方案克服拖延症，维尼老师还拿自己写这本书时刷手机拖延的经历现身说法。\n\n先说\"当时忍住就好了\"。相信很多人面临过这个困扰：为什么有时难以自控？比如知道不该发火却忍不住；想按时完成任务却一再拖延；明知道有些事不该做却还是做了。原因可能很多，有一个很多人陌生、初次接触觉得神秘的原因，就是驱力的存在。其实一百多年前很多心理学家就开始研究驱力，但在心理成长方面没得到充分应用，也不为大众了解，不能不说是遗憾。理解驱力，对理解心理、做情绪行为的主人意义重大。\n\n先观察自己。是不是有时感觉难以自控，行为不听意志指挥？有时体内好像有两股（甚至更多）力量斗争？一股是意志，此外还有一股（或几股）不\"听话\"的力量。意志让你向东，那股力量却驱动你向西；明明知道不应该向\"西\"，却不由自主地那样做。一位男孩在维尼这里咨询，有追求完美性格，对书写尤其追求完美，字写得不好觉得不舒服非要擦掉，擦掉后又觉得不那么干净觉得难受。他说感觉体内像有两种力量在斗争。这种\"神秘\"力量是什么？\n\n这就是驱力。心理学定义：驱力是指个体由生理需要所引起的一种\"紧张状态\"，它能激发或驱动个体行为以满足需要、消除紧张，从而恢复机体平衡状态。其实大家对驱力不陌生。比如对上瘾的人来说，想打牌抽烟喝酒玩游戏看微信时，虽知道不该，却好像被一种力量吸引或推动着不由自主去做；对强迫症患者，想去反复检查验证，难以忍住不做，因为此时会感觉不舒服（紧张状态），去做了这种紧张状态才会消失；很生气时，情绪就是一种驱力，让人难受，推动我们发火才舒服些；有性需求时不满足，那种欲望那种紧张状态会持续让人……这些都是驱力的推动作用。在驱力作用下，虽意识到不该做，但想克制就会感觉紧张状态，去做了才舒服。\n\n驱力通常在两方面对我们产生负面影响。一是驱力不足导致拖延，比如知道该写文章却不想动笔，该学习工作却不想开始，该锻炼却懒得去，该干家务却懒得动……缺乏驱力，意志战胜不了惰性，造成拖延。二是当意志与驱力矛盾时，驱力太强，有时战胜意志。比如明知不该看微信玩游戏却忍不住去看玩，不该对孩子发火却忍不住大发脾气，不该喝酒却不由自主又多喝几杯，强迫症患者明明知道不该反复检查还是忍不住又去做……由于驱力作用，我们难以自控。这些就是驱力与意志的错位，也是目前流行拖延症的重要原因——该做的事因缺乏驱力推动拖着不想干，同时抵御不了手机电脑等电子产品诱惑，在驱力推动下做不该做的事。\n\n常见驱力来源有几种。第一，情绪驱力。情绪通常产生\"紧张状态\"或\"不舒服感\"，推动我们不由自主做些什么以宣泄或消除这种感觉，古人成语\"情不自禁\"恰当描述了这一现象。高兴快乐时比如看比赛兴奋激动会情不自禁大叫鼓掌跺脚甚至跳起，才舒服过瘾；有高兴事忍不住想与别人分享，说了才舒服。维尼在青岛喜欢中甲CBA比赛，主场胜利后总想去贴吧看大家评论发发言才痛快。类似地，烦恼纠结愤怒遗憾时也想找人说说，说完舒服多了。生气时可能忍不住骂人摔东西，想忍也忍不住，不然难受。抑郁忧虑焦虑时，不舒服感让人难受，驱动我们不由自主反复想相关事情。恐惧感觉也驱动我们避开那些害怕的事。情绪驱动下人可能\"情不自禁\"难以自控，这是心理规律。为提高自控力，我们可加强意志力，但效果有限，意志也常失效，最好策略是\"釜底抽薪\"，通过认知疗法改变情绪，也可通过转移注意力让情绪恢复平静，情绪改善自控自然容易。\n\n第二，思想意识的驱力。思想意识分三类：一是有意识思维产生的，属意志理智，是行为指挥官，产生的驱力可称意志力，计划安排目标需要期望产生的驱力都归此类；二是直觉式思维产生的，有随意性，与意志要求可能矛盾，比如本要开始工作，临时想起来要做什么事就影响进度；三是习惯性出现的思想意识（习惯性思维），比如回家就想看手机，到时间就想去锻炼，看到家里乱了就想收拾，这与习惯的驱力一致。\n\n第三，欲望的驱力。弗洛伊德说：人类是充满欲望并受欲望驱使的动物。人有各种欲望，当欲望从心里升腾起来就成为驱力。如果欲望与意志一致，就有力推动行动；有些欲望如胜利成功成就成名赚取财富获得权力得到认可受重视赢得爱情的欲望会推动拼搏努力。当欲望与理性或意志矛盾时，常成为捣蛋鬼，有时无可奈何。很多人减肥失败，有时因美食勾起欲望战胜理智；性欲驱力有时让理智\"颜面扫地\"；想玩游戏打牌吸烟喝酒或赌博成瘾，这种欲望驱力难抵抗；有些人表现欲强就爱出风头惹人厌烦。维尼有段时间总去看微信消息参与微信群辩论，明知浪费时间却总忍不住，因多种欲望驱动：好奇看热闹的欲望、表现自己的欲望、分享宣泄的欲望、争强好胜的欲望、辩论中防卫的本能等。好奇心也是欲望，推动人把事情搞清楚才舒服，比如孩子写作业听到父母说新鲜事会忍不住凑过来问，这是好奇心驱动，一般孩子要求克制不大容易，从这个角度思考就会理解孩子了。对于洁癖患者，当怀疑手不干净时，完成的欲望驱动人不由自主洗手，不去洗觉得难受，洗了才舒服；东西找不到，完成的欲望让我们觉得不舒服驱动去找，这些都与心理张力原理有关。维尼小语讲心理张力原理：一笔画圆有意留一小段空白，回头看这圆你脑子里必定闪现填补空白弧形的意念，因你总有未完成感心态想竭力寻求终结获得心理满足。德国心理学家勒温认为人类有自然倾向去完成一个行为单位，比如解谜语学一本书，叫\"心理张力\"。欲望产生的驱力有时难以抗拒不易自控，这是心理规律。\n\n第四，习惯的驱力。习惯的驱力非常重要，稳定持久发挥作用。好习惯帮我们顺畅轻松做该做的事，不良习惯是难以克服的障碍。能改变不良习惯建立良好习惯，自控就容易些。维尼家附近有游泳馆，他办了年卡有一段时间几乎天天去，因养成习惯每次去都自然。后来因事好几个月没去，再想去就懒得动弹需鼓鼓劲儿才去。一起游泳的朋友都有这感觉，这就是习惯驱力的作用。很多人从没意识到驱力存在，但它一直有力影响我们。意志不是唯一主宰，如果情绪习惯欲望本能与意志矛盾，在驱力作用下意志可能暂时失去主导地位。一个人像团体，意志是领导，情绪习惯欲望本能习惯性思维等是下属，大家想法一致团体运行自如；出现矛盾时若领导力量足够强也能按意图运转；若领导疏忽或部下力量过强就会失控。\n\n如何通过驾驭驱力提高自控力？维尼介绍一些方法。第一，主动想象，增加驱力。与思维语言相比，生动想象能更直接产生驱力，所以驱力缺乏时可主动想象激发驱力。维尼大学毕业到科研机构，每两年一次运动会，跑步擅长能拿冠军。开始几年赛前会不由自主想象比赛激动场景，自然兴奋激动渴望比赛（驱力增加）；后来参加多了想象少了就没那么兴奋（驱力减少）。恋爱男女约会前会不由自主想象见面情景通常充满期待（驱力增加）；相互熟悉习惯后想象减少期待不强（驱力减少）。可见丰富生动想象能增加驱力。这两例想象都自然出现让人期待兴奋激动自然激发驱力，当然也可主动想象。维尼不大想写作时会想象看到一篇流畅充满智慧文章诞生后的喜悦，就有热情写作。懒得出去办事，想象阳光下行走清风拂面感觉就很容易出去。不想洗澡，想象热乎水冲身上舒服感觉沐浴后神清气爽精神焕发形象就愿去洗。懒得晒被子，想象有阳光味道被子盖身上暖烘烘感觉就有劲头去晒。懒得叠被子，想象床铺整洁美妙就想去叠。不想参加赛前训练，想象比赛激动人心场景动力就来了。在形成习惯前需主动有意识想象，慢慢形成习惯后驱力自动产生就不需要主动想象了。\n\n第二，改变认知，驾驭驱力。驱力会驱动我们不由自主做明知不该做的事，改变认知形成合理习惯性思维是减少此类驱力好方法。比如想减肥却不由自主又吃多了，这行为背后存在与主观意志矛盾的认知，比如看到饭菜剩了不想浪费或怕下一顿不新鲜所以想吃完算了，不妨转换认知：吃了更浪费，想减掉摄入卡路里多麻烦，剩下就剩下吧；有时怕吃得不够或饿坏肠胃，这认知也不合理：成人所需食物比想象少，只要不过分节食按时进食少吃多餐就不会把胃饿出毛病，认知改变克制就容易多了。经受不住手机游戏吸引，可反复说服自己：这些其实没啥意思。看似简单，若形成习惯性思维有助抵御诱惑。面对他人谩骂人身攻击可能忍不住回击但可能两败俱伤，想保持风度心态平和可告诉自己查理·芒格名言：不要和猪摔跤，猪乐此不疲你却沾一身泥，这句话能很好消除回击冲动（驱力）内心坦然平静。很多父母明知不该对孩子过多发火却忍不住，这是情绪驱力所致火气大想忍难忍，想减少火气可通过理解孩子改变认知，认知变了火气自然减少或消失，不需克制驱力自然减少或消失。另外驱力不足也可通过改变认知增加驱力，比如树立适当目标认识事情重要性和急迫性等。\n\n有一位六年级男孩在维尼这里咨询，追求完美纠结小事情，比如先写作业还是先玩哪个更有效率、穿长袖还是短袖哪个最好（临近毕业考试怕穿少感冒），他会为这事和妈妈吵一两个小时，心里过不了坎儿非要最佳答案。这个坎儿就是追求完美的认知产生的驱力，不找到最佳答案总觉得不舒服。想消除这种驱力需改变追求完美的认知及各方面习惯性思维，比如先写还是先玩效率也许只差十分钟，为此纠结一两个小时不值得，自己喜欢怎么做就怎么做不必非要最佳答案，认知变了驱力自然减少不那么纠结，当然认知改变过程可能不易。\n\n第三，调节欲望，转移注意力。如果出现不适合的欲望对工作生活产生障碍怎么调节？两途径：一是改变认知，二是建立新习惯。维尼以前有问题：家里东西找不到了总觉得不舒服所以执着去找，这是\"完成欲\"驱动，不合理会耽误时间事情，需改变。他慢慢说服自己改变认知：东西又没长腿丢不了肯定还在家里，想找时怎么也找不到，不找时可能不经意发现。转换认知就不执着非要找到，成习惯性思维后行为习惯就变了。有的孩子急脾气遇什么事急得不行也是驱力太强，不妨渗透新认知：不着急慢慢来，渗透多了成孩子习惯性思维可能就不那么着急。过于期盼有时也感觉煎熬不舒服可调整认知：也许自己想象太美好，完成心愿时可能没那么美好精彩（普遍现象符合实际），这样可悠然等待。另外欲望有时只持续几分钟，此时不妨转移注意力或适当忍耐克制，过会儿可能自然消失。维尼听说一位同事发生奇怪事有些好奇但理性告诉自己不该打听，怎么克制？转移注意力好方法，和别人聊会儿天欲望慢慢消失。有时从欲望根源入手，比如明知追剧花时间却被剧情跌宕吸引，不妨先把分集剧情看了失去悬念欲望就减少很多；美食诱惑难挡可在饭前多喝汤感觉饱了欲望自然减少。欲望太少也造成拖延，比如孩子写作业磨蹭就是缺乏写作业欲望，可帮孩子取得进步和成就感从而产生兴趣信心，自然有想学习欲望写作业不磨蹭。\n\n第四，利用习惯的力量。习惯的驱动力量持久稳定，对自控克服拖延很有帮助。如果孩子习惯看电视会总想去看想克制也难；养成不看习惯甚至想不起来看。没锻炼习惯想去锻炼总懒得动；养成习惯不去锻炼还觉得难受。打算减肥开始克制吃欲望还需费力气，形成新饮食习惯就轻松多了。曾经维尼一上网就先去看财经新闻影响写作计划，后来逐渐克制减少看的时间和次数慢慢就不看了，形成习惯后不需自我克制就能轻松做到。如果对学习工作常拖延可设法（如用想象方法）让自己启动，几次后若形成习惯就容易进行，比如写作新书开始不太想动笔养成习惯后写作自然顺畅。\n\n第五，做事之前先热身。如果觉得工作任务繁重可能不太想开始，此时可先做些简单事热热身有了驱力就容易进入工作模式。去跑步开始懒得动先慢慢跑热身等活动充分有了跑步驱力就迈开大步。不想开始写作先写点简单轻松的有了写作欲望再入正轨。维尼女儿有段时间不想弹钢琴，建议她先弹熟悉曲子逐渐激起弹琴欲望再去练新难曲目就容易顺利完成。孩子看到作业多不想写可先写轻松作业有了驱力再写难的也不迟。热身有助于形成习惯从而改善拖延。\n\n第六，借驱力之势。人们常说趁热乎劲儿赶紧把事做了，就是说此时有驱力愿意做顺势多做一些更有效率，过了热乎劲儿驱力消失就懒得做。比如从外地旅行回来趁热乎劲儿把箱子收拾好很快完成，不马上收拾可能好几天懒得收拾。工作学习做家务劳动锻炼都有这特点。孩子也是如此，比如写作业看书劲头正足即使吃饭时间到了也可趁驱力让孩子多做一会更有效率。\n\n第七，借助外界力量。驱力影响显著有时需借助外力更好自控。不想学习可找适合环境如图书馆咖啡厅良好氛围帮我们沉静。网络微信上有些打卡学习小组如扇贝单词借助团队力量增强学习驱力抵御诱惑。为抵御看手机诱惑可用番茄钟Forest APP，每完成一个30分钟番茄钟种一棵小树，若中途打断树苗枯萎还有温馨可爱提示语帮你会心一笑放下手机。适度压力也有助于摆脱拖延，维尼以前一位同事已是名校本科毕业还报自学考试借助考试压力学东西。家庭教育中若只靠孩子力量往往难抵御手机游戏玩耍诱惑有拖延，此时若亲子关系良好父母注意方式方法对孩子适当限制管理能帮他更好抵御诱惑。\n\n克服拖延症需要综合解决方案。维尼开始写作本书时就受\"拖延症\"困扰，难抵御手机诱惑常忍不住看微信QQ消息参与微信群\"争吵\"耽误不少时间写作计划一再拖延。不过这也是心理成长机遇，提供不少观察分析驱力的机会，还可借机研究如何摆脱拖延症。摆脱拖延症不易，往往需综合解决方案慢慢来。现在回想起来最重要还是改变认知，比如为什么关注微信？往往有多种原因多种欲望驱动。想消除这些欲望有个诀窍：告诉自己这些事其实没啥意思。比如微信群发言发帖其实没意思，看别人发言帖子也没意思，质疑别人没啥意思，争论其实也没意思……这些事是否有意思只在一念之间，不断暗示自己形成习惯性思维就真觉得没意思了，那些欲望自然减少或消失也就容易自控，形成习惯后甚至想不起来关注参与这些事。刚开始写作时工作量大困难多所以还需运用自己意志力如形成目标获取动力帮自己抵御诱惑增加写作驱力。维尼还用过Forest软件把写作需要的软件加白名单可照常写作，看微信QQ软件里树就枯萎，这给了点压力和动力有助克制，另外选择不错环境如去咖啡厅写作那气氛让人坐得住增加写作驱力，不太想写时就想象一篇妙文出炉感觉这样有些驱力去写，新购置苹果笔记本也给写作增添愉悦，逐渐形成习惯驱力自然推动写作。另外写作本身有乐趣写多了有进步和成就感进一步增加兴趣和信心越来越期待写作。这样想看手机驱力慢慢减少写作习惯慢慢形成从写作获得乐趣越来越多拖延症逐渐离他而去。\n\n好，第四章就到这里。我想请你记住：你不是意志薄弱，是你的体内还有\"驱力\"这股力量在和意志拔河；真正的高手不是硬扛，而是\"釜底抽薪\"——用认知改变情绪、用想象增加驱力、用习惯借势、用转移注意力化解欲望。下一章，我们进入\"少有人掌握的情绪奥秘\"，去认识情绪这个既熟悉又陌生的老朋友。我们下章见。\n"}, {"title": "第五章 少有人掌握的情绪奥秘", "text": "各位朋友，我们进入第五章——\"少有人掌握的情绪奥秘\"。\n\n在心理成长过程中，认知的改变非常重要。但除了认知，影响心理的因素还有很多，情绪是其中很重要的一种。了解情绪的规律，掌握调节情绪的方法，有助于更好地了解和驾驭心理。这一章，维尼老师要带我们认识情绪这个既熟悉又陌生的老朋友，尤其是那些\"少有人掌握\"的奥秘。\n\n这一章我会和你聊：第一，情绪为什么有时不受意志控制——它的生理基础是什么，又有哪些从生理入手的调节妙招；第二，坏情绪会怎样\"致病\"，情绪和身体怎样互相影响；第三，认知影响情绪，情绪也会影响认知，这里面有两个关键规律——\"情绪驱动思维\"和\"情绪与认知的共鸣效应\"；第四，觉察不良情绪来袭时，为什么要第一时间转移注意力；第五，为什么想更好自控就不能让情绪累积；第六，及时宣泄倾诉、寻求心理支持的重要性；第七，当沮丧来临、当紧张来袭，维尼自己的两个实战案例；第八，严重的情绪困扰需要多管齐下。\n\n先说情绪为什么有时不受意志控制。很多人觉得情绪是一种心理现象，有道理，但情绪不仅是心理现象，也是生理现象，有生理基础，与神经、大脑、肌肉、内脏、激素（多巴胺、内啡肽等）多方面因素有关。情绪为什么有时不受意志控制？这与自主神经有关。情绪会唤醒自主神经系统，通过它的活动广泛刺激各器官组织引起明显生理反应，同时自主神经系统的活动对情绪起支持和延续作用。而自主神经是不听意志指挥的，所以情绪会自动持续一段时间，不是想改变就能改变。因此情绪有时不听意志指挥，所以虽然明知道不该生气、不要紧张、不该焦虑、不要恐惧，却做不到。\n\n根据这一规律，可以从情绪的生理基础入手调节。深呼吸可以直接调节情绪，尤其紧张焦虑烦躁时，深呼吸会改变生理状态从而缓解情绪。有时忍不住想笑，笑出来可能不合时宜或尴尬怎么办？维尼透露常用小秘诀：深呼吸几次放松下来就不那么想笑了。运动也可以改善情绪，运动会改善血液循环让身体更通畅改善身体感觉，促使大脑分泌\"快乐素\"（内啡肽）让人有快乐感觉，另外运动还有转移注意力作用，让情绪各种生理反应慢慢消失趋于平静。有时陷入某种不良情绪难以自拔，运动是从中解脱的好方法。另外洗热水澡、按摩会给身体良好感觉对改善情绪有帮助。与异性交谈时可能紧张，当紧张情绪已产生心理调节就有些困难，不妨暂停去洗手间洗洗脸或手，清凉的水会促使人平静一些，在此基础之上自控自然容易一些。另外药物因为可以改变不良情绪的生理基础，所以在抑郁症、焦虑症、恐惧症治疗中有时能暂时改善情绪。\n\n坏情绪会致病——情绪与身体健康。情绪对生理有显著影响，比如糖尿病、冠心病、高血压的形成都与不良情绪有关；心理紧张、压力大也会导致各种病痛，比如胃痛、背痛、头痛等。维尼以前患肌肉紧张性头痛，每当心情烦躁时肩部颈部头部肌肉就紧张造成头痛。一位妈妈每当对婆婆不满心情烦躁时背部肌肉就紧张疼痛；因孩子生气时也会胃痛和胀气。在维尼这里咨询后改变了不合理习惯性思维，情绪平静了胃的症状自然消失背痛也好转很多。可见情绪对身体健康很重要。同时身体状态也会影响情绪，比如头痛时容易烦躁，身体的紧张也会引起精神紧张，睡眠不足疲劳会影响精神状态。如果身体状态好头脑清醒情绪也容易放松平静，所以调整好身体状态有助于情绪改善。\n\n认知影响情绪，情绪也会影响认知。认知会直接影响情绪，同时情绪有时也会有力影响认知。维尼讲了个中秋节回老家的例子：四面环山的小山村空气清新与父母在一起其乐融融，早晨开车启程回青岛，倒车时不小心把车蹭了一下虽问题不大还是感觉有些遗憾。那就调节一下情绪吧。他先改变认知用三种思维分析：第一，坏事变好事，这个小事故提醒以后开车更小心的避免更大事故也是心理成长机会所以也是好事；第二，很正常没什么，只是一些剐蹭以后维修时顺便修就行没什么大损失；第三，顺其自然，既来之则安之，驾驶技术还不过关出这样问题应该的，不用懊悔。这样一想释然多了。但遗憾情绪还在心中让他不舒服驱动他不由自主想这个问题想到损失。他知道这是情绪驱动作用所以先去转移注意力专心开车，这样情绪慢慢消散过会儿就不自觉平静了，再想到这事首先想到三种思维，在平静状态下觉得好像也没什么就释然了。从这个例子可观察情绪和认知的相互作用，改变认知会调节情绪，情绪也会影响思维和认知。\n\n情绪对思维认知的影响存在两个规律。第一，情绪驱动思维。强烈情绪会让人有不舒服感觉从而提示驱动或吸引我们去关注思考那些引发情绪的事情，也是\"情不自禁\"一种表现。比如和别人发生争执后若感觉憋屈郁闷或气愤，这种情绪会持续一段时间，它的存在会提醒或驱使人们不由自主想去想引起争执的事，即使理性认为不该想也会情不自禁思来想去，而当情绪恢复平静后可能就懒得想或根本想不起来。抑郁情绪也是如此，它让人难受驱动人们去想那些令人担心纠结忧虑的事以期摆脱情绪，虽明知道不该想却无法自控。焦虑担忧恐惧情绪也有这功能，提示人们关注相关事情思来想去欲罢不能。快乐情绪也会让人情不自禁，比如刚和男（女）朋友甜蜜度过一晚，快乐情绪荡漾心头吸引你不由自主回想那些美好画面，这些想象也让快乐情绪持续嘴角带笑幸福写在青春面孔上。情绪越强烈越容易情不自禁。\n\n第二，情绪与认知的共鸣效应。维尼二十多岁时曾陷入中等程度抑郁状态持续一个月，有机会在煎熬中反复体验情绪与认知的共鸣效应。在抑郁状态下虽理性上知道应多想积极乐观的事改善情绪，但即使有意思考对积极乐观方面感觉还是迟钝麻木通俗讲就是没感觉难以继续下去所以对改善情绪作用不大；而在抑郁状态下对负面悲观的事却非常敏感会产生丰富放大的联想而且\"生动鲜活\"，这自然让人情绪持续低落所以像陷入情绪泥潭难以摆脱。从抑郁症来访者那里也验证了这效应。也就是说抑郁情绪与负面消极认知容易产生共鸣但与积极乐观认知不合拍产生不了共鸣，这效应是抑郁症难以治疗的根本原因。另外强烈焦虑恐惧忧虑情绪下也有类似规律。一位来访者常因小事陷入担心焦虑漩涡，有次理发不小心被剃须刀刮出血他很恐惧担心会不会传染艾滋病，在恐惧情绪下他会反复想各种可怕后果对有关线索格外关注，他也曾试图宽慰自己但没一点效果所以连续几周处于恐惧中。\n\n在强烈情绪之下改变认知效果往往不佳，此时首先要去转移注意力比如运动聊天等直接调节情绪，情绪暂时好转后再试图转换认知。情绪与认知共鸣效应是普遍规律，快乐时也是如此，可以内省一下快乐时想到的是否大都乐观的事而此时对负面悲观的事比较迟钝不敏感。举个很多人熟悉的例子——股票投资，市场持续上涨时在乐观情绪之下股民注意到的都是经济方面乐观消息对悲观消息视而不见，而当市场持续下跌时在悲观情绪影响之下转而又去关注负面悲观消息对乐观消息没感觉，其实经济本身可能没太大变化。所以我们常说\"信心百倍\"某种程度上是在乐观情绪作用之下对积极正面信息敏感对负面消极东西迟钝从而信心倍增；所谓\"心灰意冷\"也体现情绪影响，在悲观情绪之下负面消极方面被放大对正面积极东西没感觉所以心灰意冷。家庭中也是如此，因孩子生气时想到的看到的都是孩子表现不好方面，而和孩子愉快相处时眼里又都是孩子可爱美好方面，其实孩子还是那个孩子。遇到不顺利时懊悔自己不该那么做情绪驱动之下不自觉想着这些事难以排遣，事情过去平静了再想起觉得好像没什么不大介意了。焦虑情绪下也有类似表现，一位妈妈在维尼这里咨询说孩子在学校大发脾气让她觉得教育很失败也为没及时向老师道歉而懊悔陷入焦虑漩涡，她说总不由自主想这些事好几天走不出来，咨询后情绪改善再回想当时状态感觉像中邪了一样为什么想不开，走出来再回想那些事不禁哑然失笑有什么大不了，可当时就觉得很严重，这就是情绪和认知共鸣效应在起作用。人际交往也是如此，和人吵架心里愤恨不已涌上心头都是那人可恶可气方面这些与愤恨情绪更容易共鸣，而平静之后则觉得那人好像也没那么讨厌也不是不可宽容。这就是情绪与认知共鸣效应，也是很多人很少注意了解的，但它就在那里强有力影响我们，就像地球运转产生春夏秋冬一样都是科学规律。维尼定义的\"情绪与认知的共鸣效应\"可在心理学找到依据，心理学中有\"情绪一致性效应\"（mood congruent effect）由戈登·鲍尔提出并经实验验证——那些与一个人目前情绪相一致的内容更容易被发现引起注意并得到深加工二者联系更紧密（参考《心理学与生活》P340）。也就是说人们处于某种情绪状态时更倾向于发现和加工与该种情绪一致的信息。这两个规律对心理调节有重要意义，有了不良情绪后这种情绪会驱动我们关注引发情绪的事，而在这种情绪之下我们会更多关注与情绪一致的事从而使得情绪难以摆脱。所以最好的方式不是在那里思来想去，而是直接去调节情绪，换个环境或用散步运动聊天等方式转移注意力更容易摆脱不良情绪。当然认知改变也需要，可先用三种思维等方式转变认知待情绪缓解后再用转移注意力等方式调节情绪；如果情绪很严重则需先转移注意力之后再去改变认知，认知改善了情绪也会进一步好转进入良性循环。如果莫名烦躁可去散散步吹吹风情绪不知不觉就好转，如果一直在原环境会不由自主关注让人烦躁的事久久不能摆脱。感到郁闷可先找人聊聊天倾诉之后感觉好多了之后就容易想得开。抑郁来袭不要躺在床上思来想去要先转移注意力调节情绪情绪好起来再去改变认知这样才慢慢走出情绪泥潭。当过于乐观或过于悲观时不妨提醒自己这可能只是情绪作用事实不一定如此，如果想做出客观判断分析就需注意情绪影响，有情绪时往往难以理性，所以\"静能生慧\"——平静下来会更有智慧。\n\n觉察不良情绪来袭，及时转移注意力。不良情绪袭来时人们容易不由自主思来想去，而情绪又会影响认知更多关注负面或消极悲观方面从而强化负面情绪形成恶性循环。为打破恶性循环可学会转移注意力。常用转移注意力方式有运动散步聊天看电影按摩洗澡做家务工作等，一方面可以直接改善情绪另一方面把注意力转移到这些事上不再去想那些负面消极的事从而打破恶性循环，这样情绪慢慢平静自然会少关注负面信息多关注积极乐观方面。这个方法对孩子也有效，当孩子哭闹时他也在一直想让他烦恼的事，此时简单让孩子转移一下注意力比如看动画片玩玩手机调节了孩子情绪让他忘记那事可能下一秒孩子就破涕为笑。\n\n若想更好自控，就不要让情绪累积。经常有因为一件小事引起激情犯罪的新闻，很多人不能理解为什么这么小的事就让人那么冲动，其实小事只是导火索，根本原因还是不良情绪已积累太多所以才让人瞬间爆发。这也是普遍规律，一件事情是否引发人的不良情绪不仅与事情认知有关也与已有情绪基础有关，这样更容易理解某些情绪现象。如果你正在炒菜厨房燥热嘈杂忙得手忙脚乱此时自然可能有些烦躁，如果此时家人过来说些事你可能就莫名其妙着急发火。有时人会因身体不舒服而心情欠佳此时一些平常不在意的小事可能就会引起情绪波动。如果在单位忙了一天身心疲乏工作压力又让你不开心回家后孩子稍微一闹你可能就大发脾气。如果你对同事或家人已很不满看见了就心里有气那么即使发生一点小矛盾也会引发大冲突。这些是正常的，是心理规律的产物。那么如果想更好自控需要及时调节情绪避免负面情绪积累越来越多，这就是《道德经》所说的\"其安易持，其未兆易谋\"（局面安定时容易保持和维护，事变没出现迹象时容易图谋）。心理成长需要遵循心理规律。\n\n及时宣泄和倾诉，寻求心理支持。有了不良情绪后可寻求家人或朋友支持诉说烦恼和纠结宣泄之后情绪会好转。有一次维尼和人争论对方出言不逊说得很难听，他心态还比较平静（查理·芒格名言：不要和猪摔跤猪乐此不疲你却沾一身泥），所以没回击一直稍稍克制。不过他毕竟还是凡夫俗子争论之后还是稍有些气愤情绪驱动着他去想这事内心一时不能平静有去回击冲动但理性上知道不值得。后来和一位同事谈了此事把想说的话都表达了出来，说起来也奇妙宣泄之后冲动就少多了觉得也没什么意思很容易就把这事放下。还有一次很多读者热心支持他出版《维尼小语》期望值很高但由于疏忽封面制作与预计相差甚远让他着实有些郁闷，大概因为读者热心帮助他他却没呈现精美作品所以有些歉意，后来在QQ群里和读者聊了此事表达了感受也得到大家支持理解很快感觉好多了。宣泄倾诉和表达方法看似简单效果却不错它会释放情绪和冲动。所以当不良情绪袭来不妨试试寻求家人朋友支持，同样只要学会倾听我们也可以为家人朋友提供这样的心理支持。\n\n当沮丧来临，当紧张来袭。认知和情绪相互作用，调节了情绪会为认知改变创造良好条件，改变了认知会为情绪带来持久稳定改变。当沮丧来临，构筑认知防火墙。维尼是个球迷喜欢到现场看比赛，2016年中甲联赛倒数第二轮青岛黄海主场大胜升入中超希望大增体育场成欢乐海洋他也很开心，不过很快传来消息冲超另一个对手也赢了这样青岛队丧失冲超主动权。他心情不免有些沮丧这感觉可不好所以用三种思维分析：即使青岛队冲超了但因实力较弱主场可能经常输球那样看比赛也不会太开心而在中甲青岛队还是比较容易赢比赛的这样看比赛更享受些所以也有好方面；今年实力还是不济只是踢得不错才有冲超机会无法实现目标也正常；有些事是自己无法掌握的所以还是顺其自然吧。转念之间感觉好些但还是有些郁闷所以去运动了一下注意力转移慢慢平静下来不再想这事。过一两天偶尔还会想起但因有了合理认知自然能坦然面对，最后一轮比赛青岛队虽胜利但还是宣告冲超失败看到结果因早有\"认知防火墙\"心里很平静没起一点波澜。当紧张来袭，改变不合理认知。有一次维尼到湖南教育电视台演播大厅做家庭教育讲座，以前讲座流程简单主持人简单介绍后他主讲就行，但这次主办方要求很高，讲座前一天晚上彩排他发现导演要求像做一台节目：穿插文艺节目对主持人台词精益求精灯光音乐都有很高要求。主持人说为搞好活动已几天没睡好，看到大家这样用心他慢慢有了些压力：如果发挥不好或讲座不能和主办方精心准备相匹配就不大好了（这些是即时产生的自动思维没经过深入思考得出的类似直觉反应所以可能不合理，但如果不去有意改变就会影响情绪产生压力紧张担心，他虽心理较成熟也会出现这种情况尤其遇到未曾经历情况时因没有合理习惯性思维应对就容易得出不合理认知）。按节目设计他上台前有个家庭教育情景剧他上后台主持人会问他对情景剧感受练习几次后感觉点评效果不大好这更让他紧张担心压力陡增感到不像以前讲座那样自信放松。回到酒店他意识到必须调节心理，现在情绪不佳所以先调节情绪，洗了个舒服热水澡转移了注意力沐浴也让身体舒服心理自然放松些（除认知外情绪对心理影响也很重要，如果已有紧张焦虑情绪就容易放大事情影响进一步紧张这样情绪难以摆脱，不妨先调节情绪之后再改变认知效果更好）。他理了理思路把情景剧点评部分斟酌成熟后写下来感到比较满意，原来心里没底自然容易慌乱现在心里有底就镇静下来了（虽直接决定情绪的是对事情认知但事情也重要所以有时需要去解决问题事情改善了自然促进情绪改善）。情绪平静后他进一步调节认知：他是这节目真正主角其他环节不过烘托渲染他的讲座，另外即使讲座风格与节目其他部分不大匹配他也不可能马上大幅度改变风格，所以讲座时还是要以他为主做自己按最擅长方式来做更稳妥，其实做节目时就像平常讲座一样说话像做咨询聊天一样放松去讲课就行，以前这样做效果不是也不错吗？这样一想感到比较振奋自信又恢复（先接纳现在的自己然后放眼未来再去慢慢提高，如果放弃自我去迎合别人就容易不知所措，所以当下按最擅长熟悉方式去做会比较有信心）。这样一来心情彻底放松那晚美美睡了一觉，第二天上台前一点也不紧张讲课时放松自如娓娓道来效果不错。\n\n解决严重情绪困扰，需要多管齐下。严重的情绪困扰可能是多种因素交互作用造成需要综合解决方案，有时既要解决实际问题又要解决心理问题，既要学会调节情绪又需要转变认知逐渐从情绪泥潭走出来。她从小像小公主在父母呵护下长大善解人意颇有些小资情调，婚后迫切希望有属于自己的独立空间独立生活可自由自在按喜欢方式生活，但因各种原因不得不和公公婆婆住在一起，因生活习惯价值观家庭观念诸多不同她经常感到不舒服，比如买件新衣服婆婆知道价钱就惊呼，想喝下午茶二老觉得浪费钱，二老经常带孩子看成人化电视而不是像她希望那样陪孩子玩耍，她想带孩子安静一起读书公公却在隔壁客厅把电视声音开得很大……虽二老对她比较尊重没骂过她还是让她感到难受压抑，而且公公一直说儿子应该和他们住一起不然觉得活着没意思，这让她感觉一辈子都没希望过独立生活了。另外带孩子很累天天失眠需服安眠药入睡身体也感不舒服……这让她常焦虑压抑情绪有些低落以至于快抑郁了。当然最好解决方案是分开住事情解决了很多问题自然迎刃而解，但目前还做不到，与其痛苦不已不如先接纳现状改变认知尝试去解决问题。首先有些认知需转变，她善良但也软弱为别人考虑太多所以不太敢追求想要生活，如果学会\"理直气壮\"知道自己有权利要求独立生活无须歉疚就会有底气将来可在适当时机去独立生活，这样就不会因感到没希望而那么压抑。失眠问题也可改善，睡眠最需要安静心态而睡不着时她又急于马上入睡自然更难入睡，所以先调整认知：睡不着就睡不着顺其自然这样心就静下来，另外听听音频节目转移注意力不会让思绪飞舞从而不知不觉入睡，这样一来睡眠改善身体感觉好多了情绪自然有所改善。不过有时情绪还是不好她会情不自禁想那些烦心事，维尼建议她多去转移注意力比如陪孩子出去玩健身交往，她说上午在家比较抑郁下午带娃娃外出后心情果然好些。情绪好转后再重新看待和老人一起住的事，其实二老还是讲道理的现在生活不像想象中那么糟糕，认知变了就不那么烦恼慢慢能够接纳现实。有些问题可解决，比如公公喜欢把电视声音开很大入睡一晚上不关影响她睡眠，她让老公与公公沟通解决了这个问题。学会理直气壮后她逐渐有底气按自己意愿生活了，比如布置自己房间买喜欢衣服偶尔喝下午茶这给了她一些自由感觉，有一次公公在客厅看电视她把卧室门关上公公不高兴过来问她她温和而坚定地说孩子需要安静看书环境，公公没说什么。就这样她的情绪逐渐改善睡眠越来越好，且因部分问题得到解决脸上有了光彩笑容也开始浮现。\n\n好，第五章就到这里。三句话送给你：情绪有生理基础，有时真不是你意志不坚定，要先从生理入手（深呼吸、运动、洗澡）让它平复；情绪会\"驱动思维\"、会和认知\"共鸣\"，所以痛苦时别在脑子里打转，先转移注意力打破恶性循环；严重情绪困扰要\"多管齐下\"——解决问题、调节情绪、转变认知一起来。下一章，我们聊一个很多人讳莫如深的话题——童年会伤人，如何看待环境影响。我们下章见。\n"}, {"title": "第六章 童年会伤人，如何看待环境影响", "text": "各位朋友，第六章——\"童年会伤人，如何看待环境影响\"。\n\n心理不是独立的存在，会受到社会因素的影响，包括事件和环境等。心理成长既要重视认知的转变，也要重视事情和环境的改善。做好自我成长有助于心理成长。另外，重新看待童年的经历、放下包袱会让我们更好成长。这一章，维尼老师要帮我们处理一个很多人纠结一辈子的问题：原生家庭、童年创伤，到底该怎么看？\n\n这一章我会和你聊：第一，改变认知之后还需要解决问题——心理成长是系统工程；第二，环境如何塑造人，为什么\"超然物外\"并不容易；第三，换个环境，改变会更容易发生；第四，心理成长需要讲究方法——读书、思考、实践，以及\"率直的心胸\"；第五，不困不启，怎样看书才真正管用；第六，建立合理思维，培养率直的心胸；第七，家庭会伤人，如何放下童年经历的影响；第八，运用三种思维，学会理解父母；第九，不要夸大童年对性格心理的影响；第十，过去的经历常常会沉淀为认知。\n\n先说改变认知之后还需要解决问题。心理成长维尼特别重视认知改变，但问题的解决或事情的改善也重要。虽然直接影响情绪行为的不是事情而是对事情的认知，但事情对情绪行为自然也起作用。设想一下如果问题不存在事情没发生相应不良情绪行为就不会出现也无须调节。而且如果事情一直比较糟糕即使改变认知之后情绪好转时间久了也难以一直保持良好心态。比如很多父母经常为孩子写作业磨蹭生气发火，这需要首先改变认知调节好情绪否则经常发火会破坏亲子关系孩子也不会合作，并且孩子会因此更讨厌写作业问题更难解决。但是如果孩子写作业总是磨蹭到很晚即使父母暂时情绪平静了时间久了还是难免对孩子发火，所以先运用认知疗法改善自己情绪改善和孩子的关系孩子会更合作，之后再去\"找原因想办法\"解决磨蹭问题帮助孩子变得专心，这样问题解决也就不大发火了。再比如如果总是失败虽可通过改变认知远离自卑但想自信还是比较难，如果通过实际努力获得进步和成就感就更容易获得自信。因此为获得更好心态还需去改善事情解决问题，只是事情常常难以改变或不能马上改变所以需要首先通过改变认知来调节心态，所谓\"静能生慧\"在心情平静之后会更有智慧去解决问题，问题解决了釜底抽薪情绪自然好转，改善认知改善事情双管齐下情绪行为就会得到持久好转。比如人际关系处理不好经常和同事发生矛盾虽可通过改变认知调节心态但这终究不是长远之计，在情绪调节好之后还需学会合理处事方式有效沟通从而减少矛盾发生改善关系这样更有利于保持良好心态。对于人生来说如果经过努力还是平凡可改变认知安然接纳现状因为即使平凡也能活得幸福平凡生活也有精彩时候可以坦然面对，但如果能提升人生智慧注重方法再通过努力获得更好成就进一步实现自我还是会更幸福一些。所以心理成长是系统工程不能仅仅考虑心理心理离不开现实和环境综合发展才能更好成长。\n\n环境塑造人，超然物外并不容易。如果有人问：你是有主见有头脑不受别人摆布独立自主做出决定的人吗？也许很多人回答都是\"是的\"。可惜很多时候不是这样，人很难摆脱环境的影响和塑造作用，这是因为人是趋利避害的，希望得到社会认可和肯定一般都希望有一个好结果所以不可避免地会去调整自己行为以适应环境获取理想结果。正如行为主义心理学强化理论所指出的：人的每一种行为都有肯定或否定的结果，得到肯定的行为趋于重复发生得到否定的行为趋向不再发生。所以环境可以通过结果有力塑造人。有个单位知识分子很多以前风气不错大家只需把工作做好不必对领导溜须拍马，后来来了一位领导非常强势什么都是他说了算包括晋升职称评审评功评奖是否解聘等涉及切身利益的事而且他自然不可能那么公平如果对某人印象不好某人利益可能受损。如此一来大家慢慢从关系自身利益的结果中领悟到工作做得是否好不是最关键更重要的是领导是否满意能否和领导处好关系。所以慢慢地大家都会按领导意思去做而不是根据工作实际提出自己想法因为如果太积极主动与领导意思不合还会被批评，言语之中迎合奉承也自然多了。看起来有些悲催，比较注重气节的一群知识分子在一位领导影响之下行为模式会有这么大变化，其实这是正常的心理现象，人们都希望有一个好结果所以会趋利避害去适应环境让自己过得更好。环境的塑造作用强大而且广泛，比如选择职业时不仅考虑自己喜好是否适合还会考虑职业是否有前途是否有发展潜力收入会如何，学习新技能新知识也会考虑是否适合当前职场需要，与人交谈时会选择别人感兴趣话题包括当下热门话题这样才会引起更多共鸣，培养能力素质也会侧重于当下社会所看重的。在组织管理中管理者也会有意设计一些奖惩措施引导成员按组织纪律或规定来这些奖惩会塑造员工行为。趋利避害是人之本性人人都希望得到他人认可和肯定，所以虽会有自己主张和见解但有时难以摆脱环境和社会的塑造这是心理规律。\n\n换个环境，改变会更容易发生。随着环境变化我们的言行性格也会发生某种程度改变。维尼在国防科大开始读书时在大家眼里是个内向不擅言辞交际甚至有些羞涩的人，在两三年时间里他努力锻炼自己注重自我成长改变了很多，但除了很熟悉的同学其他人对他还是以前印象所以即使他想活泼去说话交往他们还是把他当成内向的人不期待他说出有趣的话来所以对他新尝试既不关注也不大回应所以改变的驱力也不足，在环境制约之下总感觉难以改善所以大学期间看起来性格变化不大。毕业之后来到青岛同事们对他没有既定印象环境的束缚没有了成长的成果一下子释放出来性格很快变得外向谈笑风生交往顺畅自如同来青岛的大学同学对他性格迅速转变感到惊讶。曾经做过一个5岁孩子咨询她本身有些敏感脆弱容易发脾气逐渐地幼儿园老师和同学对她有了成见有一些歧视孩子觉得不公平所以更频繁发脾气，虽然咨询之后孩子性格有所转变但老师和同学还是用老眼光看她，比如小朋友都不愿意和她玩，有一次孩子拿牛奶拿了两袋想比较选哪袋老师就以为她要拿两袋自己喝所以直接把奶夺下来这样孩子马上脾气爆发，和老师沟通多次还是难以改变，维尼建议换一个幼儿园，到新环境虽孩子有时也发脾气但老师和同学对她比较宽容有了原来改变的基础所以进步很快。一位大二女生在维尼这里咨询她以前给人印象是不爱交往不爱说话和舍友一个星期说不了五句话，她后来想改变自己多去说话但舍友经常没回应或不感兴趣，这是因为对她已有印象觉得她说话没意思，这种不回应也让她觉得沮丧紧张进一步制约了她的改变。后来她和舍友发生一些矛盾舍友本来就看她不顺眼所以关系搞得很僵，她努力改变自己处理好关系但因为已有成见所以收效甚微。后来维尼建议她换个宿舍换个环境，后来她告诉维尼和新舍友处得很不错说话等方面也好多了。如果想改变自己首先需要做好自我成长，但有时环境能制约和束缚一个人改变所以如果条件允许换一个环境也有助于改变，这就是\"树挪死、人挪活\"吧。\n\n心理成长需要讲究方法。心理成长属于自我成长一部分，自我成长做好了有助于心理成长。一个人能不断成长有诸多方面因素比如机遇悟性能力，维尼觉得最重要的是努力加方法。努力特别是长期坚持不懈努力可以成就很多东西，但很多人也很努力成长却不顺利这可能因为不注重方法。维尼因注重方法受益颇多，大学毕业之后他在军队做了多年科研工作说起来经过磨炼并不多但还是得到不错成长，他的方法总结起来就是读书思考和实践。读书当然很重要书中有人类智慧精华为什么不去获取呢，各方面的书都是有营养的包括古代典籍心理学政治哲学历史管理等对人的成长都是有益的。但是读了书要结合自己实践去思考才能为我所用，每天的反省思考是重要的，孔子说吾日三省吾身是指多次反省意思，他20多岁时每天会花两三个小时甚至六七个小时来思考把每天看过的书消化一下反省一下当天发生的事情看看有无可以改进的地方另外再思考一下让我困惑的问题等直到现在他还有每天反省的习惯。亲身经历的事情是一笔财富其中蕴含了道理错过就可惜了，实践当然也很重要，爸爸和他说过一句话：小事情的道理和大事情的道理是一样的，我们认真做好每一件小事情从中就能收获经验和智慧，经过多年坚持虽然并没有经过什么大风大浪他在平凡的生活中也得到了很好成长，如果有很多机会经历磨炼对于成长会更好。一个人需要有战略眼光和大局观，杨振宁说过如果想有好的发展一定要寻找一个有发展前途的领域在一个艰难的领域是难以有好的成就的，维尼深受这个理念影响，他从事的科研工作很艰难没有发展前途又不是他最擅长的所以他战略上放弃这个方向转而研究心理学后来又选择家庭教育作为研究方向因为这两个方向本身都很有发展前途又是他喜欢和擅长的所以更容易获得成长，当然杨振宁的理念也要辩证看也有在看似艰难领域坚守结果取得很好成长的人，是否艰难事情本身也不是一成不变的。做心理研究和家庭教育研究的路线也很重要，与很多学院派不同维尼注重自身实践重视咨询实践从实践当中归纳出理论和方法再用实践去检验，这种方法效率较高因为和实践紧密联系总结出的理论和方法接地气实用所以受到广大读者欢迎，另外维尼这个人不迷信权威解放思想不拘泥于已有理论体系敢于提出自己的理论和方法，这样的研究方法很重要。总之努力重要方法也很重要。\n\n不困不启，怎样看书才管用。你有没有这样的经历，看书时恍然大悟醍醐灌顶感觉理念方法特别好好像收获很大但之后却常常想不起来也用不上。维尼二十多岁时也曾为此苦恼：书看得很多当时感悟也不少对自己的成长却用处不大，为什么会这样怎么解决？慢慢地他想明白了，从哲学角度解释这其实是矛盾的一般性和特殊性问题。书上讲的是一般道理（一般性）如果不联系自己实际或遇到的事情去思考那么可能不会透彻理解也不知道在具体事情上如何应用（特殊性）。举常见例子我们只知道马克思主义普遍原理（一般性）是不够的还需要思考如何在中国革命具体实践中运用（特殊性）不然普遍原理就用不上。另外为什么会想不到呢？这是因为如果没有结合具体事情进行多次思考就不会形成习惯性思维那么遇到事情时自然可能想不起这些道理。明白了其中奥妙他慢慢探索出解决方法，他每天晚上会花一些时间回想最近看过的书通常会选择两三类日常生活的事情思考某种精彩道理如何应用其中这样一来既进一步理解了道理又知道了如何在具体事情上的应用（特殊性），他还会思考在新遇到的事情上如何应用以前看书收获的道理，经过这种多次思考学习到的道理以及它们在具体事情上的运用就会成为他的习惯性思维那么遇到事情自然就想起来了看书也就会有真正收获。一位妈妈告诉他：\"一两年前我就买了您的《顺应心理，孩子更合作》，当时觉得理念方法挺好但是却没有在自己孩子身上用好，现在孩子出了问题我带着自己的问题重新去看慢慢思考看一点就好好结合教育问题来反省自己感觉收效很大。\"\n\n建立合理思维，培养率直的心胸。1994年维尼大学毕业来到青岛那年冬天他买入《松下幸之助经营管理全集》，松下所说的\"率直的心胸\"让他受益颇多，心胸的修炼会带来智慧的成长。\"率直的心胸\"就是没有私心不被任何事物蒙蔽诚实地直视事物本身，简单来说就是不带着自己的利益感情好恶面子情绪欲望立场去看待事情看待人。所谓\"静能生慧\"情绪平静下来智慧自然会得到增长，同样不带着利益感情等去看事情也会更有智慧。比如和别人讨论问题如果不执着于自己立场不在意所谓面子不拘泥于输赢那么自然耳聪目明很容易吸收对方观点合理之处改进自己不足成长也就发生了。与人打交道如果能放下对自己利益的执着考虑对方合理要求那么自然容易赢得合作，否则即使一时占了便宜最终损失可能更多。不感情用事不为一时痛快说过分话做过分事不因好恶扭曲自己判断对事不对人那么看法做法自然客观理性公正。王阳明在《传习录》中强调\"存天理、去人欲\"在面对事情时如果能够去除私欲天理真理自然显现，这和率直的心胸是相似的。如何放下执念呢？《道德经》说\"圣人无私而故能成其私\"当你学着不带私心看问题看事情做事情因为无私所以会更智慧自然也是有益于自己的长远来看收获更多，放下是为了更好地获得。比如面子放下面子其实可能更有面子，多年前有一位同事是位智慧的人讨论问题他常说一句话是：这方面我不大懂，承认不懂在很多人看来是没有面子的但他大大方方承认却让维尼心生敬佩其实是有面子的。率直的心胸往往建立在合理习惯性思维基础之上，需要经常反省回顾自己为私心所蒙蔽的情形去具体分析这种情况下是否应该不带情绪处理事情不为输赢面子所困不为利益所累也不为了一时痛快体会一下哪一种方式对自己更好，当合理的习惯性思维建立起来之后率直的心胸也就形成了。\n\n家庭会伤人，放下童年经历的影响。原生家庭对一个人的影响是巨大的，父母虽然大都是爱孩子的但如果不懂家庭教育事情处理不当则会给孩子带来不少负面影响甚至留下痛苦和创伤影响孩子一生。一位六年级男孩在维尼这里咨询很多问题他都要问过妈妈才放心做作业也要妈妈陪着，孩子五年级以前没有这些现象为什么后来会这样呢？几经追问孩子才说出原因，六年级的一天本来说好玩两次游戏结果孩子多玩了一次妈妈知道后训斥了孩子一个小时说为什么答应的事情做不到为什么要欺骗自己最亲近的人……之后孩子就开始什么事儿都要问了妈妈才放心直到现在孩子做作业也要妈妈陪着作业上各种问题问了妈妈才踏实。一位12岁男孩性格孤僻不想和人交往他和维尼说了从小经历让人心酸，从幼儿园起父母忙于生意没空管他他总是一个人居家看电视自己玩，父母回到家里动不动就对他发火打骂，所以与父母在一起时他心情经常紧张和痛苦不知道做错了什么就会被骂一顿，所以他很自卑特别在意别人评价不喜欢与人交往，父母常常逼迫他所以他也变得很倔强因为唯有如此才能获得一点自由空间，父母不理解他所以他也不理解别人一点小事他就会不高兴和发火，这样性格自然逐渐变得孤僻，现实让他难受和痛苦而网络虚拟世界是快乐的，所以他只想一个人沉浸在网络游戏世界里。面对痛苦童年经历有的人想起来就会心痛童年留下无法摆脱阴影，有的人认为自己现在痛苦来源于父母压抑所以愤怒痛恨开始讨伐父母。一位妈妈说：\"看了很多育儿书之后我了解到我的诸多不快乐都源于我的童年越是了解越是无法释怀，在给自己贴上这个标签后我开始拿着放大镜到回忆中去寻找童年的种种被伤害这让我很是痛苦。\"另外一位妈妈说：没接触维尼老师之前她眼里的人生是悲观消极的，从小到大都生活在父母责骂和极端管教中在父母眼里她感受不到认可即使再普通不过的站姿都要被父母指责一番，为了迎合讨好父母她比一般同龄人都要乖巧懂事但换来的总是父母冷眼和责骂，最不能忍受的就是父母在大庭广众之下从来都不顾及她的尊严大声骂她这让她无地自容小时候她经常想到自杀。在这种环境下长大的她走上社会后是自卑的很在乎别人眼光总想方设法得到别人肯定，而且最不能听别人说她一点错因为那样肯定会让她痛苦纠结很长时间，她最大缺点是太过于追求完美对自己要求太严厉哪怕一点小错她都会懊恼不已对别人也是这样容不得别人在她面前犯错。和父母关系一直很淡，不过现在她从维尼老师这里学会了换位思考理解了父母是非常爱她的只是用错了爱的方法。我们的性格心理人际关系以及对孩子的教育方式会受到原生家庭显著影响认识到这一问题有助于我们接纳自己不过度自责，因为我们的问题不少源自父母不全是我们自己的错误，同样地父母的教育方式和性格可能不少也是来自于他们的原生家庭所以也不要把责任都归到父母身上。\n\n运用三种思维，学会理解父母。如果父母伤害了我们那么该责怪他们吗？父母自然是有责任的可以责怪可以宣泄自己的愤怒和怨恨，但是如果沉浸在怨恨里那么既改变不了过去又会让自己痛苦，过去就在那里可以这样看也可以那样看是否痛苦就在一念之间，所以为了自己不再痛苦不妨去理解父母用三种思维重新看待那段经历改变自己对于童年经历的认知。用三种思维重新看待过去。一位女士的父母都是农民，爸爸性格严肃古板从来不夸孩子也不和子女亲近胆小怕事在村里没地位经常受那些强势村民欺侮，妈妈虽然很善良但也不善于和子女交流所以在家里基本上就没有\"教育\"和\"交流\"，加之她天性比较敏感所以从小就自卑压抑。这位女士后来上了师范大学毕业后又在北京的中学教书但她特别自卑敏感很长一段时间都是愁苦多于欢乐，现在她虽然好多了但经常会在瞬间崩溃，为了减少童年经历负面影响维尼建议她尝试用三种思维重新看待过去去理解父母，这是她的\"转念作业\"。一、坏事变好事，看到事情积极一面。现在想来她小时候受忽视的经历也有好方面比如让她比较关注别人情绪和感受不会冷落了别人，正是因为曾经极度压抑自卑她才会坚持阅读进而寻求心理援助力求重建内心世界，现在她已经有了一些成长在维尼老师帮助下学会认知疗法认识到改善思维模式重要性这对她内心成长有很大帮助，这种改变和成长是从小一帆风顺的人所难以体会的，另外她也会避免在教育孩子时犯父母同样错误这也是那段经历的价值所在吧。二、很正常，没什么。爸爸妈妈有那么多孩子生活艰难忽略孩子的精神需求很正常因为首先要吃饱穿暖啊，父母的性格有缺点可以理解他们的原生家庭有很多问题童年不幸福说起来也是无奈的，爸妈在那样经济条件下还支持她上了大学这和一般农村父母比起来已经是眼光很长远的了，当时村里一般父母会让孩子辍学回家干农活她父母虽然一开始也要她辍学但看她上学决心很大也就同意继续支持她念书，当时家里非常拮据但她在家的时候不记得他们抱怨过什么，爸爸有时会因为在外面受了气找茬向妈妈发泄但他很少对着这些孩子发脾气更没有打过他们这也是难得的克制和理性吧。爸妈都是很坚强的人我们成家以后怕扰乱我们的生活爸妈有什么问题都自己扛着我们的一点点孝心和回报也很容易让他们满足，他们是勤劳善良的父母怎么能再怨恨他们？现在想想她在父母身上在自己不可回溯的童年生活里纠结了这么多年一有问题就回到这个原点上找理由实在是不值得啊，与其在纠结中浪费大量时间和精力还不如直面当下的困难去寻找解决办法让自己成长。三、做自己能做的事之后顺其自然。现在她明白了一个道理人是生而不平等的，一生下来我们就是不同国家不同种族不同家庭条件不同性格父母造就的人每个人的起点都不同这是要面对的真相，一个人的能力毕竟有限不是想怎么样就怎么样的这可能就是一个人的\"命运\"吧，先接纳事实这样才有精力去学习和内省做自己能做的事情其他的顺其自然。她感觉轻松多了过去的就过去了现在和未来才是最重要的。虽然心理性格的形成与父母教育有关但把责任推给父母也没有太多帮助还是要自己负起责任来解决现在的问题。一位女士说这周她和妈妈有了更深层次沟通，她妈妈的童年和婚姻都不幸福把自己隐藏得很深因为我们都不会\"爱\"虽然两人有相依为命感觉但是感情上一直\"别别扭扭\"的不像一对正常亲昵的母女。她以前把自己消极性格形成责任全部推给妈妈认为是妈妈不会\"爱\"她造成的，在听妈妈讲了她深藏心中的童年遭遇之后她毛骨悚然，妈妈从母亲那里也没得到过爱认可和尊重所以也没有能力给她太多，她感觉到妈妈已经对她的成长尽了全力，妈妈不懂爱但渴求爱也在努力爱。通过和妈妈这次沟通她不但理解了她还互相更加信任了，她三十多岁了不能总纠结于过去了。\n\n不要夸大童年对性格心理的影响。很多人夸大了童年事件对于自己一生的作用，这很大程度上受到了精神分析相关理念的影响。精神分析特别强调童年创伤认为心理问题都可以从童年找到根源。当然童年对性格和心理发展是重要的，六七岁的时候性格基调已经形成，但是对于一个来说整个成长期包括小学中学大学性格心理都在不断成长和改变这些时期内的事件或接受的思想对性格都可能产生重要影响，人即使三四十岁也可以有所成长和改变。回忆一下小时候一起长大的伙伴会发现不少人有不少人青春期以后性格还会有很大变化，就维尼而言从小学到初中性格变化不大高中以后尤其是大学毕业之后性格心理有了不少改变，对他来说高中以后的经历有着更重要的影响，可以说童年固然重要但中学和大学对于一个人心理的影响也重要，人生观价值观核心思维基本在这个时期形成逐渐强化从而根深蒂固。所以分析性格心理问题的形成应该从童年到青年整个成长期去寻找原因。如果已经为人父母以前不懂得家庭教育曾经压抑伤害了孩子那么也不必过于悲观以为难以挽回，只要从现在开始改变自己学会合理教育方式那么还有机会抚平以前给孩子带来的创伤进行改变和自身成长一切都还来得及。\n\n过去的经历常常会沉淀为认知。了解过去的经历有助于理解心理问题形成的原因不过了解了原因不等于问题就解决了常常还有比较长的路要走，过去的一切常常沉淀为认知或习惯性思维来影响我们如果不加以改变心理问题可能就难以解决。比如一个人小时候本来就羞怯父母又总是强迫他和别人打招呼再加上其他诸多经历可能会导致这个人在与人交往时有些紧张甚至构成障碍，了解到是童年经历造成了现在的性格并没有太大帮助，那么与人交往时为什么会紧张呢？这往往是由于不合理的认知，比如总觉得和不熟悉的人交往是一件困难的事情（习惯性思维），如果改变认知：\"其实交往也没什么了不起的，就像平常和朋友在一起那样就可以了\"就会感觉轻松些。再如感觉别人在看自己怕别人议论或嘲笑自己（习惯性思维）也会导致紧张。所以过去的经历沉淀为认知才是关键，改变这些认知才是解决之道。\n\n好，第六章就到这里。三句话送给你：改变认知只是第一步，解决问题、改善环境同样是心理成长的一部分；原生家庭确实影响我们，但别夸大童年、别把责任全推给父母，也别困在怨恨里；理解父母最好的工具，还是那三种思维——坏事变好事、很正常没什么、顺其自然。下一章，我们要聊聊一个很多人踩坑的话题——为什么说成功学害人不浅。我们下章见。\n"}, {"title": "第七章 为什么说成功学害人不浅", "text": "各位听众朋友，大家好。我是这本书的导读讲师。今天我们来一起走进维尼老师《内心的重建》的第七章——为什么说成功学害人不浅。\n\n这一章，可以说是整本书里最\"扎心\"、也最容易被我们忽略的一章。很多人从小被灌满了\"只要努力，梦想就一定能实现\"\"没有做不到，只有想不到\"\"要么赶紧去死，要么精彩地活着\"这样的口号。我们以为这是正能量，是前进的动力。可是维尼老师用大量真实的咨询案例告诉我们：成功学是一把双刃剑，用不好，它会实实在在地把人压垮，造成严重的心理问题。\n\n下面，我们就一层一层地把这个话题讲透。\n\n一、成功学，是一把双刃剑\n\n维尼老师说，二三十年来，成功学、励志课程在我国越来越流行，近些年影响更是巨大。客观地看，它确实有可取之处，比如能激发人的潜力、培养意志力。书里提到《读库》里徽州漆器大师甘而可的故事。甘而可四十多岁准备做漆器，一位老师对他说：\"无论做什么，要做就做到最好。如果做不到最好，那就赶快去改行。\"这话激励了他，让他树立了最高标准、付出最大努力，最后真的成了行业最好。\n\n但是请注意，甘而可当时已经是一位非常有悟性、有深厚积累的人，他有实现的能力，激励对他来说只是\"锦上添花\"。如果没有这些条件，哪怕全力以赴，也不一定成功。维尼老师也坦白，他当年虽算有悟性，但在同学中并不突出，能有今天的成就，靠的是心中理想、二十多年持续努力、注重方法，最终\"厚积薄发\"。\n\n所以，适当励志，对成长是有推动作用的。问题在于\"度\"。所谓\"欲速则不达\"，过于努力、急于求成，反而会成为障碍。维尼老师讲了自己二十多岁的教训：他特别注重节约时间，却违背了用脑规律，力求快速思考、同时思考几件事，疲劳了也不休息，不适合的场合也用脑，时间久了，患上了肌肉紧张性头痛，持续了将近二十年，反而浪费了更多时间。\n\n更触目惊心的，是那个大二男生的故事。这位男生说，高中时学得非常痛苦，每天逼自己学最痛苦的事。大家学得都苦、都压抑，怎么长时间维持？他们高中用的是类似\"洗脑传销\"的方法：整天喊\"我要上清华、我要考北大\"，各种宣誓励志，\"只要学不死，就往死里学\"。他说，现在的各种成功学和他们高中一比都\"弱爆了\"。他天天大喊\"我要上清华\"，却不知道清华具体什么样，只知道最难考。他甚至幻想：如果能用十年生命换一张清华录取通知书，该多好啊！他还认真地问自己：如果给你一张清华通知书，但条件是收到后只能活一秒，你愿意吗？他答案是：非常愿意，高兴得都哭了。\n\n在这种励志支撑下，他确实考上了名牌大学，但心理状态已经异常。大一的时候，他行为有很强的攻击性，虽然理智上知道周围环境很安全，却依然非常恐惧，总去想\"周围的人会不会杀了我，如果这样我该怎么办\"。那种恐惧感真实而强烈。此外，他还经历了长时间抑郁，体重短时间内锐减三十斤，作息饮食紊乱，每天严重失眠，书也读不下去了。\n\n维尼老师总结：成功学就像兴奋剂，可能短期提高成绩，但用多了，副作用不小，甚至会留下隐患。从他的咨询经验看，相当一部分来访者的心理问题就是成功学、励志课程造成的；而那些顺其自然、淡泊的人，反而不容易出现心理问题。俗话说\"物过刚，则易折\"——不考虑具体情况，不管条件是否具备，过于执着进取，逞意志之坚强而违背规律，不懂得适时顺其自然，就会造成很多内耗。\n\n二、错误的成功学认知，让人烦躁焦虑\n\n维尼老师在咨询中发现，受成功学影响的人，往往有一些相似的认知：我一定要实现梦想；只要努力，梦想一定会实现；没有做不到，只有想不到；成功了人生才精彩幸福，否则就黯淡无光……\n\n这些话似乎有道理，能激励人，但都\"过于执着\"，容易造成心理问题。\n\n书里有一位妈妈焦急地带着高三儿子来求助。孩子情绪不好，着急、焦虑、烦躁，想学却静不下来。维尼老师通过电话，问了孩子几个关键问题，这就是著名的\"三问法\"。\n\n第一个问题：你考大学的目标是什么？孩子说：\"我觉得自己很强，目标挺高，一定要考上好大学。\"有梦想可以，能给人动力，但梦想一定能实现吗？\n\n第二个问题：你觉得尽全力，就一定能实现目标吗？孩子说：\"如果我尽全力，目标一定能实现。\"这让我们想起那句励志名言\"只要努力，梦想一定会实现\"。可尽全力就一定能实现吗？人不是想怎么样就怎么样的，实现梦想需要一定条件，很多东西自己无法左右。比如没有互联网的条件，维尼老师作为心理学圈外的人，单靠报纸杂志发表文章，恐怕很难实现当年的心理学梦想。又比如这个男生自己已经陷入心理困境，没有专业帮助，恐怕连考好大学都难。所以，即使尽全力，也可能实现不了目标。\n\n第三个问题：你觉得考上好大学会怎样？考不上会怎样？孩子说：\"考上会有确定不错的未来，成功概率大得多；考不上，将来不会很好。\"这种思想，是很多老师家长灌输的。可现实并非如此——现在文凭贬值得厉害，就业形势早已变化，好文凭不能保证什么，文凭一般也一直有机会，未来主要是综合素质的竞争，而这主要取决于自己的努力，考上好大学不是最重要的。能考上固然好，考上一般的，差别也没那么大。努力去做，能考上好大学更好，考不上，人生也一直有希望，所以可以顺其自然。孩子听了，感觉轻松了些。\n\n维尼老师又追问了一个关键问题：你是不是不能接纳目前的状态？孩子承认：\"是啊，我总想着如果能有个好状态就好了，那样就能全力以赴了，所以状态不好时总是烦躁。\"这来自于\"必须全力以赴\"的成功学观念，加上成功愿望过强，即使事实是无法做到\"全力\"，也不愿意接纳。可是，不能接纳就会导致烦躁焦虑，让自己更静不下来去努力。\n\n这一节特别重要，因为它点出了焦虑的核心机制：不是事情本身让人焦虑，而是\"我必须如何如何\"的认知，加上\"我做不到就接受不了\"的执着，共同制造了内耗。\n\n三、过度追求成功，有时是侥幸的赌博\n\n过度追求成功，有时就像一场赌博：可能取得世俗成功，也可能付出身心健康代价，更可能在成功之前就心理崩溃。\n\n书里引用了一位美国华裔学生写给家长的一封信。他被斯坦福录取，是公认的成功，但他却认为自己的高中生涯是\"侥幸的赌博\"。他说：高中四年非常努力，经常非周末没时间睡觉，有时连续几个月非周末期间日均睡眠低于四个小时，连周末都没补觉机会。用褒义词说，他有干劲、有动力、有野心；但实际上，他四年里不论学习还是生活，几乎一直徘徊在崩溃边缘。每得一个A，平均大概就有一次恐慌经历；得不了A，恐慌更严重，他有过跳楼的冲动，大多时候难受得连跳下去的动力都没有。\n\n他说，自己的高中生涯成了家长鞭策孩子的模板，一想到这他就难受，因为他不希望成为别人孩子的榜样，不希望别人活得像他那样痛苦。他最后结局是好的，但代价是什么？高中四年，他的健康——尤其心理健康——完全被忽略，既没时间也没能力面对心理负担，应对方式就是忽视一切。到斯坦福时，心理状况已经坏得一塌糊涂，需要漫长适应才好转。\n\n他感慨：像他那样的高中生涯，其实是一种侥幸的赌博。他有可能考上名校，但更有可能在高中或刚入大学就完全垮掉。没垮掉，只能算走运。这不是值得孩子尝试的赌博。谁都希望孩子成功有出息，但成功的代价，无论如何不应该是孩子的身心健康。\n\n一个人太执着、愿望过强，心理有时反而脆弱，一个小小打击，就可能引发不良情绪，甚至导致崩溃。书里还有个初二男孩的例子：妈妈一直灌输\"一定要考上重点高中，才能考好大学，将来才能过得好\"，孩子深信不疑，很努力，一直保持班上前两名。但初二生物、地理会考摸底成绩不理想，预示可能考不上理想高中。虽然只是模拟失利，他却崩溃了，不上学，在家待了两个月，焦虑不已。\n\n四、\"只要努力，梦想就一定会实现吗\"\n\n成功学有句名言：只要努力，梦想就一定能实现。很多来访者深信不疑。这句话有合理一面，因为很多看似不可能的事，坚持下去可能真会成功。但它也有巨大副作用：它描绘了美好蓝图，既然\"只要努力就一定能实现\"，那为什么不树立高远目标？时间久了，人真的会相信自己\"应该\"能实现。而且很多人相信，只有这样人生才精彩幸福；做不到，就意味着平庸、灰暗、失败。那句\"要么赶紧去死，要么精彩地活着\"，让很多人无法接受自己不能精彩地活着。\n\n可是，目标太高太远，要实现就得对自己提很高要求，但当前能力和基础可能相差甚远。所以自然有些事做得不理想，哪怕只是小小不顺利，也会提示自己\"远大目标可能实现不了\"\"美好未来可能泡汤\"\"一生灰暗平庸不幸福\"，于是容易陷入沮丧、抑郁、焦虑，严重的会得焦虑症、抑郁症。\n\n书里一位女士，本来学习不错，上高中后接触成功学理论，像打了鸡血一样特别努力，梦想考名牌大学，晚上学很晚，早上四五点就起床，成绩当时进步很大。后来偶然的事，她开始觉得自己注意力不集中——其实人都有注意力不集中的时候，很正常。但她很担心，因为目标太高，要实现必须全力以赴，容不得这种缺陷。她急于解决，所以总注意这事，加上担心焦虑，注意力反而更不集中，情绪越来越低落，结果不能学习，患上强迫症、抑郁症，最终不能上学。抑郁焦虑持续了很多年。\n\n五、合理设立目标，努力之后顺其自然\n\n那我们该放弃高远目标吗？不，没必要因噎废食，目标确实能激发潜能。关键是怎么设立。\n\n维尼老师的座右铭是：努力之后，顺其自然。如果你有高远目标，可以保留，但不要执着于\"一定能实现\"。我们要做的是去努力，争取每天有所成长；最终实现当然不错，实现不了也可以顺其自然。\n\n为什么可以顺其自然？实现梦想，可能给我们更好的人生体验，但平凡的人生也可以幸福和精彩。所谓知足者常乐，小进步、小成就会让人幸福，家庭生活是幸福源泉，美食娱乐的幸福每个人都能获得。平凡生活里也有精彩：参加喜爱的运动、唱一首动听的歌、做好一件事、工作完成得漂亮、看一场扣人心弦的比赛，都会留下精彩瞬间。\n\n如果放下过多执着，学会\"努力之后顺其自然\"，心态自然平和，没了那么多纠结焦虑，就有力量更持久地努力。这也是《道德经》\"柔弱胜刚强\"的道理。\n\n维尼老师分享了自己的经历。他二十五六岁时相信\"只要努力，梦想就一定能实现\"，有高远目标，也很执着，认为实现不了、四十岁还平凡地过，人生一定可悲。那时他确实努力，但难免有些事做得不好，这意味着他没想象中优秀，与目标差得远。想到这些，他常情绪低落，劲头不足，持续几个月，清晨醒来想到美好未来可能泡汤就沮丧。该放弃目标吗？不甘心。他苦苦思索，终于有一天醍醐灌顶：树立高远目标并为之努力，本身没错，问题在于太执着\"一定要实现\"。但目标只要努力就一定能实现吗？并非如此，人不是想怎样就怎样，主客观条件不具备，梦想难实现。何必和自己过不去？不如保留目标，它给动力和方向，但没必要总想着能否实现，只要每天不虚度、每天有成长，实力和积累够了、机遇出现，目标就水到渠成；条件不具备，无法实现也没什么，普通成就，生活也可以精彩幸福。\n\n那是一个阳光明媚的日子，他沐浴清凉的风走在阳光下，感觉世界都透亮了。认知转变，犹如拨云见日。后来他遇到大困难——2000年左右，朋友提醒他不是心理学圈内人，想在专业报纸杂志发表文章、为人所知很难。但他对能否实现目标能顺其自然，没受多大影响，继续专注自身成长、实力积累。不知不觉十几年过去，积淀深厚、能力提高、机遇出现，自媒体蓬勃发展，他通过新浪博客、微博自主发表文章，与读者直接沟通，原来遥不可及的目标触手可及，至少在家庭教育方面实现了原有梦想。\n\n维尼老师强调，\"努力之后顺其自然\"，大小目标都适用。组织活动，认真计划协调，争取好结果，但结果取决于很多因素，尽力之后顺其自然。参加比赛，全力拼搏，对结果顺其自然，因为心态好，常超水平发挥；想赢怕输，情绪波动，反而失常。工作、家庭教育也是如此。我们期望孩子养成好习惯，努力之后可顺其自然，晚点培养没什么；帮孩子考好高中大学，结果不理想也可顺其自然，因为未来是综合素质竞争，文凭只是一方面。我们期待孩子优秀，但平凡也可顺其自然，平凡的人也能幸福精彩。父母心境平和，孩子不因压力崩溃，亲子关系好，孩子更合作，反而有利成长。\n\n努力之后顺其自然，是消除成功学负面影响的良药，既保留动力，又避免过多不良情绪。这种平衡的进取心看似慢，实则快，常笑到最后。人生是马拉松，不能总用百米速度冲刺。这种理念对太执着、太进取而遇障碍的人更适合；对不努力、不上进的人，不妨多适度励志。这就是努力和进取的中庸之道。\n\n书里还引用了曾国藩的故事（维尼小语）。青年曾国藩是\"人定胜天\"主义者，推崇意志力量，认为\"志之所向，金石为开\"。初创湘军一无所有，靠意志穿越重重艰险。但经历多次挫折，尤其咸丰七年被罢黜回家的大挫折后，他开始意识到人的主观能动性有局限。他恍然发觉，人生不过一股水流，流到哪里由地形决定，自己不过如豆粒在命运簸箕中跳跃。大彻大悟后，他皈依\"天命\"之说，一改急切焦躁，处理大事从容不迫。他说\"金陵之克，亦本朝之大勋，千古之大名，全凭天意主张，岂尽关乎人力\"，要求弟弟曾国荃将能否攻下南京\"付诸可必不可必之数，不敢丝毫代天主张\"。晚年他更认同，人的主观努力施展范围相当狭窄，环境和时机远比努力重要。孔子说\"五十而知天命\"，曾国藩说\"尽其在我，听其在天\"——成功并不完全取决于自己，有时需要听天由\"命\"。\n\n六、事物有其自身规律，切莫太执着；以及不二法门、淡定从容、识别不合理思维\n\n书里还谈了几个要点。其一是\"事物有其自身规律，切莫太执着\"。这里的\"执着\"是佛教用语，指对某事坚持不懈、不能超脱。禅宗帮人获得内心宁静，核心就是去执着。适当执着需要，但太执着会成为障碍。以家庭教育为例，很多父母对自己想得开，对孩子却很执着，适当坚持努力能帮孩子成长，但过于执着是家庭教育最大障碍。比如执着孩子生活习惯，偶尔不按时睡不刷牙就上纲上线，担心以后都做不好，于是生气发火难免；执意孩子必须成绩好、考重点高中大学，\"一定\"就过于执着，压力大，情绪难控，也给孩子压力，像不定时的炸弹。\n\n其二是\"不二法门\"——维尼老师常讲，看似对立的事情，差别没那么大，可能差不多。比如去赏美景还是和小朋友玩，对孩子都是快乐，何必勉强。其三是\"淡定从容，体会不勉强\"，学会不勉强自己也不勉强别人。其四是\"面对压力从容淡定的秘诀\"，比如\"车到山前必有路\"\"兵来将挡、水来土屯\"\"一般没问题，实在有问题听天由命\"。其五是\"识别不合理的习惯性思维\"，比如把\"必须全力以赴\"\"不优秀就灰暗\"当作真理，要能觉察并转换。\n\n书里也谈了\"过于追求完美\"和\"找不到目标如何度过青春迷茫\"。青春期孩子常因没目标而迷茫，维尼老师的建议是：不必急于找到宏大目标，先做好眼前能做的事，在行动和成长中，方向会慢慢清晰；平凡地生活、学习、交往，本身就有意义，不必因\"没有卓越目标\"而自我否定。\n\n七、给听众的实践启发\n\n讲到这里，我们来做个落地。这一章对我们每个人，尤其对孩子、对自己，都有很现实的意义：\n\n第一，请检查一下，自己脑海里有没有这些\"成功学咒语\"：必须成功、不能平庸、只要努力就一定实现、不优秀人生就黯淡。觉察到它们，是改变的第一步。\n\n第二，设立目标可以，但把它当成\"方向\"而非\"执念\"。每天问自己：我今天有成长吗？而不是：我的目标实现了吗？\n\n第三，接纳当下的状态。状态不好时，越想\"我必须好起来\"，越烦躁。告诉自己\"现在这样也很正常，没什么\"，反而能静下来。\n\n第四，对结果\"努力之后顺其自然\"。像维尼老师说的，这是消除成功学负面影响最好的良药。\n\n第五，告诉孩子、也告诉自己：平凡的人生，也可以幸福和精彩。文凭、财富、名声，都是装载幸福的盒子，幸福才是真正的珠宝，别做那个\"买椟还珠\"的人。\n\n这一章，维尼老师用血泪般的真实案例告诉我们：真正的成长，不是把自己逼成一台永动机，而是有方向、有努力，也有接纳、有从容。成功学本身没错，错的是那把\"双刃剑\"我们只握住了锋利的一面。下集我们讲第八章，如何接纳不完美的自己。谢谢大家。"}, {"title": "第八章 接纳不完美的自己", "text": "各位听众朋友，大家好，我是这本书的导读讲师。今天我们进入维尼老师《内心的重建》的第八章——接纳不完美的自己。\n\n有一句老话：\"严于律己，宽以待人。\"这有一定道理。但维尼老师说，如果对自己要求太高、太完美、太严格，自然常常做不到，于是自责、烦恼、痛苦，就是和自己过不去了。这时不妨对自己好一点，学会理解自己、接纳自己、善待自己、放过自己。放下包袱，才能更好地前行。\n\n我们这一章，就专门来讲\"接纳自己\"这件看似简单、做起来却最难的事。\n\n一、只要是人，就会不完美\n\n我们总有些缺点和不足，现状也不尽如人意，所以可能对自已不满意，甚至自责太多。当然，我们需要成长、改善，但缺点和不足通常不会马上改正，现状也不会很快改变。所以想保持好心态，就需要先接纳自己。\n\n维尼老师介绍了\"无条件自我接纳\"，这是合理情绪疗法创始人、美国心理学家艾里斯所倡导的。艾里斯建议人们学会\"无条件自我接纳\"：个体完全并无条件地接纳自己，无论行为表现是否明智、正确、适当，无论他人是否赞成、尊重或爱他。\n\n这里要澄清几点。接纳自己，不是觉得自己一切都好，而是对自己持客观诚实的态度，清晰看到优缺点，实事求是看现状，学会\"理解\"自己，放下过高标准和要求，对自己宽容一些，不去过多在意别人眼光，平和地接纳缺点和优点、接纳现状。就像接受夏天炎热和冬天寒冷一样，虽然不太如意、不太美好，但可以安然接受，照样愉快生活。如果不肯接纳，为此纠结烦恼，只会给自己添堵。接纳自己，也不是不寻求改变，而是知道改变需要过程，先接纳，再着眼未来逐渐改变、成长。\n\n书里一位妈妈的故事特别打动人。她说：曾经的我，没有得到父母足够包容，觉得是因为自己不优秀才被嫌弃。为讨好父母，对自己要求很严，有了许多道德洁癖，硬要把自己包装成高尚的人，强迫自己变得高尚，只包容好的一面，极度鄙视自己\"不好\"的念头和品质。她很成功地成了人人称道的高尚好人，却迷失了自我，以至于过去十年里，饱受强迫症和忧郁症困扰，不知向谁诉说，差点丢失爱情、怠慢工作、玷污亲情，甚至在生死边缘徘徊很久。后来她终于明白，一个人应该接纳自己、接纳自己的不完整不完美。她开始慢慢接纳曾经鄙视的念头，包容觉得不齿的想法和行为。现在的她经过多年修行，知道很多\"不好\"的表现其实很正常：爱自己的坚强，也爱自己的脆弱；爱自己的稳重，也爱自己偶尔的浮华；爱自己的好皮肤，也爱自己的小眼睛；爱自己的聪慧，也爱自己的神经过敏；爱自己工作雷厉风行，也爱自己很想偷懒钻空子；爱自己对爱人忠贞，也爱自己欣赏身边异性的美好……\n\n这就是真正的自我接纳——不是消灭缺点，而是把\"完整的自己\"温柔地抱回来。\n\n二、找回真实的自己，真正自我接纳\n\n那怎么做到真正的自我接纳？维尼老师给了两条核心方法。\n\n第一条：理解和宽容自己，\"很正常、没什么\"。当我们为某些事纠结时，如果看到事实真相，会发现那些可能是\"很正常、没什么\"的，对凡人来说可以理解，所以不必过于苛责。比如：偶尔说说脏话，很正常、没什么；偶尔忍不住对孩子发火，难免，很正常，只要不经常；心里偶尔冒出不洁念头，不过人之常情，没什么；有些自私，很正常，毕竟不是圣人；说到没做到，只要尽力，也正常，不必太愧疚；努力了但没做好，很正常，吸取教训即可；没经验的事容易出错，难免，反省总结后就有了经验；有时没控制好自己，很正常，谁也不能完全自控……当然尺度重要，过与不及都不好，经常说脏话、经常发火、太自私、经常不守信、经常出错，还是不要轻易原谅自己为好。\n\n一位妈妈说，向维尼老师咨询后，最大体会是：我是一个正常人，出现问题也正常。以前说错话做错事被别人说一句，就纠结半天，觉得自己什么都不是、怎么做都错、不能原谅自己，越做越错越纠结，甚至抑郁痛苦。现在最大变化是不纠结了，错了就错了，很正常，先接纳自己，对身边人和事也看淡，快乐了很多。接纳自己很重要，自己阳光了，看什么都是亮的。\n\n第二条：做能做的事情，其他的顺其自然，不勉强。有时对自己不满意，是因为自我要求太高太完美，自然难以接纳。所以需要放下过高要求，不太勉强自己，做能做的事，对结果顺其自然。\n\n另一位妈妈说，从小父母要求严格，做得再好也得不到表扬肯定，所以一直不自信。工作中生活中，一件小事没做好就一直后悔；对要做的事反复考虑该怎么做、要不要做，怕做不好、怕别人笑话、怕后果。这让她抑郁焦虑，易受外界影响。学习维尼老师理念后，她反思：自己又不是完人，怎么可能样样做好？世界本多样，每个人有特点，缺点在另一方面也是优点；目前能力、生活状态与遗传、家庭、环境等多因素相关，不全是自己问题；不可能做好每件事，也不可能让所有人满意。有了这些想法，慢慢接纳了自己；当能接纳行为结果、学会顺其自然，心就静了，所谓\"静能生慧\"，就能理性考虑怎么做，分析不足、改进提高。自此不断反省，工作生活都成长了。维尼老师点明：接纳自己，不是不思进取，而是卸下不必要压力，减少内耗，更好前行。\n\n三、放过自己，不必太苛责\n\n我们有时太苛责自己。从小被教导\"严于律己，宽以待人\"；有的育儿专家说\"孩子的问题百分之百是父母的问题\"；励志成功学说\"所有失败仅仅因为努力还不够\"。于是我们对自己要求太高，总觉得自己不够好不够优秀；遇到失败，把责任全归于自己；为做不到的事焦虑……这种思维也许激发潜能，但很容易压抑自己、给太大压力、内耗太多，反而削弱前进动力。\n\n书里有位妈妈说，有的专家说\"父母是孩子一切问题的根源\"，她深信不疑，走上自我管理路，对自己严格、对家人严格，希望做到纯粹高尚，才能对孩子更好影响。但这让她很累：事事严格，没做到或有私念，就觉得自己过分，怕被孩子洞察。另一位妈妈说，曾被\"父母是孩子一切问题的根源\"压得透不过气，内疚自责，然后孩子问题依然存在，情绪失控屡屡出现，抑郁得快出问题。幸亏遇到维尼老师，才明白自己不是圣人，要先接纳自己再改变孩子。维尼老师说：\"接纳孩子，也要接纳自己；不苛求孩子，也不要苛求自己。知道孩子有些问题正常，也要知道自己的某些表现也正常；知道孩子能力有限，也要知道自己的某些错误是能力有限所致。\"伤害孩子后，内疚、自责、道歉应该，但当妈妈也有成长过程，过去就过去，凡事向前看，努力给孩子最好的爱。这样心静了，才有力量改变、好好教育。\n\n维尼老师总结：我们需要反省自己，但不要过多自责；需要理解他人，也要理解自己；需要对自己有要求，也要宽容自己。成长需要时间，只要今天比昨天好、明天比今天好，就可以。苛责自己过多的人，需要学会放过自己；对自己太宽容的人，不妨苛责更多些。这也是中庸之道。\n\n四、理解自己，放下过多自责\n\n维尼老师区分了\"反省\"和\"自责\"。大学毕业后，他每天花几小时反省自己，对成长帮助大。反省时心态平和、思考理性，先接纳自己再求改变。但自责不同，自责时内心沮丧痛苦，思考有时不理性，自责是不接纳、惩罚自己。适当自责正常，会留更深印象、促进反省；但把过多责任归于自己、苛责自己，就是伤害。所以，反省多多益善，自责还是少些好。\n\n一位七年级男孩妈妈来咨询。她小时候性格有问题，痛苦经历让她特别在意孩子性格，看到孩子出问题就紧张焦虑、忍不住发火，明知对孩子不好却控制不住，常懊悔自责：\"我不应该这样，对孩子很不好。\"维尼老师说，其实不懂方法时难以控制情绪，很多家长都这样，其中有原因。\"应该\"如此，很正常——这样容易接纳自己，再去学认知疗法调节情绪。\n\n维尼老师还讲了自己组织运动会的例子。他在科研机构时常负责部门运动会组织，尽心尽力，每次总分冠军，组织受好评。有一年另一部门异军突起，加上自己部门实力下降，没获冠军，只获第三，与第二名仅差五分，大家遗憾。有人批评他组织有问题，他坦然对待，也反省待提高方面，但没自责。因为他知道：第一，实力下降、与冠军差距不小，没夺冠很正常；第二，很多问题想不到或事后才想到，放马后炮谁都会，但当时想到难，所以小失误正常，换个人组织也不会更好；第三，这不是他一人责任，与领导和很多同事有关。他做了能做的、尽力了，吸取教训再提高即可。有人问这是不是找借口推卸责任？他说不是，人不是神，做能做的事就可以，没必要承担不属于自己的责任，尽力了、有教训总结即可。放下过多自责、接纳自己，才能以更好心态面对问题、解决问题。\n\n五、面对批评，如何淡定自若\n\n维尼老师年过四十才学车，早听说教练火气大，专门找了温和教练，确实好脾气。加上他悟性不错，倒车入库阶段几乎没被训过。但考试临近，教练终于开\"训\"了。第一次练半坡起步定点停车出了差错，教练急了，\"木头脑袋\"之类话冒出来。他听了没在意，继续琢磨练车。后来去考场适应，最拿手倒库出问题，简单曲线行驶也错乱，教练发脾气骂人。他微微一笑，没受影响，泰然自若继续练。\n\n为什么能不受影响、淡定应对？因为他\"善于\"理解自己。练半坡起步出差错，其实是因为刚练踩油门刹车配合，不熟练很正常；技术动作多、第一次练，想着这个忘那个再正常不过。适应考场出差错也正常，场地从来没来过，情况和驾校不同，要点虽在教练看来简单，但一下子记不全很正常，毕竟四十多岁的人了。理解了自己，就知道有些表现合理、有原因，也就不会否定自己，从而镇静自若，继续好好练车。相反，如果教练一骂就自责、懊悔、紧张，可能六神无主，怎么练好？把事做好需要良好心态，过多自责懊恼难集中精力，反而影响效率。理解自己、放过自己，看似放低要求，但心态好了，反而容易做得更好。正所谓\"慢就是快，后退是为了前进\"。\n\n六、对于别人，我们只能负有限的责任\n\n有责任感、重视别人感受、关心家人，都好，但过度了，对自己是枷锁，对别人可能也是负担。\n\n对孩子的将来不要太负责任，不需要每步替孩子规划好，不必要求自己一定把孩子培养那么优秀。人的能力有限，很多事无法掌控，所以不必太执着，努力之后顺其自然。这样我们不那么焦虑、不强求孩子，对孩子负面影响少些。对亲人不必过于牵挂忧虑，这也是亲人不愿看到的。比如打电话不接就担心得不得了、生怕出事；知道生病就非常难过、茶饭不思……这对自己是煎熬，对亲人也没帮助。每个人有自己的命运，我们只能负有限的责任，做能做的事去帮亲人，之后听天由命。说话需要考虑别人感受，但我们无法做到恰到好处，有时不小心得罪人也正常，没必要太在意到小心翼翼。无意中让别人感觉不好，致以歉意、以后注意即可，不必自责不已。和他人相处，尊重他人意见，但也别太勉强自己。别人喜欢的事自己不喜欢，可适当拒绝，不必给太多负担。和老人相处需恭敬，也可表达真实感觉，话说明白对双方可能都好。对爱人，方式恰当，表达真实感觉有时也合理，不会过多压抑自己，也有助于沟通。\n\n七、做真实的自己，我们就可以爱自己\n\n书里收录了维尼老师的网络好友\"葱蒜妈\"的一篇文章《原来，我们可以爱自己》。2014年，她努力的唯一主题似乎就是\"做自己\"：QQ空间里，敢说对某事的反对意见了，敢表达情绪低落与悲哀了，而不总以积极阳光正能量身份出现；敢表达孩子不懂事不听话烦人讨厌了，而不总表达他们纯真可爱；敢说父母不是了，而不总感恩；不想参加的聚会就不去了，不想搭理的人就不搭理了，不再生怕得罪任何人；老公提议的事不想做就不做了，回他家不再只跟在别人后面做小跟班，宁愿看人家热闹、守自己宁静；不再对自己说\"拼搏努力再努力\"\"未来一定会更好\"\"做一个更好的自己\"\"为了孩子家人我要更努力\"——不需要再努力、不需要一切更好，当下的自己已经挺好，爱着现在的自己、享受当下幸福。\n\n当然做自己不容易。拒绝老公的提议会有些内疚；拒绝别人会担心是否真得罪人；拒绝孩子会感觉是否自私；表达不同意见被网友批评，会感觉自己狭隘、后悔没说得滴水不漏。但拒绝后发现，很多时候别人并没因拒绝而生气，反而因知道她喜好而关照，反而是自己因内疚总放不下。原来拒绝别人最大障碍不是别人，而是自己；原来可以做自己，不必总因考虑别人委屈自己。后来同事到办公室串门说\"你们把办公室收拾一下呗，太浪费\"，她说\"亲爱的，你就允许我们乱一点嘛\"，同事笑笑走了，她心里没一丝愧疚。能够爱自己，才能更好地爱别人；自己被爱了，才能发自内心爱别人，不再把爱来源指望别人，而由自己心里发出，由衷爱自己、欣赏自己，不需一丝内疚不安。她终于明白：原来我们可以爱自己。\n\n我们从小被教育的标准，就是是否满足别人需求、能否让别人满意，说白了就是是否听话、有眼色、懂事、能体察别人需要与喜怒。打碎杯子听到悦耳声音、看蚂蚁感受观察小生命乐趣，却总有大人告诉我们\"那是错的，你应该如何\"。久了，我们习惯听从别人评价、按别人价值观评价自己，自身感受需要要么被压抑要么被扭曲，所以越来越多人不快乐却不知原因。学会做自己，是快乐的开始。\n\n八、改变需要时间，带着问题去生活\n\n人在尘世，难免出现心理困扰，本身就痛苦，这是第一层烦恼；如果因自己有问题而痛苦，纠结\"怎么会有这样的问题、什么时候消失\"，就生出第二层烦恼。所以解决问题第一步是先接纳自己的问题，至少不会有第二层烦恼。\n\n维尼老师二十多岁时有些强迫行为，比如反复检查东西在不在、看书时忍不住看书桌东西是否摆齐，对他有些影响，但他理解这是正常心理规律产物，能接纳、不为之焦虑，带着它一起生活，再慢慢研究解决方法。几年后强迫行为慢慢消失，他还因此深刻理解强迫症心理机制，总结出解决方法，收获颇丰。相反，如果有强迫症状，当成可怕的事、急于解决、很紧张焦虑，在这种心理状态下，强迫行为或思维会被强化，更难治疗。\n\n抽动症也是如此，它本身就是紧张焦虑的习惯性宣泄，如果因抽动症而紧张焦虑，反而加剧症状。第一步是认识到抽动症状只是紧张焦虑外在表现，不大影响别人就没啥，先带着它生活，把注意力放减缓紧张焦虑上，既有助于放松，也有利于解决。抑郁症也是，如果已抑郁，可能持续几周甚至几月，难很快走出，所以不要抗拒这种状态，先带着它生活，多转移注意力改善情绪，有助于摆脱抑郁。越是抗拒、因抑郁而焦虑，越难解决。\n\n一位高三学生很上进，希望有好学习状态以全力以赴，但有时上课走神、学不进去、无法保持好状态、无法全力以赴，这让他郁闷低落，在这种情绪下更学不进去，恶性循环。所以第一步是接纳这种状态，把它当正常、应该有的状态，心情放松平静，状态反而会好些，再慢慢等待调节，进入良性循环。接纳自己的问题，是改变第一步，也很重要。这也是森田疗法所提倡的——森田疗法一句话概括：顺其自然，为所当为。它要求把烦恼当作自然感情顺其自然地接受接纳，不要当作异物拼命排除，否则会因\"求不可得\"引发思想矛盾和精神交互作用，导致内心激烈冲突。如果能顺其自然接纳所有症状、痛苦、不安、烦恼，默默承受忍受，就能从被束缚机制中解脱。森田疗法强调，不能简单把消除症状当治疗目标，而要从反复想消除症状的泥潭中解放出来，重新调整生活。先接纳问题，少了内心部分冲突，再用合理方法解决。有些问题解决好需较长时间，所以先带着问题生活，心态平静了再慢慢解决，有助于走向良性循环。\n\n九、接纳自己，放下道德洁癖\n\n书里还有维尼老师写给一位高中生的信。这孩子对自己道德要求太高，发现一点做得不好就自责很久，这就是道德洁癖。维尼老师告诉他：你希望做高素质有道德的人，想法挺好，是优点；但努力提高道德素质不错，不必要求太完美，有些瑕疵也不必自责太多。有些\"错误\"不过是人之常情，有些做得不够好其实\"很正常，没什么\"。国学大师季羡林说过：\"我说过不少谎话，因为非此则不能生存。\"可见有时不得已的谎言其实\"很正常，没什么\"，这没影响季羡林成为学界泰斗、大家尊敬的人。曾国藩知道吧？中国最后一个圣人，但也和尘同光、遵循人情世故、收受礼金，不然无法在官场立足、为国家做事。\n\n对孩子来说，很多\"小错误\"不过人之常情。比如考试打交卷铃后老师让放笔，你又写了几笔，觉得自己做错又没承认，担心品德问题、会变坏。其实老师说放笔我们有些题没写完、忍不住写几笔很正常，维尼老师以前也有过，老师也考虑到这是人之常情，没严格追究。在图书馆看书无意用笔划了印痕，很正常，又不是故意，不算破坏图书，很多人有类似经历，以后注意就行。偶尔不小心看电脑跳出不雅视频就觉得做了见不得人的事，其实这年龄即使想看也很正常，不算丢人，与道德关系不大。维尼老师也遇到过类似情况：一位大学生对自己道德要求近乎完美，要求对得起别人、甚至对别人比对自己好，本值得敬佩，却深深陷自责。初中同学车祸去世，他感到可惜，却冒出\"走了也算解脱\"的念头，就自责\"我还算个人吗\"——其实偶尔有这种念头很正常。女同学申请助学金，别人问他\"她家怎么了、有资格么\"，他说\"她爸爸去世了，我们是高中同校我知道\"，以后见她就自责觉着对不起她，骂自己变态——其实他也是在帮女同学澄清误会，不需指责。他回顾交往过的女孩大多家里有钱，自责自己拜金，虽说不看重钱但表里不一——其实爱对方同时也喜欢对方有钱也是正常现象，有时不影响感情真挚。话说回来，他能为这些事自责，恰恰说明道德要求高于一般人，但道德洁癖却让他痛苦。我们需要完善道德素质，同时也要接纳自己，有些事其实很正常，没必要自责太多，才能卸下包袱上路、更好成长。\n\n维尼老师最后提醒：心理成长需遵循中庸之道，有道德洁癖的人要学会接纳自己、放下过高道德要求；道德要求太低的人则需提高要求，适度最好。\n\n十、给听众的实践启发\n\n这一章，是我们和自己和解的钥匙。请记住几个要点：\n\n第一，\"无条件自我接纳\"不是骄傲自满，而是客观诚实看自己、平和接纳优缺点和现状，像接受夏热冬冷一样接受不完美的自己。\n\n第二，遇到纠结，先问自己：\"这很正常、没什么吧？\"把\"很正常、没什么\"当成口头禅，内耗会少一大半。\n\n第三，区分\"反省\"和\"自责\"。反省多多益善，自责少些为好。做能做的事，其他的顺其自然。\n\n第四，面对批评，试着\"理解自己\"——不熟练、第一次、状态不好，都正常，不必因几句难听话就否定自己。\n\n第五，对他人只负有限责任，不必背负所有人的命运；对自己，先接纳再改变，带着问题也能好好生活。\n\n第六，道德上别太洁癖，季羡林、曾国藩都有\"人之常情\"，何况我们。\n\n这一章，维尼老师用最温柔的笔触告诉我们：你不需要变成一个完美的人才配得上被爱，你本来的样子，就值得被自己接纳。下一集我们讲第九章，顺其自然的人生态度。谢谢大家。"}, {"title": "第九章 顺其自然的人生态度", "text": "各位听众朋友，大家好，我是这本书的导读讲师。今天我们来到维尼老师《内心的重建》的第九章——顺其自然的人生态度。\n\n你有没有过多的纠结、懊悔、烦躁、焦虑？是否想找到顺其自然的感觉，就像水流在溪谷里穿梭，虽有诸多坎坷曲折，却能顺其自然、奔流而下、一路前行。这种感觉想想就舒畅，这样的人生也是享受。维尼老师说，放下纠结、学会顺其自然的秘诀，就在于建立合理的习惯性思维。\n\n这一章，是前面所有方法的\"集大成\"——它把三种思维、不二法门、接纳事实，变成了一种可以天天体验的人生态度。我们一层层来讲。\n\n一、以幸福为出发点，一切都豁然开朗\n\n维尼老师二十多岁时很迷惑：成功、财富、声誉、爱情、事业、家庭、健康、友谊、人生享受……皆我所欲也，但哪些更重要？如果它们之间冲突矛盾，该如何权衡？牺牲哪些、保全哪些？\n\n后来他找到了破解难题的关键：幸福。人生不过是为了获得幸福，如果以幸福为出发点去权衡，就豁然开朗。我们所追求的一切，如果有益于幸福，就值得努力；如果损害了幸福，就需要改变。\n\n比如财富带来尊严、享受、成就、自由等幸福感；但若追求财富过程太过辛劳、心情焦虑、压力太大，就损害了幸福，需调整。很多人的信条是事业第一，但成就事业目的也是为了幸福，别忘初心。如果为事业牺牲健康、过多影响家庭、生活缺乏品质、让我们不幸福，就有必要思考怎么值得了。\n\n对孩子也是如此，我们常期望孩子优秀，初心可能是为孩子将来幸福。但如果只盯优秀不管孩子当下幸福，可能让孩子痛苦，对心理性格有不好影响，将来可能也不幸福，有违初心。还记得\"买椟还珠\"的故事吗？事业、财富、名声都是装载幸福的盒子，幸福才是真正的珠宝。当我们为这些牺牲幸福时，想想自己是不是那个买椟还珠的郑国人？中国传统文化崇尚内心与人生和谐平衡，以幸福为出发点平衡各要素关系，就容易获得内心和谐。另外，关注幸福，也容易放下对财富名利的过度执着纠结，努力之后顺其自然。\n\n二、顺其自然，才会有顺心如意的感觉\n\n书里维尼老师讲了自己一个阳光灿烂日子的真实经历。他本来计划上午去青岛北九水看雪景，想想画面都醉了。但昨晚姐夫来电话，请他帮忙去火车站把车开回来。他理解难处，只能去帮忙，不过想下午再去北九水也可以，虽没上午完美，相差也不大。回来准备出发，邀请女儿一起去，女儿不想去，打算和小朋友玩。他琢磨，去赏美景还是和小朋友玩，对她都是快乐，何必勉强？顺其自然也不错。到了北九水，需换乘景区大巴，不巧上一班刚开走，下一班还要等二十分钟。运气不好？呵呵，本该如此，上天本来就不该一直眷顾自己，等车时间可能短可能长，很正常没什么。进了景区，山上雪几乎融化，预期雪景看不成了，该失望吗？其实也没啥，世界有自己轨迹，不是按预期运转，看不成雪景也没什么，既来之则安之，还有冰瀑和冰下泉水，也不错。然后爬山，一会儿热了，想该穿运动羽绒服，身上这件太热有些臃肿。转念一想，没想周全也很正常，不必追求完美，有点热有点臃肿有什么？想法变了，就释然。天气不错风景怡人，静静享受自然恩赐。回到大巴发车处，车又刚开走，末班车据说还要等四十分钟。呵呵顺其自然吧，他到路口看有无顺风车，没有再回来坐末班车也无所谓，在空气清新山谷等等也不错。看到几辆车招手都没停，不停就不停吧，咱们国家顺风车文化还不浓，理解。后来又来一辆，招手停了，车主友好让他搭上车，嘿嘿多了种人生经历，比起赶大巴也不错（这就是三种思维）。坐车奔驰回家，他神清气爽。因为有了合理习惯性思维，虽有诸多不完美不如意不顺利，都能顺其自然、顺势而为，感觉颇为自在。顺其自然的心态是种美妙感觉，世间本无万事如意，但学会顺其自然，就会常有顺心如意的感觉。\n\n维尼老师总结，如果我们拥有这些习惯性思维，就容易顺其自然：\n面对挫折失败：坏事变好事；很正常，没什么；没什么大不了的；接纳、顺应事实；顺其自然。\n面对纠结：不二法门，差别其实没那么大；不同结果可能差不多，各有利弊。\n面对懊悔：本该如此；不顺利不完美是应该的；上天本来就不该一直眷顾自己。\n面对忧虑：车到山前必有路；兵来将挡水来土屯；一般没问题，实在有问题听天由命。\n学会不勉强：不过于勉强自己，也不过于勉强别人。\n计划受阻：顺势而为，随机应变，随遇而安，既来之则安之，顺其自然。\n\n书里一位读者分享：今天体会到\"顺其自然\"的感觉了。去上班本想任性打出租，路上没空车，改步行，到前面公交站一边等公交一边打车（顺其自然、顺势而为）。恰好发现路边树上与众不同果子，拍了照片，心里美美的（坏事变好事，不同选择各有利弊，差别没那么大）。另一班公交来了需倒车才能到单位，那就倒吧，没直达车又何妨（没什么大不了，顺其自然）。如此心情平静愉悦到达单位，虽过程与预计变化大，但欣赏了平时没看到的风景、拍了满意照片、还按时到单位，心情仍平和愉悦。生活很美，顺其自然真好。\n\n三、以出世的精神做入世的事业\n\n世上有诸多烦恼痛苦，人们盼望解脱，用禅宗说就是\"出世\"。但世界也有很多美好幸福，人们又想去经历享受，或有自己责任，做不到看破红尘放下一切，所以还需\"入世\"。看似矛盾的双方如何统一？传统文化一句话给了答案：\"以出世的精神做入世的事业。\"简单讲，就是尽人事由天命，或像维尼老师说的，努力之后顺其自然。\n\n具体怎么做？对要做的事不回避不退缩，努力去做，在当下从容自然、合乎规律，不太勉强自己。不同结果之间差别往往没看起来那么大，或结果无法改变，不妨顺其自然。这样过程是平和的，对结果也可超然。减少了焦虑痛苦的内耗后，反而更容易把事做好。如此，我们照常生活、享受尘世快乐、尽自己责任，同时从痛苦烦恼中解脱出来，身在闹市也如同出世。\n\n四、现实就是答案，不和事实较劲\n\n维尼老师和女儿看《樱桃小丸子》。夏季炎热，小丸子觉得酷热难当、烦躁不已，到处找有空调的地方，而憨憨的山田却在阳光下快乐抓知了、玩得不亦乐乎。小丸子奇怪问：\"你不热吗？\"山田说：\"夏天就是热的，不热就不是夏天了。实在觉得热就到树底下凉快一下。\"小丸子若有所悟。山田随口说的话是有智慧的：事情就是如此，不接纳就会烦躁不安，接纳了、当成理所当然的就安静了。很多事很正常、应该如此、顺应即可。\n\n孩子生病了，也许让你纠结：他怎么生病了？如果不生病多好，如果我注意到那些事他可能不生病……生病打乱多少安排！这样难免心烦意乱。但事实是孩子已经生病了，适当反省需要，过多思虑纠结没必要。既然改变不了事实，不妨拥抱事实、顺应事实，兵来将挡水来土屯。静下心来，更有力量陪伴孩子，病也能及时治疗。\n\n孩子有题不会做，你也许想：\"你应该会做，你怎么能不会？你怎么能不懂？\"其实孩子确实不懂不会，这就是事实，存在就是合理的、有原因的，他其实是\"应该\"不会，我们需顺应事实，才能平静，之后才有力量考虑怎么帮孩子提高。\n\n家庭矛盾中最常见的是我们认为对方应该如何：应该干家务、应该管孩子、不应该抽烟喝酒……如果觉得对方应该如何，而对方事实不是如此或至少不能马上改，烦恼就来了。如果知道对方可能改不了或不能马上改，最好先拥抱事实、顺应事实，就不会有那么多不满，心静下来，我们的态度和方式也许容易为对方接受，至少不那么抗拒，反而更可能慢慢改善。\n\n面对不顺利不如意，我们可以尝试改变，但如果无法改变或暂时改变不了，不妨学会接纳事实、顺应事实，心会静下来、更理性处理。不肯接纳事实，有时只徒增烦恼。\n\n书里一位六年级男孩妈妈咨询。孩子常纠结很多事、放不下。比如心情不好想玩会儿游戏转移注意力，但玩输了又不高兴，还想再玩，结果玩几次还是没赢，妈妈和他去姥姥家，孩子情绪不好骂了些脏话发泄。妈妈很不高兴，心想孩子你怎么这样、玩输了不高兴为什么非要再玩、心情不高兴怎么就说脏话？事实是：孩子现在就是这样的，输了就是不高兴、不高兴了就是要发泄。妈妈和事实较劲是徒劳无益，还是放下纠结、接纳现实、再慢慢改变为好。\n\n日本电影《红鳉鱼》有段话引人深思：现实就是答案，就算抱怨生不逢时社会不公也不会有任何改变。现实就是现实，要理解现状并分析，那其中一定会有导致现状的原因，对原因充分认识后再据此付诸行动。黑格尔也有名言：存在即合理。这不是说存在的就是正确的，而是说存在的就是有原因的、有理由的。接纳现实、心态平和，再在此基础上努力改进。\n\n五、转念之间，收获幸福自在\n\n面对不顺利，如果总觉得不该发生，就容易纠结；而转念一想，它也是人生的一种经历，就容易欣然接受。\n\n外出办事下楼才发现手机没带，那就回去拿吧，耽误时间？没什么，也是人生一种经历，顺其自然。开车回家恰好小学放学路有些堵，为早出发懊悔？没必要，预料不到也正常，堵就堵吧，也是人生一种经历。女儿学校打电话说资料忘拿请送去，东西多有时忘记也正常，那就送去吧，也是人生一种经历，不用过多评判意义。想修下水管没想到有些麻烦不大顺利，呵呵，人生一种经历而已，静下心琢磨琢磨就搞定。早上跑步该穿跑鞋结果穿旅游鞋不太完美？没关系差不太多，也是人生一种经历。滴滴打车车来晚了，一问司机不熟悉路跑过了，可理解，就当成人生的一种经历，没必要抱怨司机。\n\n每天有很多小事发生，可能不完美、耽误时间、不如意、不顺利……如果过多纠结不完美，烦恼就来了。而转念一想，这些不完美也是人生的一种经历，安然接纳，心就静下来，收获的是自在幸福。\n\n六、面对懊悔我们该怎么想\n\n懊悔本身有积极意义，会对教训留下更深刻印象，驱动我们反省。但过于懊悔就不好，会成为负能量，需调节。我们遇到不顺利不完美，比如比赛输了、钱丢了、东西损坏了……为什么会懊悔？往往是因为觉得\"本不该如此\"\"如果那样做就不会这样了\"。可惜人生没有如果，\"如果\"只是后来才能想得到。存在就是合理的（合理指有原因），已经发生就是有原因的，可以说本来就\"应该如此\"。\n\n比如驾车不小心有些剐蹭，如果你觉得本应避免，就容易懊悔。其实想想这往往有原因，如驾驶技术不精、注意力不集中、有些情况没经验，所以其实应该剐蹭，想法转变了就淡定多了。有一次去张家界游玩，没注意被小偷窃取一笔钱，如果觉得\"本该避免\"就懊悔不迭；但转念一想，还是因为没经验、没料到这地方小偷多，所以该丢钱，就算破财免灾，以后注意即可。全家去旅游精心准备火车上吃的饭和水果，因出门太匆忙忘记拿了，当时有些懊恼，一是旅途吃得不满意，二是东西放几天就坏不该忘拿。后来一想，其实没什么，临时再买无非多花钱吃得稍差，东西虽可惜但没多少损失，忘记就忘记吧没什么了不起；另外出发时间太紧所以忘记有一定必然性，其实\"应该如此\"，懊悔就烟消云散。\n\n一位高二男生常因事没做好而懊悔，比如考试因粗心失分就总纠结。他思维模式是：我本应该得这些分，不该失去。这样想自然懊悔。事实是：所谓粗心大部分是有原因的，如情绪控制、时间管理、审题习惯、能力、知识理解是否透彻等。所以所谓粗心大部分不是粗心，是\"应该\"错，不是想避免就能避免的。转念一想自然不那么懊悔。当然考试后还需总结分析、吸取教训成为经验，下次\"粗心\"会少些。\n\n维尼老师从第一季追美剧《权力的游戏》，开始觉得残酷，总觉得好人不该有这样痛苦悲惨遭遇，有点看不下去。后来改变认知：这些残酷都是命运安排，残酷也是常态、是应该的，这样能接纳、心情平静，就能安然欣赏剧情。看待真实人生也是如此。收藏专家马未都在西藏行走时遇到磕长头的藏民，那些藏民觉得一路上所有遇到的都是人生中必然遇到的，比如疾病和苦难，遇到什么就是什么。而我们遇到疾病困难第一反应常是：我们怎么这么倒霉？如果我如何如何做就不会这样了。这两种思维各有所长：藏民思维帮他们坦然接纳困苦挫折、淡定平和，但主动预防改变能量少些、可能缺乏主观能动性；我们思维主观能动性更强、更进取，有助于预防改变，但容易焦虑懊悔纠结。维尼老师认为，这两者可以结合：坦然接纳事实，在此基础上再去反省、吸取教训、积累经验、争取成长。\n\n七、如何减少不必要的忧虑\n\n忧虑担忧本身有积极意义，能未雨绸缪防患未然，但忧虑过多就不好，会带来不必要痛苦烦恼，甚至成心理障碍。怎么减少不必要的忧虑？\n\n第一，如果可能出现严重后果怎么办？一位来访者常因各种事忧虑，后来学了卡耐基的\"消除忧虑万能公式\"，结果更忧虑，有时几个月为一个问题忧虑、殚思竭虑。公式是：先分析情况找出最坏情况；让自己在必要时候接受它；把精力用来改善已接受的最坏情况。这方法某种情况有效，比如维尼老师投资股票下跌不少，开始略忧虑，后来分析这家公司属低估值绩优股，最坏情况也就是损失几万元，放眼几年可能上涨，最终保本盈利有可能，牺牲的只是几年时间，一想就平静多了——如果最坏情况能接受，这思维就有效。但如果最坏后果太严重，就难消除忧虑，比如有人理发师剃须刀刮破出血，想到最坏染上艾滋病，可能性虽小但存在，所以忧虑几周；孩子放学没按时回，想到最坏出车祸被拐走，可能性有所以焦虑不已。\n\n那如何坦然面对严重结果？维尼老师有个习惯性思维：\"一般没问题，实在有问题，听天由命。\"出现严重后果可能性存在，不否认；但出问题概率很小、一般没问题，也是事实；万一出问题就听天由命。这样把注意力放乐观方面，对可能严重后果听天由命就不那么担忧。这方法也适合后果不严重的情形。担心染艾滋病，可说服自己：一般不会因剃须刀染上、可能性很小，实在有问题听天由命；孩子没按时回家，告诉自己：一般不会出问题、运气没那么坏，实在有问题也只能听天由命，就淡定些。维尼老师乘飞机有时担心，尤其空中颠簸，失事可能确实存在，但他会告诉自己：一般没问题，实在有问题就听天由命。第一句安慰自己出事概率小，实在有问题反正也没办法，就坦然得多。对无法掌控的事不妨听天由命，忧虑改变不了什么。有年暑假去桂林玩，已订好团和机票，看天气预报天天有雨，夏天特点，这事只好听天由命，担心也没用，到时候雨也许没那么多。\n\n第二，总担心可能遇到的困难怎么办？人们常说\"人无远虑必有近忧\"，需对未来准备考虑、提前计划。但忧虑过多、总想把各种可能搞清楚、反复考虑还是难释怀，就是自寻烦恼。此时不妨告诉自己：\"车到山前必有路；兵来将挡、水来土屯。\"过多为未来担忧没必要也没用，因为未来常不按预想运行；即使遇到困难，俗话说\"活人不能被尿憋死\"，自然有解决方法，实在难解决听天由命即可。比如父母想很远，孩子还小就担心将来就业，转念一想：车到山前必有路，到时候自然有办法，儿孙自有儿孙福，各有不同轨迹道路，不必操心太多。维尼老师科目三考试看到有人很焦虑担心出问题，其实考虑再多也可能出意外，兵来将挡水来土屯，遇新状况再想办法应对。有一次自由行开始想到各种困难有些担心，后来告诉自己车到山前必有路，遇到问题总有应对方法，到时候再说，就放心憧憬旅途美好。\n\n第三，学会淡定。如果放大事情负面影响，自然容易忧虑，所以想淡定需先改变认知。一位来访者与人交谈有些紧张，不敢对视，怕被看出紧张、以为有心理问题或精神问题，这是把事看得过于严重，不妨用三种思维重新分析：第一，坏事变好事——心理为什么出问题？往往有性格认知根源需改善，现在表现出来了也是心理成长机遇，学习掌握合理方法不仅解决心理问题也让自己成长，所以坏事变好事；第二，很正常没什么——大多数人一生或早或晚都会有心理问题，很正常；第三，顺其自然——有问题就有问题吧，先带着它生活，慢慢再想办法解决。有了合理认知、变得淡定，就不那么容易忧虑。\n\n第四，缓解情绪。负面情绪会导致忧虑加剧。在焦虑悲观甚至抑郁情绪下，人对消极面敏感、对积极面迟钝，会不由自主想到更多负面消极事、放大其影响，即使想用三种思维效果也不好。此时面对忧虑第一步是缓解情绪，最好先转移注意力，如运动、看电影、看书、聊天，直接调节情绪。情绪好转了再调整认知，效果好得多。\n\n八、我们要努力进取，也要随遇而安\n\n有一次带女儿办护照，网上预约了女儿的，维尼老师也想顺便办去台湾签证。女儿护照顺利，但他提出自己要求时，办事员说需要预约，他没想到这规定，看来还要再来一次，心中有些遗憾（追求完美的心理）。不过转念一想，办护照经验不足所以可能出纰漏，很正常，再来一次也没什么大不了，还可顺路办其他事也挺好（三种思维）。认知改变，遗憾消失，这就是随遇而安。\n\n不知从何时起，随遇而安成了贬义词，说一个人随遇而安，通常意味着不够努力不够进取。深究起来，这种看法深受成功学励志学影响。不过随遇而安和努力进取看似矛盾，却可通过中庸之道统一。我们需要努力进取，但不要太勉强，做不到不妨随遇而安；尽量计划安排好，但情况变了，随遇而安、顺势而为也不错；大方向目标需坚持努力，小事情随遇而安就好，人时间和精力毕竟有限。恰当时候、适当随遇而安，帮我们不怨天尤人、不徒增烦恼、更好面对现实。有了平和心态，反而更有力量努力进取、完成计划目标。\n\n书里一位读者分享厦门自由行：下飞机出租司机告知刚接通知三个台风将影响厦门、鼓浪屿可能停船，开始有些紧张，后来想台风是老天爷的事，既来之则安之随遇而安。因为有风天气没那么炎热，坏事变好事。第二天收到提示因台风鼓浪屿可能暂停开船，事实无法改变顺应就好。第三天天气好去了鼓浪屿，船上女儿忽然给他看短信携程提示预订旅馆必须中午12点前到，他有些傻眼，首次自由行没经验没注意这要求。事已至此不管了，反正已订缴费，车到山前必有路，上岛再交涉。后来到旅馆主人说那是网上规定，他家客人只要不退订房间一直保留。这次旅行看似颇多不顺利，但他因有合理习惯性思维、随遇而安，就觉得幸福自在了。\n\n九、舍与得：放下不必要的执着\n\n暑假维尼老师想带孩子去台湾自由行，研究半天发现不少麻烦事，暑假可能台风暴雨、不确定性大，一时压力有些大。不过转念一想，为什么非要去台湾？为什么非要自由行？实在不合适可以不去，或另选时机跟团去，也没什么了不起。瞬间压力消失，又继续研究。\n\n我们常说要迎难而上、坚持到底、不抛弃不放弃。是的，如果事情重要又没其他选择没退路，确实需要如此。但如果其他选择也不错、或能灵活变通、或事情本身无所谓，那为什么非要迎难而上、坚持到底、不放弃呢？有一句充满智慧的名言：做正确的事情，比正确地做事情更重要。在迎难而上坚持到底之前，先思考坚持下去是否是正确的、是否确实需要如此。如果没必要，就可以放轻松些。\n\n十、给听众的实践启发\n\n这一章，是把所有方法提炼成一种\"活法\"。请带走这几句话：\n\n第一，以幸福为出发点权衡一切。事业、财富、名声都是盒子，幸福才是珠宝，别买椟还珠。\n\n第二，把\"坏事变好事、很正常没什么、顺其自然、本该如此、车到山前必有路、一般没问题实在有问题听天由命\"变成你的习惯性思维，像维尼老师那样，在日常小事里反复练习。\n\n第三，现实就是答案，不和事实较劲。孩子生病了、题不会做、对方不按你想的来，先接纳再想办法。\n\n第四，转念之间，把不完美当成\"人生的一种经历\"，安然接纳，收获自在。\n\n第五，减少忧虑靠两点：对严重后果\"一般没问题听天由命\"，对小事\"车到山前必有路\"；忧虑时先缓解情绪再调认知。\n\n第六，努力进取也要随遇而安，做正确的事比正确地做事更重要，该放下不必要的执着就放下。\n\n这一章，维尼老师教我们的不是\"放弃努力\"，而是\"努力而不拧巴\"。当你能在溪谷里顺着水流而下，哪怕有坎坷，也是一路自在。下一集我们讲第十章，如何有效改善性格。谢谢大家。"}, {"title": "第十章 如何有效改善性格", "text": "各位听众朋友，大家好，我是这本书的导读讲师。今天我们进入维尼老师《内心的重建》的第十章——如何有效改善性格。\n\n每个人年轻时都希望自己变得更好：不急躁、更自信、说话有底气。但常苦于找不到改善方法。维尼老师说，运用认知疗法，转换习惯性思维，就能改善情绪、行为和性格，逐渐地，你会拥有一个全新的自己。\n\n这一章非常实用，它把前面讲的\"三种思维\"\"理直气壮\"\"顺其自然\"直接落到了性格改造上。我们一层层讲。\n\n一、改善性格，从转换认知开始\n\n很多人渴望改善性格，却又疑惑：不是说\"本性难移\"吗？性格能改变吗？怎么改变？\n\n首先，人生经历会自然推动性格改变。维尼老师现在四十多岁了，遇到小学初中高中同学，发现很多同学性格和以前大不相同。经历会影响性格，日积月累，性格就变了。不过\"本性难移\"也有道理，不掌握方法，性格改变确实难——就像门锁上了，没钥匙硬推难以打开，有钥匙就简单多了。改变性格的方法，就是认知疗法。\n\n所谓性格，从某种角度看，是情绪、行为（包括语言）表现出的稳定特点。回顾认知疗法：直接决定情绪行为的不是事情本身，而是对事情的认知。情绪行为背后通常有习惯性思维，会在某些情况习惯性地出现；习惯性思维背后又有一些共同核心思维，所以表现出一致性。因此情绪行为会表现出稳定特点，也就是性格。所以，如果建立新的习惯性思维，情绪行为会表现出新的稳定特点，新性格就形成了。\n\n比如，一个人为什么说话做事没底气？往往是习惯性思维作怪：想太多、顾虑太多、太在意别人看法。那怎么有底气？维尼老师有个秘诀：学会\"理直气壮\"，说服自己让\"理\"很\"直\"，\"气\"自然就\"壮\"，就不那么多顾虑在意，逐渐形成有底气的性格。\n\n改变性格最好顺势而为，顺应自己特点本色，在保留原有风格前提下适度改变。比如太严肃的人没必要非变得幽默，但学会些幽默不错也不难；喜欢独处的人没必要变得长袖善舞，但人际交往轻松自如还是不错的。\n\n性格改善的目标是什么？不是为了别人，而是为了自己。适合自己、觉得舒服自在、对生活工作不构成障碍、不过多影响他人，就可以。当然能更好适应社会工作亲友更理想。\n\n一位初三女生咨询，刚转学，觉得同学很多方面与她格格不入，玩不到一块、谈不投机，独处时间多。维尼老师问：你觉得这样舒服吗？她说舒服。既然如此，不妨先按自己喜欢方式生活。当然她交往确有困扰，毕竟谁都希望有朋友玩，所以接纳自己后她也期望改变。维尼老师给两点建议：一是看到不同、理解别人，别人行为做法也许与我们不同但也许有道理可理解，理解别人是人际交往关键；二是学会随和好商量，很多事其实小事、没什么大不了、不必太较真，放下执着随和好商量自然易相处。认知改变了，她和同学关系慢慢有了进步。\n\n二、怎样才能不再那么脆弱敏感\n\n为什么有人敏感脆弱？是神经类型不同、天生的吗？维尼老师认为不是，脆弱敏感常因太执着、把事看太严重。同样的事，如果放大负面影响，自然易引起内心波澜，体现为敏感；如果转变认知，如\"坏事可以变好事\"或\"很正常没什么\"，自然淡定。如果对事太执着、一定要如何，就难接纳不顺利或挫折，像一根坚硬枯树枝，缺乏弹性自然脆弱易折；而能顺其自然，就容易承受挫折，有了弹性自然不易折断。这也是\"柔弱胜刚强\"的道理。\n\n所以，敏感脆弱还是淡定坚强，关键在于思维模式。学会三种思维，是告别敏感脆弱、变得淡定坚强的秘诀。\n\n一位妈妈说，儿子上幼儿园大班，活泼聪明，但有时追求完美较真，比如手工做不好或玩具拼不好就气得哭；玩纸牌喜欢赢不喜欢输，输几次就不高兴有时还哭；也受不了批评，老师稍说他几句就哭。她担心孩子这么敏感脆弱将来怎么办。后来她常对孩子渗透三种思维。一起堆积木，她故意弄倒，说\"倒就倒了吧没关系再来\"，慢慢孩子也学会，堆不好时也这么说，自然淡定。玩牌时她连续输几次，儿子说\"妈妈你又输了\"，她说\"输了就输了没什么大不了，下次我会赢\"，儿子也笑了，这话听多了，再输也会这么说，慢慢能平静对待。经常渗透这些观念，孩子再遇类似事不大急躁，比如东西找不到他会说\"过两天它自己就跑出来了\"，不像过去找不到就哭闹着让她必须找到。她也用维尼老师方法帮孩子承受批评，在家玩批评游戏，互相批评，被批评方说\"批评就批评吧不丢人我改正就可以\"，慢慢孩子学会，再批评时没那么在意。渗透三种思维方法效果真不错，没多久孩子就不那么敏感脆弱了。\n\n三、改变急脾气，没有那么难\n\n有一次维尼老师办护照签证，缴费时系统出问题排了长队。后面一位六七十岁阿姨很着急抱怨。维尼老师爱管闲事劝了几句，阿姨说其实没啥事办，自己从年轻就是急脾气一直改不了。很多人说自己急性子，意思性格如此不能改变，其实不是。同一件事为什么别人不急自己很急？背后原因是认知不同。\n\n如果你觉得事很严重，自然很着急；如果觉得没什么、很正常，就不会着急。比如看到孩子摔跤擦破皮出血，觉得小宝贝磕倒了可怎么得了，自然心急火燎；如果认为这很正常没什么了不起，自然淡定应对。有时遇不顺利不如意也容易着急。这位阿姨没事，维尼老师还有事要办，为什么不急？因为三种思维帮助。排队顺便聊聊天或琢磨事也不错；这是突发情况才排队可理解所以很正常；排就排吧无法改变的事着急有什么用。\n\n维尼老师女儿小时候也爱着急，一点不如意就急得哭。他结合具体事常渗透：不着急慢慢来。逐渐成她口头禅，遇事顺口就说出，慢慢就不急了。他还常向她渗透三种思维。记得一次女儿和同学玩多米诺骨牌，没找到某骨牌，她说\"找不到就找不到吧（顺其自然）\"；摆的骨牌不小心被碰局部全倒，她说\"没关系没关系，说明我另外这部分摆得挺好（很正常没什么；坏事变好事）\"。这样自然不大着急。想改变急脾气，从改变认知做起，认知合理了自然淡定从容。\n\n四、人际交往中如何做到自然\n\n一位高中生留言：\"维尼老师您好，我性格内向不善言谈交际，人际交往上很自卑，与人沟通会紧张不自然，尤其不懂与异性沟通，在一些场合紧张，总觉得别人在看自己，很苦恼希望指导。\"一位妈妈说：\"我不善交际，和不熟悉的人交流不自信，同样发表看法别人妙语连珠，我总觉得表达不出来或干巴巴，怎么改进？\"相信很多人有类似苦恼。维尼老师很理解，因为年轻时他也为此困惑。那时不善言辞不知怎么和别人说话，有时自己都觉得别扭不自然；与女孩在一起常局促不安窘迫；当众发言也紧张，记得二十四五岁一次宴席上站起来讲话，旁边一位说：你怎么那么紧张啊？\n\n俱往矣，现在这些烦恼烟消云散。上千人讲座他能收放自如；与人交谈自然而然、说话轻松流畅；电视直播也能镇定自若。为什么有这么大进步？秘诀就在于合理的认知。\n\n第一，如何让自己放松下来。紧张有时不是凭意志能克服的，越想不紧张可能越紧张。为什么紧张？背后习惯性思维是什么？一位读者说：\"我很内向，跟人交往压力好大，总希望能给别人留好印象。\"其实想给人留好印象、怕表现不好，正是导致压力大紧张的重要原因。而且总想着留好印象，可能做作、用不熟悉方式说话相处，也导致紧张。执着勉强自己，易带来紧张。\n\n维尼老师二十多岁时也曾有类似困扰，思索很久。有一次看王志文主持节目，他放松自然像平常一样，但给人的感觉很好，维尼老师若有所悟。再观察影视剧，发现一些明星放松自然时显得很有魅力。他明白：自然放松所呈现的状态就是不错的。\n\n一般来说，我们平常和好朋友在一起，因无须考虑留什么印象、不必表现自己，做熟悉的自己就可以，此时就是自然放松的。所以感到紧张时不妨告诉自己：像平常和朋友在一起那样就可以了。这样会放松，状态反而好些。放松还帮我们收放自如。有一次维尼老师看访谈，一位嘉宾说喜剧秘诀就是放松。后来他体会确实如此，如果不去想那么多、放松下来、没了各种羁绊，即使他做各种夸张搞笑动作也会自然，何况人际交往。\n\n第二，自然而然地说话。维尼老师二十多岁时一次午饭和同事聊天，明明没啥话可说还努力找各种话题，勉强找的话题自然不合适，同事没兴趣回应，他也不自在。之后上班途中见一同事没话说还找话题交谈，因生硬感觉尴尬。晚上他反省，突然领悟：聊天嘛，自然而然就行，没必要非表现得谈笑风生。该说就说、不该说就不说；有话说就说、没话可选沉默，沉默也不错；有精彩话就说、没有就顺其自然不必勉强。认知改变，说话自然了、舒服自在；心态放松了，妙语连珠时候也多了。一位妈妈说，她本不善言谈交际却总想给别人留好印象，所以常刻意迎合，有时又担心留不好印象而逃避拒绝交往，常感觉压力大真心累。咨询后意识到习惯性思维需改进，转换认知后豁然开朗。她们小组三人以前总一起吃午饭，最近一外向健谈同事加入，气场像被她控制。从前她会不习惯甚至厌恶：我不善言谈如何跟上节奏、会不会被冷落？现在想起维尼老师的话：非刻意、自然而然、跟平常一样的状态才是最好的。不用迎合谁，顺其自然表达，想说时说、不想说就微笑倾听，这样就行。神奇的是内心压力一下消失，从未有过的轻松愉快。放松了，有些话不用刻意想就自然说出，同事都说她比以前风趣健谈了。\n\n第三，不善言辞怎么办。每个人特点不同，如果不擅长说话交往，第一步先接纳自己，承认自己不擅长交际、做不到谈笑风生、不是社交主角。但社交总需要配角听众吧！那就先做个好配角好听众，微笑倾听也受欢迎。每个人风格不同，维尼老师不大幽默但话语真诚，也是一种风格。当幽默朋友让大家开怀大笑，他也乐在其中。一位叫甜心儿的读者说，她赞同维尼老师观点，自己就是不善言辞的人，但不去考虑别人认可也不刻意表现自己，所以放松自然，无论什么场合感兴趣想说时就说，否则保持沉默安静听别人说，也受朋友欢迎她们都喜欢和她聊天。\n\n维尼小语：和人聊天，最重要的是寻找双方都感兴趣的话题。你提一个话题，如果对方感兴趣，你会受鼓励冒出不少有趣的话，对方可能愿打开话匣子，你做个好听众即可。\n\n第四，当众讲话。很多人当众讲话会紧张，几个同事正式场合一讲话额头满是汗珠。为什么紧张？原因多，其一放大事情影响，觉得场合好像很重要（放大的思维模式）、一定要表现好（执着），自然易紧张。其实往往没那么重大意义、没什么了不起，像平常一样就行。维尼老师一次去山西晋中做家庭教育讲座，组织方很重视活动隆重盛大基本是他独角戏，他告诉自己其实没什么、就像平常一样说话、按最熟悉方式讲即可，于是淡定从容一点不紧张。一位班主任开家长会有些紧张甚至不大敢开会，维尼老师建议她像平常和学生一样说话就会放松，再准备好讲话提纲心里更有底，按建议做后她放松自如，与家长沟通不错。如果不熟悉情况也容易紧张，有一次维尼老师在新平台讲微课，因对操作不熟悉需注意好多事项，有些手忙脚乱感觉紧张，所以提前演练心中有数就好得多。\n\n第五，别人的注视。你有没有在公共场合不自在的经历？比如总觉得别人在看自己、担心别人笑话。这往往是自己臆想，其实一般没多少人一直关注你，可能只看几眼不太在意。即使有人关注，也只需像平常一样，没什么了不起。如果真有人笑话，不妨\"理直气壮\"应对：管他呢，笑话又怎么样？这样容易淡定自在。\n\n第六，与领导、异性、陌生人如何相处。一位女生说：\"我害怕交往，每当男生从我面前走过我都面无表情装作没看见，并非讨厌对方，而是不知如何面对不知如何说和做。\"其实和异性交往没啥特别，就像和熟悉朋友那样相处自然而然。维尼老师有一同学擅长人际交往，和领导关系都不错，他请教，同学说：\"领导其实不难相处，只需把他当朋友，不需毕恭毕敬战战兢兢，在适当尊敬前提下像朋友一样相处就好。\"维尼老师学着做效果不错。一位老师对见领导发怵连找领导签字都不大敢，维尼老师建议改变认知：只需把领导当朋友，别总想着怎么尊重，领导也不见得喜欢你太恭敬，就像平常那样即可，她感觉好多了找领导办事就自然了。其实和任何人相处都如此，即使是第一次相见的陌生人，也可拿出和朋友相处态度、放松自如自然而然，不难拉近距离。一位女士因交往障碍咨询，说：\"维尼老师理念很实用，现在我想明白了，不管什么样的人，在尊重前提下我只需把他当朋友，平常和好朋友怎么交往就和他怎么交往，这样就可以了，从此轻松多了，慢慢发现交往不是什么难事。\"\n\n五、建立做事果断的思维模式\n\n你曾因犹豫不决而烦恼过吗？维尼老师年轻时常常犹豫，一件不大的事翻来覆去难做决定。改变认知后才逐渐解决。\n\n第一，犹豫和果断各有优劣。犹豫不决性格看似不好，但也有积极因素：毕竟试图做更完美决定或避免错误决定。犹豫的人常有追求完美倾向，总想做最佳决定或担心决定有问题，所以反复考虑表现为选择困难，但有助于做更好决定。不过如果害怕做决定或连小事也反复考虑，就成障碍需改变。果断为很多人推崇，但也有负面影响，如果考虑不周不了解情况就马上决定，就成鲁莽。一位朋友以前投资很果断很快决定，顺风顺水时都成功，后来经济形势不好他没深入调查就决定建工厂，结果效益很差以前利润全亏掉。可见重要事还需谨慎，小心驶得万年船。所以需中庸之道：重要事时间充裕可慢慢考虑深思熟虑最好；不重要事可果断些。\n\n第二，果断在深思熟虑之后。毛主席说过：没有调查研究就没有发言权。重要事需深入调查研究深思熟虑，时间充足不急于决定。2011年维尼老师考虑从部队转业，提前半年了解情况深思熟虑，到转业时间节点领导征求意见，一分钟内就做了决定。如果对领域不熟悉情况不了解，贸然做决定出错可能性较大，所以重要事需多花时间调研。随经验增长情况熟悉，就可果断些。\n\n第三，有助于果断的思维模式。（1）两个选择差不多，任选其一即可。为什么选择困难？往往因面临两个选择其实差不多，差别大就不会犹豫。所以事不大重要就不需要反复考虑寻求最佳，按直觉选一个即可。举棋不定时维尼老师常用此思维效果好。（2）抓住主要矛盾，细节可忽略。如果事无巨细一一考虑每方面都纠结过多，易犹豫不决。不大重要事考虑主要矛盾即可，细节忽略。（3）做能做的事，其他的顺其自然。不敢做决定有时因害怕决定错误或结果不理想。其实即使考虑再周全调研再到位，也不能保证结果理想，所谓人算不如天算。不妨告诉自己：我已充分考虑，就这样决定吧，结果如何听天由命。（4）最坏的情况是什么。当害怕决定失误，可考虑最坏情况是什么、是否承受。如果没什么大不了就不妨果断些。（5）车到山前必有路。虽重要事需深思熟虑，但总有想不到的事、难判断的情况，想太多也没用。主要问题考虑清楚就可做决定，所谓车到山前必有路，出问题兵来将挡水来土屯，到时候灵活应对即可。\n\n六、如何做到说话办事有底气\n\n维尼老师年轻时说话做事底气不足，比较在意别人看法，甚至穿了件新衣服都会在意别人眼光，感觉不太好，就开始琢磨怎么有底气。\"理直气壮\"这个成语给了他启发，理\"直\"了气就壮。如果觉得自己所说所做理由不充分，自然没底气；如果学会说服自己改变认知，认为自己有权利有充分理由这样说这样做，理\"直\"了气自然\"壮\"就有底气了。认知变性格变。\n\n有一天阳光明媚，维尼老师在青岛大学赏花，路两边樱花盛开，他独自坐路边石阶看花瓣随风飘落。正值下课学生川流不息，有人会看看他这个略显特别的人。他心里平和自在：学生们走自己的路，我赏自己的花，谁也管不着谁……有此认知自然不在意别人眼光，继续安然享受美景。他比较怕冷天冷会穿得多一般戴帽子，有时别人偶尔调侃，他心里想：\"冷暖自知，我就是这样的体质，穿少了受风寒容易头痛，别人爱怎么看就怎么看，管他呢！\"一笑而过不去解释。他参加过一次大型讲座，前面嘉宾演讲慷慨激昂很有气势，而他讲话没那样气势会不会心虚？不会！他想，言语虽朴实平常但风格自然真诚也别具特色，而且内容有价值，所以按自己喜欢方式讲就好，于是娓娓道来观众听得聚精会神。在单位他曾给高级领导汇报工作没怯场，因为告诉自己：\"怕什么呢？没什么了不起的，在这方面我最了解情况，像平常一样说就好。\"所以淡定从容表现不错。很多妈妈对和老师沟通有些胆怯，维尼老师曾因老师体罚女儿去和老师直接沟通，他想：\"老师做法有问题自然需沟通，老师其实也怕家长投诉，只要我沟通方式方法得当就不会有负面效果。\"最后果然沟通效果不错。\n\n他看到一位妈妈的微博：\"上班公交车上我刚起身把一个座位让给阿姨，身边一个大姐就抢先坐下，我质疑看着她她却满脸不爽。请起来没说的。我这人没什么优点就是喜欢给老人和抱小孩的让个座。怎么了！我错了么？\"这位妈妈这么有底气，就是因为她的理很直！\n\n那么如何成为说话办事有底气的人？每当我们感觉底气不足，就说服自己让\"理\"直起来，慢慢形成有底气的习惯性思维，也就形成有底气的性格。这方法也适合孩子，孩子学会理直气壮就不会懦弱。\n\n维尼老师女儿小时候有两个好朋友A和B，A和B之间有过小矛盾，A对女儿说：\"你不要和B玩，否则我就不和你玩。\"女儿很为难都喜欢。维尼老师说：\"你自己想和谁玩就和谁玩，别人管不着。如果A因此不跟你玩也没关系，你还有其他好朋友，何况过几天A就忘了又找你玩了。怕什么呢？你有权利这样做。\"女儿觉得有道理就理直气壮和B继续玩。维尼老师常向她渗透这种思维，她逐渐成为内心有底气有主见的孩子，给人的感觉还随和可爱。\n\n书里一位女士分享：\"我敢于坚持和表达自己了。\"以前她是大家公认的听话懂事女孩，性格温和，在家听父母话在单位听领导安排从不反抗从不争辩，其实很多不情愿但为得认可一直压抑不敢表现。后来在维尼老师这咨询主要解决缺乏自信，维尼老师说：\"要想增强自信需先从有底气理直气壮做起，不管面对父母还是单位领导，我们都可以理直气壮表达想法。\"这方法新鲜她从没想到，给了很大启发。她是酒店会计，国庆后上班第一天看了一天国庆七天账下班特累，在厨房和妈妈闲聊讲白天做账事，爸爸突然冲过来严厉讲：\"你把这么多天账全放今天做是错的，国庆放假你就该去加班，太不会安排工作！\"以前她一声不吭，这次不一样了，理直气壮和爸爸说：\"我肯定不会国庆节过去加班，今天赶一赶也能做完不耽误任何事。\"爸爸愣住后又狠狠批评，她还是理直气壮说：\"我现在需要的是爸爸的安慰。\"接着大声说出心中想说的话：\"我希望爸爸说，女儿辛苦啦，回家就好好放松一下。\"说完感觉特别好怨气一下没了觉得自己有力量！不压抑自己理直气壮真好！还有一次领导安排她和同事共同完成繁重任务，只让协商分配能完成就行，以前和这同事合作多次出问题她自然不情愿，以前可能不得不服从，但现在敢表达想法，和领导说必须由领导明确哪部分她做哪部分同事做，领导开始不肯说明她就一直讲：如果领导不明确就扯不清楚，同事以前也多次让她帮忙最后两人都留下来加班……\n\n十、给听众的实践启发\n\n这一章是全书的\"实操手册\"。请记住：\n\n第一，性格不是不能改，关键是改认知、建新的习惯性思维。像换锁一样，找到\"认知\"这把钥匙，门就开了。\n\n第二，脆弱敏感、急脾气、社交紧张，背后都是\"把事看太重、太执着、太勉强\"。用三种思维一转，就淡定从容了。\n\n第三，人际交往的秘诀是\"自然\"——像和好朋友在一起那样，不刻意、不迎合、不勉强，做个好听众也很受欢迎。\n\n第四，当众讲话、见领导、和异性陌生人相处，核心认知都是\"把他当朋友，像平常一样\"，没什么了不起。\n\n第五，犹豫不决时，用\"两个选择差不多任选其一\"\"抓主要矛盾\"\"做能做的其他的顺其自然\"\"最坏情况是什么\"\"车到山前必有路\"这些思维让自己果断。\n\n第六，说话办事有底气，靠的是\"理直气壮\"——让自己的理直起来，气就壮了。这方法大人孩子都适用。\n\n这一章，维尼老师用自己从\"内向紧张\"到\"收放自如\"的真实蜕变告诉我们：性格不是宿命，认知一变，性格就变，你完全可以拥有一个全新的自己。下一集我们讲第十一章，建立良好的人际关系。谢谢大家。"}, {"title": "第十一章 建立良好的人际关系", "text": "各位听众朋友，大家好，我是这本书的导读讲师。今天我们来到维尼老师《内心的重建》的第十一章——建立良好的人际关系。\n\n学会处理人际关系，是心理成长的重要内容。良好的关系是幸福源泉，糟糕的关系带来无尽痛苦。维尼老师说，建立良好的人际关系，从改变认知做起。\n\n这一章，是\"三种思维\"\"理解别人\"\"顺其自然\"在关系场里的综合运用。我们一层层讲。\n\n一、人际交往的关键是理解别人\n\n如果我们学会理解别人，从别人立场考虑问题，认知改变了，心态就会平和，沟通就顺畅，自然容易赢得对方合作。\n\n在家庭教育中，亲子关系非常重要。有了好亲子关系，孩子才能合作，教育才有效；没好亲子关系，孩子很逆反，一切方法可能无效。同样，夫妻、亲友、同事，先处理好关系也非常重要。从某种程度讲，关系好了做什么都是对的；关系不好怎么做都是错的。这也符合心理学规律：关系好了，对方对你好印象，会不自觉发现你做法中合理方面；关系不好，对你有成见，可能习惯关注不合理之处。这叫晕轮效应，又称\"光环效应\"，指当认知者对一个人某种特征形成好或坏印象后，会倾向据此推论该人其他方面特征。\n\n有一家公司中层领导咨询，一段时间她和另一位女领导发生矛盾，总觉得那位在挑她刺。其实转换角度看，人家未必是为难她也可理解。维尼老师建议她不要太较真，抛开谁对谁错先处理好关系。如果关系不好很多事难处理，即使你对别人眼里也是错。她听取建议，学会理解别人从而善意相处，后来那位领导和她成了朋友对她关照颇多。这家公司不同领导间斗争多矛盾尖锐，但她善解人意关系处理不错，各方面
