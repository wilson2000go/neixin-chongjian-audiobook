领导都喜欢她，虽处纷争却能游刃有余心情舒畅。\n\n处理好人际关系有两个关键因素：一是学会理解别人；二是对不太重要的事不要太较真，随和好商量。在家庭教育中，如果父母能学会理解孩子、好商量、不那么较真，身教之下孩子自然也会对他人如此，与人相处问题不大。\n\n二、这不是一个非黑即白的世界\n\n大学时维尼老师喜欢和别人争论，常争到面红耳赤，那时挖空心思想证明自己对人家错。现在想起往事他会微微一笑——俱往矣，很多事不是非对即错的。\n\n有一次新闻说上海一些夫妻为规避限房政策假离婚，微信群议论纷纷。有人觉得人家利用规则做事无可厚非，敢假离婚说明婚姻信任程度高；有的觉得这是对婚姻亵渎表示自己不会这样做。孰是孰非？答案并不唯一，双方都有道理。维尼老师理解假离婚夫妻行为，不必做道德审判，也赞赏那些面对诱惑拒绝假离婚的人。微信群也常谈政治，有的左有的右，都以为自己掌握真理常争论不可开交甚至人身攻击。在维尼老师看来谁也不是傻子，观点都有道理也都有偏颇，难简单说谁是谁非。\n\n以前教育总告诉我们要爱憎分明是非分明，所以很多人谈论事总分出什么正确什么错误。其实这个世界不是非黑即白是非分明的，而是黑白是非共存，没有绝对正确或绝对错误的事。某些情况下合理观点在另一情况下可能就不合理。一般来说，每个人观点看法都有其合理之处，当然也有不合理之处。比如家庭教育，有的说该严格有的说该宽松，看似矛盾其实都有合理之处，需具体情况具体分析，有情况该严格有情况该宽松，对有的孩子该严格有的该宽松，有时需先宽松逐渐严格，有时还需把握好度，过严过松可能都不好。理解别人看到对方合理之处、不执着自己正确，这种思维对处理人际关系很重要。孩子提貌似不合理要求，我们先尝试理解其合理之处再去沟通效果可能更好，毕竟很少有什么要求完全不合理。在家里你想这么做爱人想那样做，不同做法不是非对即错的，可协商折中或顺应对方意见。与同事相处有时也需学会妥协，考虑对方利益和看法，有助于更好合作。\n\n三、有些不过是人之常情\n\n维尼老师读史记对一个故事印象深刻：王翦自污以取信于秦始皇。秦楚之战王翦率六十万大军出发，临行前请求秦始皇赐予许多良田美宅园林池苑等。秦始皇说：\"将军尽管上路，何必担忧家里日子不好过？\"王翦说：\"替大王带兵，即使有功劳也终难得到封侯赐爵，所以趁大王器重我时也得及时请求赐予园林池苑给子孙置份家产。\"秦始皇哈哈大笑。王翦出发到函谷关又连续五次派使者回朝廷请求赐予良田。有人对王翦说：\"将军请求赐予家业如此心急也太过分了吧。\"王翦道：\"不是这样。秦王性情粗暴对人多疑。现在他把全国兵力交我统领，我不多多请求赏赐田宅财物给子孙置份家产以表示出征坚定意志，那秦王还不怀疑我拥兵谋反吗？\"为什么王翦自污？因为他理解秦王，知道这种情况下秦王怀疑他是否忠诚是人之常情，他没要求秦王信任，而是顺应秦王心理用自污办法赢得信任。如果我们考虑到人之常情，就容易理解别人了。\n\n维尼老师去市场买荠菜和摊主说好等她拾掇好几斤再来买，考虑到相互不熟悉她可能担心他不回来，这是人之常情，所以他走时主动留下些押金，摊主就放心了。2013年他为盲童小海妍手术在网络发起捐款，因读者信任还没人质疑真实性，但如果有怀疑也属于人之常情，所以他主动提供几篇青岛媒体报道和小海妍一家影像，大家就更安心奉献爱心了。同事之间有的面临直接竞争，所以互相有些芥蒂防备或不支持，只要不是有意诋毁搞鬼也是人之常情可理解。很生气时说话可能难听，这是情绪驱动作用，如果只偶尔如此也属于人之常情。找朋友办车险，因她是新手不熟悉业务办得不太顺利有些折腾，但新手出现这种情况也很正常可理解。与人合作因沟通问题或其他无法预料情况，别人没按说好的做，有时不过是人之常情可理解，有了理解别人更愿意合作。孩子玩手机有时超时，如果觉得孩子说话不算数就会很生气，但转念一想，父母玩手机就能遵守时间吗？到时间微信没聊完视频没看完能停下来吗？所以此时说话不算数不过是人之常情，理解了我们平静下来也有助于理性处理问题。孩子在自己房间写作业听到父母说事好奇跑出来想问清楚，不必责怪他写作业不专心，这不过是人之常情，孩子是人不是神克制不了好奇心很正常，下次父母聊天别让孩子听到就可以。理解别人知道哪些是人之常情，有助于更好与人相处。\n\n四、理解别人，说到底是为了自己\n\n有人说：去理解别人，这累不累？是不是过得太小心了？一位妈妈觉得孩子从小体弱多病，所以孩子上小学后她希望婆婆继续照顾孩子，但婆婆觉得事不多决定去上班。现在孩子放学回家有些饿会胡乱吃冷饭冷菜，妈妈觉得对孩子身体不好，总想让婆婆在家，但婆婆不同意爸爸也不认真劝说，妈妈就很郁闷甚至抑郁了。维尼老师建议她理解婆婆，她有些不情愿，维尼老师说：\"理解和宽容别人其实是为了自己。不愿意理解婆婆，对你的心理有这么大影响对孩子也不好。\"她觉得有道理尝试理解婆婆，慢慢心情好多了。一位女士的女领导可能处于更年期经常挑毛病找茬，她咨询：\"我对她特别反感看到就烦但又无法调离这让我很难受怎么才能放下这种反感？\"维尼老师说：\"换一个角度来理解，她也不是坏人，只是处于'愚昧'之中，自己招人讨厌却不自知，也可笑可怜吧。\"过了几天她留言：\"您说得对，她确实不知道自己言行那么不可理喻，大家都不喜欢她说起来也挺可怜的，我没必要和她较真。换个角度一想好像她也不那么烦人了。不然如果总是讨厌她我也不舒服。\"理解别人不是为了别人而是为了自己，认知改变了感受就好了，这样也能善意与他人相处理性处理事情。\n\n五、别太较真，保持适度自我怀疑\n\n坚持真理坚持正确东西有道理，但过于坚持或无论什么场合都坚持，就太较真了，容易发生矛盾冲突。为什么坚持正确还会有问题？当人自以为正确时其实可能有三种情况：第一，我们认为正确其实未必正确，人生无常有很多我们不了解想不到的，即使深思熟虑也可能考虑不周或判断错误，所以适当保持怀疑不要太自信。第二，我们观点正确别人的也可能正确，道并行而不悖，很多事不是只有一个解决方案，从不同角度看都有道理，所以当别人有不同意见时首先要学会理解其合理方面才能更好沟通相处。第三，我们正确别人观点确实有问题或错误，有时不妨给别人一些面子，如果事不太重要不坚持又有何妨？话说回来有时不给对方面子因此破坏关系，这种做法可能本身就是不正确的。\n\n维尼老师还是毛头小伙时是很较真的人，有时不顾别人感受一味坚持己见所以有时争吵。他一位朋友非常善于处理人际关系，有一次他和他人争吵后向朋友诉苦：\"那人明明错了为什么还胡搅蛮缠？\"朋友简单说了一句：\"要给人面子，即使你是对的也要给人面子。\"维尼老师以前只知道坚持真理从未想到还要给人面子，这话让他若有所悟。是啊即使自己是对的又不是什么大事何必要不给别人面子呢？认知改变了行为就改变了。如果事比较重要他还会有所坚持但会注意表达方式；如果事不重要就不那么较真了，谁对谁错有什么关系呢？\n\n一位妈妈说，看了维尼老师观点认识到自己想法未必唯一正确，慢慢就不那么较真了。十一期间从老家带些黄瓜放冰箱太靠冰箱壁有一个被冻了，老公看到说\"这个坏了\"，她说\"这不是坏是被冻了\"，老公说\"我就觉得这是坏了这样的黄瓜我肯定不吃\"，就要把黄瓜扔垃圾桶。她说：\"你就不能把黄瓜切开让我看看里面如果真坏了再扔我也就安心了要不这样太浪费了。\"老公切开说\"虽然里面没坏但这样的黄瓜我不吃\"，这时儿子跑过来问\"妈妈出什么事了怎么了\"，她说\"没事什么事都没有每个人对食物坏的定义不一样\"，然后就和孩子玩去了。他们以前常因类似事闹矛盾有时好几天不说话都是太较真，现在想想真没必要！\n\n六、掌握沟通的秘诀\n\n一位读者说：\"每次和一位朋友讨论问题他总是先指出我观点错误之处，这让我不舒服常争吵起来，后来我再也不去和他交流了。\"如果人总盯着别人观点不合理之处沟通自然难顺畅。有的父母遇到什么事总是抓住\"时机\"教导孩子一番指出孩子错误，孩子自然感觉堵得慌慢慢不愿和父母沟通了。良好沟通秘诀其实很简单：每个人的观点都有合理之处，所以先理解和肯定别人再提出自己的意见更容易让人接受。\n\n一位女士咨询，她和老公到了打算离婚地步。她说话直来直去，老公说她\"你不把人说痛了是不会说话的\"。维尼老师建议她考虑老公感受，先理解肯定再提建议。她问这样是不是太累，总觉得一家人不需要这样。《道德经》说：反者，道之动。说话想轻松痛快些结果把关系搞僵了很累；而考虑对方感受看似累但如果形成习惯就会轻松而且感觉美好愉悦。这种沟通方式对青春期孩子尤其适用。比如孩子回家埋怨老师，有的父母马上驳斥\"老师都是为了你好你该反省自己问题\"，长此以往孩子就不愿再说学校事。而如果我们采用合理沟通方式效果就好得多：首先理解孩子，孩子既然抱怨肯定有理由和委屈，我们先理解去共情，孩子觉得我们是自己人，我们再劝孩子理解老师孩子可能听得进去，最后再给出现实可行建议比如以后遇此类事如何应对。采用这种方式相信孩子更喜欢与我们沟通。\n\n七、先理顺关系，再寻求改变\n\n家庭关系也是一样，如果有良好家庭关系很多事好沟通好办；如果关系不好互相有成见怎么做都是有问题的，家庭就成了痛苦泥潭。处理好家庭关系首先要学会理解家人从而宽容和接纳，之后可用三种思维看淡事情影响调节心态，有时不必急着改变家人不妨先改变自己。\n\n比如夫妻朝夕相处有很多事处理不好可能引起矛盾冲突关系紧张很多事就难应对了。此时先要理顺关系对于具体事不要那么较真等关系好了再寻求改变。一位女士咨询，他们夫妻隔几天就吵一次，老公会因一点小事对她大发脾气持续好几年。她难以理解困惑很久。维尼老师了解到她老公和朋友同事相处脾气都挺好忍耐性也不错，那为什么对她脾气那么差？其实也不难理解，夫妻关系不好互相有成见看不惯对方一点小事就联想很多往事从而引起强烈反应。所以先处理关系再处理事情，对于事情先放下不那么较真多顺应对方，关系缓和之后就不那么容易发生矛盾冲突了。\n\n另一位女士说，老公说她动不动就发脾气，其实是因为以前发生的一些事让她对他一直很反感，所以遇到一丁点小事就忍不住大发脾气反应强烈。现在她用维尼老师理念慢慢改变自己已经开始受益。原来对老公一些做法看不惯时会很生气常殃及孩子，现在遇到事她学着去理解他慢慢用三种思维分析，发现很多事其实没什么大不了心态好了就能接纳他。比如昨天上午家中太阳能真空管又要重修，年年冬天过后都要重修，以前都是老公联系，这次是她主动联系跟着师傅上去看具体情况。修完后她生气地质问老公：\"你以前为什么不问问人家如何避免年年修并且确保冬天能用啊，你看你浪费了多少资源……\"唠叨几遍老公不耐烦开始生气，她立即意识到不能再说啦。下午回单位一想，老公又不是很懂太阳能想不到寻求彻底维修方法也很正常，而且她以前不是也没想到吗？再说以前虽然不太完美但也没什么大不了的，不也这么过来了吗？为了这个吵一架值得吗？心静下来她随即给老公发信息告诉他上午那样埋怨他不对请别介意，她也有考虑不周做事欠妥时候，我们吸取教训改正不足事情就会越来越好。这样一说晚上老公回家主动做饭晚上邀她去散步。认知改变了情绪和行为都变了，要是以前她会认为自己做得对唠叨老公他生气她更生气然后谁也不理谁孩子看了也不舒服直接影响家庭氛围，现在调整认知产生完全不同效果。\n\n八、改变认知，理解对方\n\n学会理解对方是处理好人际关系关键，理解了矛盾就少了，不理解一点小事也可能引发冲突。理解的关键就是知道哪些是人之常情哪些是\"很正常没什么\"哪些自己也会那样做。\n\n一位妈妈说，老公有时对她有些着急会抱怨，偶尔几次他正忙着她去说一件事他会说\"你没长眼吗\"，不过只发生过几次。她以前总认为他不尊重她所以很生气，现在学习维尼老师理念开始学着去理解他：老公只是偶尔如此可能正常，也许因为他正好有些烦躁，她去说什么就像正巧撞在枪口上一说就让他更烦躁从而发火，这可能只是情绪宣泄而已，其实想想她自己有时也是这样的，这不说明他不尊重她贬低她。这样慢慢理解了他她就不大生气了事后和他说说他也觉得不好意思慢慢这种情况少一些了。\n\n有位妈妈告诉维尼老师老公不关心她不重视她，其实有些事可能很正常与关心重视无关。比如老公买衣服只给自己买没给她买，可能因老公没这个意识；另外他们夫妻关系不太好，这种情况下老公不大想着她关心她就是人之常情了，可以先试着理解对方争取改善关系，关系好了自然会有更多关心。\n\n一位妈妈说，她先生最大问题是在家里常常发火而且经常不考虑后果歇斯底里恶语相向骂人爆粗口砸东西说离婚。她这一点无法接受。维尼老师说，虽然老公这样不好但如果他很火了自然要发泄，有的人发泄比较理性有的人习惯于说绝决的话砸个东西才痛快才舒服，这也是不由自主的也是情绪的规律，他只是被情绪控制的动物并不见得有太多恶意。维尼老师建议她先找找老公发火的原因其中可能就包括她自己的问题。后来她发现可能因为有些不太尊重他在与她父亲关系问题上没支持和理解老公所以老公才经常发火。理解之后她也开始改变自己结果和老公相处越来越好，他发火也越来越少。\n\n一位妈妈咨询，她和老公本来感情很好但多年来经常争吵感情越来越淡，她对老公一肚子意见。比如晚上她想搂着老公但老公不让她碰她很伤心，其实这正常不少男人睡觉就是不喜欢接触因为会影响入睡。她老公其实没啥不良嗜好习惯主要是不大管孩子她耿耿于怀，没错爸爸也应参与家庭教育但不少爸爸觉得养孩子是妈妈的事或孩子不大用管这主要因观念不同也可理解慢慢争取改变即可。她老公外出不大喜欢她老打电话她外出几天老公也不大询问（老公没外遇情况）她觉得老公不关心她，其实对于男人来说这些也很正常。双方观念习惯喜好不同如果不能理解很多矛盾就会由此而生。\n\n九、学会三种思维，收获平常心\n\n如果把事看得过于严重放大其影响就容易太执着较真从而引发矛盾；而如果学会三种思维能淡定些释然些就好相处了。\n\n一位妈妈的故事：有了三种思维，坏事变好事。以往常与母亲争吵闹得极不愉快，后来她想每次争吵基本都因提起奶奶引起。年迈奶奶仍不减年轻强势母亲也属于强者，清官难断家务事看似鸡毛蒜皮家事最让人伤脑筋。因从小目睹母亲与奶奶关系她总想当劝和者调和者结果屡屡碰壁。现在她学会用维尼老师三种思维看待：那个年代婆媳关系可能就是这样也很正常；母亲心软孝顺只是有时委屈给我唠叨唠叨这也是好事可发泄她的不满；她们都老了无法改变就顺其自然吧她也不必刻意寻求改变。从此再没与母亲吵过。对于一些事现在即使一开始感觉看着不顺眼也会用三种思维重新分析很快就能释然，自己舒服母亲也舒服。\n\n她是个爱较真的人以前与老公常因一句话争得面红耳赤，现在想想有不同看法其实很正常有什么了不起的又不是什么大事老公愿怎么想就怎么想顺其自然就是了，争论自然少多了家里气氛越来越好。工作中她自我要求很高被公认做事干净利索，如果只有她一人干会经常加班加点绞尽脑汁干好，但有些工作需要别人合作就不一定那么完美。以前每当别人跟不上她节奏她就觉得很烦躁，现在想想每个人都不一样别人做得不完美其实也很正常没什么先顺其自然再找出更合理工作方案以备下次改进就好，这样她不再烦躁人际关系也有不少改善。\n\n十、没有什么是\"你应该\"\n\n与家人相处一个常见习惯性思维是：你应该如何如何……你不应该如何如何……自己觉得应该如此但别人并不觉得那么容易发生矛盾。其实我们认为应该的真的就是应该的吗？不一定，有时只是角度不同标准不同想法不同而已，有时也不是什么大事本身是无所谓的，何必一定要按我们想法或标准来呢？\n\n一位女士的妈妈怕受风寒常穿得很臃肿，她觉得应该穿少点所以见面总劝妈妈脱几件，但老人难以改变也有自己道理所以每次白费口舌还搞得不愉快，其实这没什么大不了为什么非要改变妈妈呢？一位老公总觉得爱人吃完饭就\"应该\"马上洗碗（老公买菜做饭）这样餐桌看起来清爽些，但爱人上班有些累不想马上洗，所以老公所说\"应该\"只是自己角度从爱人角度看并非\"应该\"，不妨变通一下先把餐具收拾下去餐桌也干净了等爱人想洗时再洗也可以。抽烟对身体肯定有不好影响所以有的妈妈觉得老公应该戒烟，但戒烟看似应该却很困难不是说戒就能戒的，与其为此争吵不休不如努力之后再顺其自然。维尼老师妈妈有些唠叨，以前他觉得不应该这样想去改变妈妈，但转念一想妈妈七十多岁了性格很难改变从这个角度看她其实\"应该\"唠叨，那么不如顺其自然享受和妈妈相处时光。一位男士责任心不错承担大部分家务夫妻相处不错，不过爱人不大喜欢收拾家做家务慢，他总觉得她不该如此总想改变她，但习惯很难改变所以他们不免有些争吵，维尼老师建议他既然难改变不妨先接纳（因为本来也没什么大不了）慢慢再说，他觉得有道理过了几天告诉他：\"我现在不总想着去改变她了，再看到她的那些习惯我觉得好像也没什么了。\"对于同事也是如此，看人不顺眼一个重要原因就是总想着他不应该这样期盼他能改变，而实际上别人通常难很快改变或无法改变，所以不妨放下执念接纳现状可能看着就不那么不顺眼了。当然如果事比较重要影响比较大可能还是需要努力寻求改变，即使事不太重要有时寻求改变也正常只是注意方式慢慢来。\n\n十一、先改变自己，进入良性循环\n\n夫妻关系出问题自然是双方都有原因，不过有时改变对方困难不如先改变自己这样可能带来对方改变，如果改善了关系就慢慢进入良性循环。\n\n一位女士说：夫妻关系出问题不妨先改变自己。一年前的现在是她人生最痛苦时候因为打算和老公离婚了，她不能忍受一个人生观价值观和她不一样的老公、一个不包容她脾气的老公、一个不会主动关心体贴她的老公，婚姻让她痛苦她找不到被爱的感觉。但离婚后她将何去何从？当时真感觉已被逼上绝路：不离婚痛苦离婚也痛苦。后来她回了娘家一个月重新思考以后生活，决定改变自己为了自己的幸福去……\n\n她开始改变自己，学着做既营养又美味的饭菜不再唠叨不再抱怨。老公从开始惊奇疑惑到用全新眼光看待她只用了几天。其实想让老公发现她的改变并不难，他已经习惯了原来的她，她一点点变化都会引起他注意，而且每个人都想幸福地生活老公也不例外所以对她改变也积极做出正面回应，这增加了她继续改变自己的信心，他们开始进入良性循环这一步她走对了！老公重新认识她对她提出要求不再抗拒对她偶尔唠叨也会包容；她也重新认识他肯定他工作辛苦谢谢他为她和女儿提供衣食无忧的生活，他不再说她\"活在梦里\"她也不再说他庸俗。虽然他们人生观价值观仍不同但现在会彼此接纳对方而不是只想着去改变对方想让对方变得和自己一样，换个角度想尽管价值观不同老公仍然选择为她付出这不是更让人感动的事吗？几个月后当她再次陷入痛苦不可自拔想找维尼老师做咨询老公开始有顾虑，但只问了一句\"靠谱吗\"，她说\"你就相信我吧\"老公马上同意了，她当时感动得哭了好久。原来的自己爱较真追求完美不仅苦了自己路越走越窄最后到无路可走地步，维尼老师告诉她放下执着心放下\"一定\"\"必须\"，她试着去做豁然发现这个世界并不是非黑即白的而是如此多元化如此生动，每个人都有自己人生观价值观站在不同角度看到不同世界。她和老公沟通也越来越顺畅，就像维尼老师说的本来就没有绝对对错之分即使自己是对的也没必要一味去证明也要顾及对方面子问题，即使自己是对的也要先肯定一下对方再说出自己的意见，这样的沟通方式其实谁都喜欢。回头看看走过的路她发现与其期望别人改变不如自己先改变，改变自己的做法改变自己的认知，认知变世界变。\n\n十二、给听众的实践启发\n\n这一章，是关系和谐的\"心法\"。请带走这些：\n\n第一，关系好了做什么都对，关系不好做什么都错。所以先处理关系再处理事情，这是最高优先级。\n\n第二，这个世界不是非黑即白，每个人的观点都有合理之处。理解别人、看到对方合理之处、不执着自己正确，是关系的关键。\n\n第三，很多让你生气的事，不过是\"人之常情\"——孩子好奇、老公偶尔烦躁、同事有竞争防备，都正常，理解它就平静了。\n\n第四，理解别人不是为了别人，是为了自己。你不理解，痛苦的是你；理解了，舒服的是你。\n\n第五，别太较真，保持适度自我怀疑。\"即使你是对的，也要给人面子\"，小事不坚持又有何妨。\n\n第六，沟通秘诀：先理解肯定别人，再提自己的意见。对青春期孩子尤其如此。\n\n第七，放下\"你应该\"的执念，老人唠叨、爱人慢、同事不顺眼，接纳现状往往最轻松。\n\n第八，与其期望别人改变，不如自己先改变。认知变，世界变，关系自然进入良性循环。\n\n这一章，维尼老师用大量真实关系故事告诉我们：所有的矛盾，根子都在\"认知\"上；一旦你愿意理解别人、放下执念，关系就会从泥潭变成源泉。下一集我们讲最后一章，第十二章，心理问题是可以理解的。谢谢大家。"}, {"title": "第十二章 心理问题是可以理解的", "text": "各位听众朋友，大家好，我是这本书的导读讲师。今天我们来到维尼老师《内心的重建》的最后一章——第十二章，心理问题是可以理解的。\n\n维尼老师有一个基本理念：心理问题，包括严重心理问题，都是正常心理规律的产物，可以理解。所以分析或解决任何心理问题，都可以从正常心理规律出发，分析其心理机制，搞清心理各因素如何相互作用，从而找出相应解决方案。\n\n这一章，是整本书的\"升华\"——它把前面所有方法，用在了最沉重的话题上：抑郁、强迫、恐惧、失眠、头痛，乃至被人轻易扣上的\"精神病\"帽子。我们一层层讲。\n\n一、抑郁症是怎么回事儿\n\n抑郁症的痛苦是没有经历过的人难以理解的。严重抑郁情绪之下，人的兴趣丧失，关注的都是负面灰暗的东西，就像陷入泥潭怎么也爬不出来。几位患抑郁症的来访者告诉维尼老师，在那种痛苦煎熬之下，自杀的想法显得那么轻松，好像是一种解脱。\n\n抑郁症为什么难以摆脱？维尼老师二十多岁时曾陷入中等程度抑郁状态持续一个月，所以有机会反复真切体验抑郁为什么那么顽固。这段经历给了他宝贵认识：抑郁症是情绪和认知相互作用形成的恶性循环，其中最重要的机理是情绪对认知的影响，这是以前心理学界所不重视的。\n\n回想抑郁那段时间，他明知道应该多想积极乐观的事促进情绪好转，但即使有意思考，对积极乐观方面的感觉还是迟钝麻木的，通俗讲就是没有感觉，所以难以继续下去，对改善情绪作用不大。而此时对负面悲观方面非常敏感，容易产生丰富放大的联想而且\"生动鲜活\"，这自然会让低落情绪继续或进一步低落。这就是抑郁状态下情绪对认知的影响。这一规律从一些抑郁症来访者那里也得到了验证。这个规律符合心理学\"情绪一致性效应\"：那些与一个人目前情绪相一致的内容更容易被发现注意和深加工、联系更细致。所以人在抑郁状态对消极负面方面很敏感，对积极乐观方面感觉迟钝。\n\n这一规律对理解抑郁症机理特别重要。抑郁情绪形成后难以摆脱，很重要的原因是：人之所以感到抑郁通常因负面事件打击，而抑郁情绪又让人痛苦，为摆脱它人会不由自主思考相关事情（情绪驱动作用）。由于情绪对认知影响，人会对消极方面很敏感、对积极面无感，所以注意力不由自主集中到负面悲观方面，让情绪进一步低落，形成恶性循环难以摆脱。循环路径为：负面事件——抑郁情绪——驱动思考——对积极面无感对负面敏感——进一步抑郁。\n\n了解机理后可以据此找治疗方法。\n\n第一步，先接纳现状。抑郁好转必然经过较长时期可能持续几个月甚至几年，如果不接纳急于摆脱可能产生更多情绪冲突反而延缓康复，所以首先要学会和它一起生活照常进行日常生活慢慢等待好转，这就是森田疗法说的\"为所当为，顺其自然\"。\n\n第二步，主动调节情绪。多采取转移注意力方法，比如运动、看电影、聊天交流、干家务、逛街等去主动调节情绪。比如与人交流因为需要集中注意力说话就可有效把注意力从抑郁事上转移，另外过程中情绪得到宣泄或直接提高兴奋度促进情绪好转。如果能找到知心愿意倾听的朋友还可倾诉痛苦，朋友的倾听和接纳对抑郁情绪有平复缓解作用。看书也是转移注意力方式也可从书中得到慰藉改变认知对情绪调节很有帮助。很多人抑郁后什么都不想做躺那思考，这对情绪缓解很不利。抑郁严重时陷入情绪漩涡不能自拔，可适当服用抗抑郁药物暂时改善情绪。情绪调节是走出恶性循环非常重要的一步。\n\n第三步，改变认知。抑郁症患者有一些性格特征，比如追求完美、对自己要求高、有太高目标而且很执着，另外还存在一些不合理思维模式，比如夸大事情影响、看事情过于悲观等。所以为消除抑郁根源需改变认知转换思维模式。本书提倡的许多认知和思维模式适合抑郁症康复，如果从小渗透这些思维模式抑郁症发生可能性大大降低。需要注意，在情绪状态不好时要首先转移注意力以调节情绪，等情绪好转再改变认知。抑郁康复往往是螺旋式上升过程情绪好转会反反复复，总体来讲情绪不好就先调节情绪情绪好了再尝试改变认知。\n\n书里一位高二女生陷入抑郁在维尼老师这咨询，一个多月后逐渐安然走出来。这位妈妈说，女儿读高二去年八月下旬晚上回家说\"妈妈你开导我一下吧我好烦的不想读书了\"，她才意识到女儿情绪不对劲。女儿情绪低落没聊一会就哭了哭得很伤心无助：\"你每天这么辛苦我花那么多钱成绩不好怎么办，看到别人开开心心都学得这么好我觉得好孤单就想哭，我想换班回原来的普通班我不想在这个班里垫底待在这个班我特别烦。\"妈妈才发觉自己太粗心，最近几天女儿一直有话想说但她不是累了就是自己睡了没好好聊过，自己觉得给了她吃用的就很好了还觉得比自己小时候幸福，可她怎么会有这些莫名烦恼？看到女儿状况她很惶恐用最大耐心所有招数宽解女儿可过了十来天女儿还是情绪低迷痛苦烦躁，所以向维尼老师咨询。老师判断是抑郁状态建议主要通过改变认知减轻孩子压力同时慢慢调节情绪。有了指点妈妈也明朗坦然很多，但这真是个反复折腾过程，有时早上上学还好好的中午突然发信息\"妈妈我坐在教室里很烦\"。妈妈心疼女儿无法排解的郁闷内心也有崩溃感觉，这样的情绪什么时候好起来？维尼老师建议多陪陪她，妈妈只能午饭时间打电话聊晚自习前偶尔送吃的陪陪她，女儿见到她常抹眼泪。这段时间为陪伴女儿身心俱疲。女儿也问\"妈妈我怎么还没好啊要多久才好啊\"。维尼老师用三种思维帮她分析：一是坏事变好事，这场风波早晚会到来高二出现比高三出现好这种经历对她心理成长作用比学习多少知识更重要；二是很正常没什么，现在不想学就不学多大的事呢，我们学文科看书自学容易得多，从普通班突然进重点班不适应也很正常；三是学习努力就好至于能学成什么样顺其自然，只要正常发挥还是能考上大学的至于一本二本没太大区别将来关键看个人综合素质。九月份女儿有无数次想休学念头维尼老师说先看看，后来女儿在学校那么难熬妈妈也想让她休学算了，老师说再坚持几天，后来女儿状况好多了情绪好时间越来越长。有时妈妈不理解孩子在维尼老师那抱怨\"孩子怎么想那么多没用的呢什么不想不就行了\"\"晚上回家要玩一个小时电脑12点才睡\"，维尼老师说\"相信孩子是想变好的她是克制不住自己的情绪才会这样\"\"玩电脑就玩电脑吧这也是在宣泄情绪\"，这样想妈妈也没那么焦虑了。值得庆幸过了一个多月女儿安然走过来相信经历状况的女儿会更坚强，这学期女儿回家也不玩电脑了脸上笑容越来越多人也快乐起来。妈妈原来对女儿寄予厚望希望各方面优秀出人头地但没注意帮她减压反而在加压，现在将孩子学习彻底放下了孩子心灵健康和快乐比什么都重要。今年这学期女儿同桌休学了，听女儿说这学期同桌常常绝食割腕最终休学，其实如果能像女儿一样及时疏导或许同桌也能顺利读书上大学，这一休学有的孩子就再也没有勇气踏入校门了。\n\n二、强迫症，其实不难理解\n\n没有强迫经历的人总觉得强迫症莫名其妙不可理喻，其实它也是正常心理规律的产物是可以理解的。强迫症常见形式有强迫行为和强迫思维，这里主要讨论强迫行为。强迫行为就是来访者在生活中明明知道持续存在毫无意义且不合理却不能克制反复出现的行为，愈是企图努力抵制愈感到紧张和痛苦。其中反强迫是一个重要特征，即为强迫动作（思维）感到痛苦焦虑极力想摆脱。\n\n强迫行为比较常见，不少人曾经有过类似经历，比如出门前反复检查煤气有没有关好、门关上后疑心到底有没有锁好、反复检查东西在不在包里……看起来莫名其妙但这种怀疑和担心其实有一定道理，因为确实存在发生的可能性。\n\n第一，强迫行为的起因。出现强迫性行为往往有一定诱因，可能起始于偶然的担心怀疑也可能是某一次事件。维尼老师曾有过开车时反复检查手刹的强迫行为，起因是有一次他忘记放手刹结果刹车片和后轮摩擦冒烟了，从那之后开车时会习惯性怀疑手刹是否放下。出现强迫行为也与性格有关系，追求完美、自我要求高、敏感、爱担心的性格相对容易出现强迫症，这与家庭环境有一定关系。有一位初中女生有反复洗手长时间洗澡的强迫行为，原来是因为她爸爸性格有些过于追求完美从小总担心她生病过分讲究卫生家里餐具天天消毒对孩子产生深刻影响。一位六年级男孩几位家人都容易担心焦虑受此影响孩子也总担心会发生什么不好的事所以出现强迫行为。\n\n第二，强迫行为的本质。维尼老师认为强迫行为本质是习惯性地出现的怀疑，会在某种情景下自动出现。这种怀疑或担心看似毫无意义其实也有一定道理有发生的可能性。比如他开车时确实可能忘记放手刹这种现象发生过五六次；洁癖患者为什么反复洗手？是因为怀疑手不干净而无论怎么洗不干净可能性总是存在；又如一位来访者怀疑周围一切是否真实，这种怀疑也有道理因为从感官角度世界是光线声音等组合只是真实世界一种反映。这种怀疑会产生驱力推动人们去检查验证以消除担心或怀疑，如果不去验证就会感觉不舒服甚至焦虑烦躁，验证了才觉得舒服。\n\n第三，有了怀疑为什么需要反复验证才能安心。我们平常相信一件事往往基于模糊判断大致一想就放心了，但要较真的话还就不那么确信了。比如一个字随便一看就能认出来但如果仔细盯着看越看越不像。再如停车之后已经走远了有时又担心忘记关车门此时去回忆分析还真搞不准需要回去看看才能确定有时还真会忘记关车门。再如开车时怀疑手刹没放下虽然看到手刹灯灭了（手刹灯灭说明已放下）但眼睛看到并不等于理智上就相信了需要反复确认才会安心。\n\n第四，情绪对强迫行为有影响。越放松平静强迫行为出现频次和强度越少；越紧张焦虑强迫行为出现频次和强度越多。在放松平静状态下人的思维敏捷感觉确切所以容易消除怀疑；而紧张焦虑等情绪会干扰人的思维感觉不容易确信，所以保持放松平静很重要，另外在疲劳困倦时候强迫症状出现可能性也会增大。\n\n第五，如何治疗强迫行为。第一步是接纳。如果能接纳强迫行为或思维不因此而紧张焦虑就没有反强迫，那么严格来讲这就不是强迫症。比如有洁癖的人如果只担心手不干净反复洗手心情平静没有反强迫这就不是强迫症。维尼老师曾经有过多种强迫行为幸运的是一直能够接纳平静对待所以虽然强迫行为让人不舒服对生活有所干扰但一直没有因此产生痛苦或焦虑。如何做到接纳？首先要理解强迫症是正常心理规律的产物并不是什么神秘可怕的东西，另外要知道改善可能需要较长过程比如一个月几个月或者几年不可能很快消失所以需要先带着它一起生活。如果不能接纳为此而痛苦焦虑急于摆脱出现反强迫那么就会成为真正强迫症改善更困难和更慢一些。第二步是慢慢等待习惯性怀疑的消失。既然是一种习惯性出现的怀疑那么如果经常不出现，习惯性怀疑可能会逐渐消失，不过也不要勉强自己克制如果还想验证就顺应自己的想法这样更自然。此外当怀疑出现时可以用简单明确方式让自己确信，比如维尼老师怀疑手刹是否放下时会看看仪表盘之后告诉自己\"手刹灯没亮\"，这种方式对消除怀疑比较有效；以前担心兜里钥匙在不在摸了一下之后会告诉自己\"钥匙在即使丢了也没什么\"，这样可能就不会反复检查，这也是认知咒语的应用。通过这些方法怀疑会慢慢减少应对越来越轻松逐渐强迫性行为不再习惯性出现，即使偶尔出现由于有应对之道也不会有太大影响。比如对于反复检查手刹的强迫行为维尼老师第一步就是接纳怀疑了就去检查，同时也淡化后果严重性因为一般来说手刹没放下十几秒后也会有声音提示所以一般不会有严重后果，如果还想检查看过之后和自己说\"手刹灯没亮所以没事\"就容易停止反复检查，如果还有驱力可以忍耐克制一下一会儿驱力可能自然消失，这样经过一个月怀疑慢慢不大出现了即使偶尔出现也影响不大。\n\n书里一位来访者十几年前因强迫症在维尼老师这咨询，这是他写的一篇总结体会《从强迫症的痛苦中重生》：2000年左右他有了强迫症，那时追求完美事事要求尽善尽美目标也定得很高但因个人能力有限往往达不到自己要求所以经常陷入自责，那时他不懂如何调节心理时间久了压力越来越大出现强迫症状，之后高考发挥失常没考上大学他从心里觉得愧对父母也很困惑付出那么多努力结果怎么会是这样。高考之后偶然机会见到维尼老师之后几年在老师帮助之下心理状况慢慢有很大改观很多问题解决了。他深受成功学影响比如人生目标定得很高想象自己应该有一番伟大事业认为如果考不上大学人生就是灰暗的这导致心理容易出现问题，维尼老师帮他慢慢改变那些不合理认知学习新的思维模式比如努力之后顺其自然做自己能做的事情三种思维等，认知改变了他就不那么容易低落和痛苦了。学会心理调节也很重要，他当时不仅有强迫症也有抑郁症情绪经常低落感到痛苦，维尼老师建议他多去主动调节情绪他学会了在出现问题或情绪不佳时通过看电视看书打篮球等活动转移注意力尽量不去和那些念头纠缠在一起，他也学会了一些应对问题的方法，比如有一次他喝了一瓶乙肝患者喝过的啤酒事后很担心不知所措又开始出现强迫症状，后来用了维尼老师\"一般没问题实在有问题听天由命\"等认知改变方法逐渐消除了担心。他以前有一种强迫性思维怀疑现在的世界是虚幻的困扰他很长时间很难受，维尼老师说这其实也是正常的可以理解，建议他先接纳这种念头带着它去生活这样就不那么痛苦了，在感到痛苦时首先去转移注意力调节情绪情绪平静时再去说服自己改变认知，虽然经常有反复但感觉还是在慢慢好转放松平静时间越来越多强迫行为影响他的强度越来越小持续时间越来越短，现在虽然偶然还会有这种念头但已经基本不影响他了。他现在反思为什么会出现这些问题起初是因为认知有问题后来才出现情绪问题强迫症状最终导致问题很严重，慢慢调节情绪改变认知才能逐渐好转，原来的问题根深蒂固比较复杂所以改变过程很漫长，现在虽然还有一些问题但会继续努力成长自己相信会越来越好。\n\n三、克服恐惧，需要方法\n\n认知疗法应用广泛，但对于恐惧害怕有时效果不太大，克服恐惧和害怕更适合运用系统脱敏法。维尼老师大学时擅长体操身手矫健单杠双杠全校前几名水平，可是对跳马却有一种莫名害怕，助跑到纵马前就不大敢跳了。为什么会这样搞不清楚同学也奇怪其他项目他胆子都挺大怎么到跳马就不敢了，鼓励自己也没用这是一种习惯性的恐惧不受意志和理性控制。不久就要全校体操比赛他还报名了全能比赛跳马必须跳好怎么办？他开始循序渐进克服这种莫名害怕，从简单的、不大恐惧的起点开始训练能够轻松平静完成后再逐步加大训练难度每一步都是不大害怕的。他首先练跳山羊开始也有些害怕那就先让跳板离山羊近一点完全不怕后再把跳板拖远点直到距离达到标准能放松完成跳山羊动作了，之后再练\"横马\"距离也是循序渐进，最后再练\"纵马\"也是距离由近到远最后在很远的距离上腾空跃起也不害怕了而且动作飘逸引起同学们赞叹，最终他在全校体操比赛跳马项目上荣获冠军。多年之后他才知道这个方法就是系统脱敏法。\n\n系统脱敏疗法又称交互抑制法，由美国学者沃尔帕创立和发展，主要是诱导求治者缓慢地暴露出导致神经症焦虑恐惧的情境并通过心理的放松状态来对抗这种焦虑情绪从而达到消除焦虑或恐惧的目的。如果一个刺激所引起的焦虑或恐怖状态在求治者所能忍受范围之内经过多次反复呈现他便不再会对该刺激感到焦虑和恐怖治疗目标就达到了。简单来讲就是循序渐进地提高难度每一步都是不太恐惧用逐渐适应的方式克服恐惧。有时孩子也会有一些胆小害怕的时候比如不敢骑自行车怕黑不敢独自滑滑梯等，害怕是莫名的不是凭意志就能克服的此时一般不必逼迫孩子克服可以先适当帮助陪伴孩子逐渐放手让孩子在不知不觉中克服恐惧。比如孩子晚上起来不敢独自去洗手间那么就先陪伴一下慢慢孩子就敢去了；孩子不敢骑自行车就先扶着她骑慢慢减少参与程度最后孩子就敢自己骑了。维尼老师女儿五六岁时不敢独自在少年宫上课前几次他就先坐在她身边后来坐到她身后之后坐教室最后面最后坐十几分钟再出去慢慢孩子就适应自己在教室上课了。\n\n四、摆脱失眠的阴影\n\n如何预防和应对失眠？首先可以从生理状态入手，不妨白天或晚上多一些运动有一些疲乏感觉，睡觉之前避免做兴奋事情，睡前也可洗个热水澡让自己放松下来，这些都有助于安然入睡。有的人为睡眠好早早躺下如果此时没困意不容易入睡在那里思来想去反而更睡不着，不如看看书等有些瞌睡了再睡效果更好。有些人担心睡不着所以着急入睡，而入睡需要放松平静状态越着急越怕睡不着越不容易入睡，其实这夸大了失眠的影响，事实是虽然睡眠不足会影响第二天身体和精神状态但如果心情比较平静那么少睡几个小时影响并不太大，如果内心焦虑不已那么第二天受到的影响才会比较大，所以可应用一句认知咒语：睡不着就睡不着吧顺其自然，这样心情会平静些也不去担忧能不能睡着反而容易入睡。另外可采用转移注意力方式避免想得太多，比如可以听着电视节目入睡也可打开\"喜马拉雅\"或\"荔枝\"等音频分享平台找一个适合节目比如《晓说》《随口说美国》《静说日本》等既有知识也有趣味听起来轻松平静可能不知不觉就入睡了即使一时睡不着感觉有收获也会平静些。如果已经有些兴奋可采用想象放松方法：从脚趾头开始先想象脚趾头是个气球慢慢漏气（或想象漂浮在热水里）这样脚趾头感觉就放松了，之后依次自下而上慢慢想象放松脚腕小腿膝盖大腿臀部腰肚子胸手掌小臂上臂肩膀下巴嘴巴鼻子眼睛头，其中头部要重点慢慢放松，如何想象放松可根据自己喜好每个放松步骤时间也可自己灵活设定，这样一来注意力在身体上就避免了胡思乱想放松状态也会帮助我们不知不觉入睡。克服失眠也是一个系统工程需要从生理情绪认知习惯等多个角度综合解决问题。\n\n五、如何解决紧张性头痛\n\n这是一个压力倍增的时代应对不当学习压力工作压力会让人喘不过气，另外由于成功学励志课程流行很多人过于执着上进容易紧张焦虑过于勉强自己导致经常疲劳长此以往容易患头痛严重影响学习工作。紧张性头痛是目前最常见头痛类型困扰约90%的患者，主要表现为头部颈部肩部背部肌肉紧张导致头部疼痛胀痛紧箍感没有晕眩呕吐等症状可能持续几十年。\n\n维尼老师曾患有肌肉紧张性头痛，高三时他把每一份模拟试卷都当作高考来练习有意让自己精神紧张兴奋起来头脑高速运转即使累了也要做完，所以做完之后会很劳累时间久了就患上肌肉紧张性头痛严重影响了十余年，不过这也给他提供了深入持续研究的机遇。下面谈谈对肌肉紧张性头痛的认识和治疗方法主要基于他自己经验。\n\n首先理解肌肉紧张性头痛的机制。紧张性头痛是一种身心疾病，从生理来讲开始并没有器质性病变头颈肩背部肌肉紧张是头痛主因时间久了由于经常紧张所以肌肉也会有一些损伤疼痛，这是一种肌肉的习惯性紧张情绪波动用脑习惯不合理都会习惯性引起肌肉紧张而且往往是头颈肩背的肌肉群全部紧张互相影响会持续几个小时甚至几天难以放松下来，肌肉紧张会造成头痛胀痛紧箍感这又会引起紧张焦虑烦躁而且用脑也难以从容舒缓从而进一步导致肌肉持续紧张形成恶性循环难以摆脱。所以肌肉紧张性头痛主要受到情绪用脑行为肌肉紧张三个因素影响它们之间也会相互作用。从情绪来看紧张焦虑烦躁急躁兴奋激动等情绪都容易引起肌肉习惯性紧张所以要力争做到情绪平静以避免肌肉紧张。从用脑行为来看过于节约时间过度重视提高效率等不符合用脑习惯容易导致肌肉习惯性紧张所以需要养成良好用脑行为习惯。肌肉紧张形成后自动持续产生不适感会引发情绪波动用脑行为更加难以控制，而且此时会更加敏感轻微情绪波动或者稍微不合理用脑行为就可能会引发进一步紧张。另外头痛胀痛紧箍感会让人不由自主关注这些症状而这本身就会进一步导致情绪紧张焦虑，所以越关注越在意肌肉紧张就越难以摆脱。所以治疗肌肉紧张性头痛需要从多方面入手采取综合解决方案。\n\n第一，情绪的调节。患有肌肉紧张性头痛之后对情绪波动比较敏感所以最好能保持平静心态减少各种情绪波动，认知疗法是培养平静心态好方法这时既需要改变核心思维又需要转换具体习惯性思维成长和改变是长期过程。在情绪已经出现波动时最好是停下来去转移注意力以调节情绪，不然情绪会持续在这种条件下也难以轻松自然地用脑。\n\n第二，用脑行为的改变。不合理用脑行为自然容易导致疲劳也会引起情绪紧张烦躁从而引发肌肉紧张，所以需要改变用脑习惯，比如从容放松一些不要急着用脑不要追求速度效率慢慢来；一次只做一件事只思考一种内容让自己轻松专注一些；累了就要休息不要勉强继续；不要过于节约时间；只在适合的场合下用脑……但是由于习惯性思维作用这些行为不是想改变就能改变的需要去一一分析其根源好好说服自己才可以。\n\n第三，肌肉紧张的应对。肌肉已经紧张就形成了情绪行为肌肉紧张的恶性循环，所以此时最好是先休息去……如果头痛不严重可以采取运动等方式来促进情绪改善和肌肉放松，运动也有助于全身通畅通则不痛；可以采用按摩方式直接来放松头颈肩背的肌肉，全身放松对于这些部位放松也有帮助，此外汗蒸沐浴等方式也有助于缓解肌肉紧张，游泳是一种很好的全身放松方式全身肌肉良好放松有助于摆脱头痛；另外保持充足睡眠和休息帮助身体处于良好状态有助于减少肌肉紧张，逐渐放松时间会越来越多肌肉也会记住这种感觉慢慢会习惯于放松。长期的肌肉紧张往往伴随肌肉损伤引起生理性疼痛此时可以寻求中医治疗。\n\n第四，接纳头痛，带着它一起生活。一般来说头痛会持续很长时间短期内难以改变所以只能带着它一起生活，过多的关注为之紧张焦虑沮丧只能加剧肌肉紧张，接纳之后可能会逐渐不大去关注了也就减少了部分紧张的来源。\n\n书里一位老师的故事《通过认知疗法改变紧张性头痛》：她患有头痛很多年，工作后有了孩子压力越来越大，家庭里矛盾很深脾气也愈发暴躁，那时会把怨气发泄在孩子身上孩子开始抽动，那段时间她抑郁焦虑失眠脱发头痛也达到前所未有程度。后来认识维尼老师每天看老师文章尤其是认知疗法让她醍醐灌顶原来她的认知出了问题，每次头疼并不是事情本身让她头痛而是对事情的看法让她头痛，例如每次做公开课其实不是备课过程让她难受（她对此还感到享受）而是对公开课的不合理认知让她担心和焦虑，她认为领导给了机会是肯定她只能赢不能输，如果效果不好就是给领导丢人给学校抹黑就完蛋了所以压力陡增。她追求完美以及要强急躁性格也是加剧头痛原因，她总要求尽善尽美不能出差错总是苛求自己想马上解决问题所以经常搞得过度疲惫而此时就更容易被激怒发脾气体导致头痛。后来在心情烦躁时她就会看维尼老师的文章尤其是\"放下过多的执着心才能静下来才能有智慧去处理好事情\"这句会让她轻松很多心慢慢静下来。原来她总感觉生活对我不公平心理不平衡认为付出太多牺牲太多总抱怨，后来当她向原单位提出辞职时领导给了很多帮助这深深感动了她，换工作期间老公和孩子也给了很大支持，来到新单位也得到了同事帮助，这些都让她懂得感恩慢慢抱怨少了心情平静了。现在她学会用三种思维重新看待事情也有了口头禅\"方法总比问题多\"，有了这些习惯性思维她放下了很多顾虑轻松了很多身边人也感到轻松，在这样的良性循环下头痛也逐渐远离她。\n\n六、别被轻易扣上精神疾病的帽子\n\n精神分裂症听起来可怕但更可怕的是本来不是精神分裂症却被诊断为精神分裂症。虽然精神分裂症有严格诊断标准但目前精神科医生水平参差不齐部分可能根据出现幻听幻觉妄想等症状就轻率诊断为精神分裂症。其实有时所谓幻听可能是一种正常心理现象，比如很多人可能有过这样的经历：手机铃声没响却好像听到铃声响了。一个正常人，在剧烈情绪、很大压力之下会出现各种看似奇怪的症状其中包括幻听幻觉妄想。\n\n有一位军官知道可能会被安排转业她无法接受压力很大，那段时间出现一些症状总觉得别人在议论她看到别人开会就觉得是在研究她转业的事情，但事情过后她很快就正常了。还有一位来访者可能有些钻牛角尖容易情绪激动医生认为这是偏执诊断为精神分裂，这样的标签给了他很大压力真的感觉自己要疯了，其实他思维很清晰维尼老师给他疏导情绪慢慢平静下来，后来他又去北大六院权威专家明确告诉他思维很正常肯定不是精神分裂他才卸下包袱。一位高中孩子很叛逆有段时间情绪波动激烈也自述有幻觉症状妈妈很担心把她送到精神病院门诊医生只根据幻觉这个症状就马上诊断为精神分裂住院两周，但后来医院专家查房明确诊断为情绪障碍不是精神分裂，而这两周经历却给孩子留下难以磨灭伤痛。一位高一学生陷入抑郁情绪去省精神病院门诊医生听了孩子自述一些表现没有详细询问具体表现没有探究原因就诊断为有精神症状建议住院治疗，维尼老师和孩子交流发现他思维很清晰正常某些所谓精神症状是可以理解的，比如他有时觉得好像脑子里有声音在和他对话觉得脑子被控制了这其实可能是驱力和意志的斗争或内心矛盾时两种思想的斗争是正常的并不能判断为幻听，所以维尼老师建议不要住院后来通过心理咨询孩子心理状况越来越好，如果当时按精神症状住院一场悲剧就发生了。\n\n书里一位妈妈写《一场噩梦终于结束》：今年三月份儿子被一所大专院校录取了收到录取通知书那一刻她真是百感交集为他恢复阳光健康状态而欣慰，噩梦终于结束了他们一家迎来了曙光。三年前儿子初中毕业由于中考成绩不理想没考上理想高中整个暑假她心情极差经常跟他发脾气情绪基本失控给孩子造成很大压力，他也知道自己没考好所以对于打骂一直在忍受，其实他也很不高兴只是性格内向说不出自己的感受所以一个暑假都在她的不良情绪中度过这酿成了后来的噩梦。高中开学前学校组织学生到军事基地军训八天结束后回家她就发现他情况不对，孩子出现自言自语状况说军训时有的同学嫉妒他军姿站得好背地里说他坏话了，还出现了幻听幻觉总觉得有高中同学在家的附近总是说楼下有同学说他坏话，看到这种情况她和爸爸当时就傻掉了手足无措只能让他宣泄委屈和痛苦，本以为第二天会转好可是状况依旧一直持续了十天左右。后来她找到维尼老师咨询才知道孩子太压抑了无法释放才导致这些状况出现，维尼老师说这种情况虽然看起来像精神症状但是正常人在压力很大情况下也会出现类似症状所以可能是暂时的，首先要把精力放在调节孩子情绪上情绪好了症状可能会慢慢消失，另外长期来讲需要改变教育方式不要给孩子施加那么大压力创造宽松家庭环境再慢慢改变孩子敏感性格这样问题就会慢慢解决。反思自己她是个特别强势的妈妈没有理解和尊重孩子给了孩子太多压力才造成现在状况，她心情慢慢平复下来重新审视自己去学习运用维尼老师教育理念和方法，开始给自己和孩子减压先接纳现状以平和心态和孩子友好相处紧张的亲子关系不知不觉中缓和了很多，他也有很大改变愿意和她说学校发生的事情做事情也能够商量着来，慢慢地幻觉幻听妄想等症状慢慢消失了。现在她对孩⼦管理比较宽松只要比较合情理她会尽量去满足他不急于求成学会顺其自然，认知疗法和三种思维对于调节她和孩子的情绪效果不错孩子逐渐不那么敏感和内向了。两年时间过去了通过改变教育方式她和孩⼦都获得了新生，现在她和孩⼦关系特别融洽家庭气氛温馨和谐孩⼦能感受到来自父母的包容理解真心疼爱经历了风雨洗礼孩⼦性格也开始变得开朗阳光，在学校和⽼师同学相处非常好在家里能帮助她做力所能及家务活，最重要的是他思考问题解决问题方式不再偏激，阳光总在风雨后经历了那么多孩⼦又重新开启了美好⼈生。\n\n七、给听众的实践启发\n\n这是全书的最后一章，也是最有温度的一章。请带走这些：\n\n第一，所有心理问题——抑郁、强迫、恐惧、失眠、头痛——都是正常心理规律的产物，是可以理解的，不是你\"疯了\"或\"完了\"。理解机理，是疗愈的第一步。\n\n第二，抑郁的核心是\"情绪—认知\"的恶性循环。走出它的三步是：先接纳带着症状生活、再主动转移注意力调节情绪、等情绪好了再改变认知。螺旋式上升，要有耐心。\n\n第三，强迫的本质是\"习惯性怀疑\"。治疗第一步是接纳——没有反强迫，就不算真正的强迫症；带着它生活，慢慢等待怀疑消失，用\"认知咒语\"让自己确信。\n\n第四，恐惧靠\"系统脱敏\"——循序渐进提高难度，每一步都不慌，像维尼老师练跳马那样，从近到远，最终夺冠。\n\n第五，失眠和头痛，都离不开\"接纳+放松+调节情绪+改变认知\"的综合方案，越关注越糟，顺其自然反而好。\n\n第六，也是最沉重也最重要的一条：别被轻易扣上精神疾病的帽子。正常人在巨大压力下也会出现幻听、幻觉、妄想，先调节情绪、理解孩子、创造宽松环境，很多\"症状\"会慢慢消失。一场错误的诊断，可能就是一场悲剧。\n\n维尼老师用这本书告诉我们：内心的重建，不是把旧的自己打碎重造，而是用科学的认知、温柔的接纳、合理的思维，把那个被焦虑、执着、恐惧困住的自己，一点一点解放出来。从心理成长的钥匙——认知疗法，到三种思维、驱力、情绪调节，到接纳不完美的自己、顺其自然的人生态度，再到改善性格、处理关系，最后理解所有的心理问题——这是一条完整的内心重建之路。\n\n各位听众朋友，到这里，《内心的重建》十二章的导读就全部结束了。愿你也能在这条路上，重建一个更从容、更自在、更有力量的内心。谢谢大家，我们下一本书再见。"}]};
const audio = document.getElementById('audio');
const listEl = document.getElementById('list');
const transcriptsEl = document.getElementById('transcripts');
const pTitle = document.getElementById('pTitle');
const pStat = document.getElementById('pStat');
const fill = document.getElementById('fill');
const bar = document.getElementById('bar');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const speedBtn = document.getElementById('speed');
let cur = -1;
const speeds = [1,1.25,1.5,0.75,1];
let si = 0;
function fmt(s){s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function playTrack(i){if(i<0||i>=BOOK.tracks.length)return;cur=i;const t=BOOK.tracks[i];audio.src=t.file;audio.playbackRate=speeds[si];pTitle.textContent=(String(t.index).padStart(2,'0'))+'. '+t.title;audio.play().then(()=>render()).catch(e=>console.warn(e));render();}
audio.onloadedmetadata=()=>{durEl.textContent=fmt(audio.duration);};
audio.ontimeupdate=()=>{if(audio.duration){fill.style.width=(audio.currentTime/audio.duration*100)+'%';}curEl.textContent=fmt(audio.currentTime);};
audio.onplay=()=>{playBtn.textContent='⏸';render();};
audio.onpause=()=>{playBtn.textContent='▶';render();};
audio.onended=()=>{if(cur+1<BOOK.tracks.length)playTrack(cur+1);else{playBtn.textContent='▶';render();}};
playBtn.addEventListener('click',()=>{if(cur<0){playTrack(0);return;}audio.paused?audio.play():audio.pause();});
prevBtn.addEventListener('click',()=>playTrack(Math.max(0,cur-1)));
nextBtn.addEventListener('click',()=>playTrack(Math.min(BOOK.tracks.length-1,cur+1)));
speedBtn.addEventListener('click',()=>{si=(si+1)%speeds.length;audio.playbackRate=speeds[si];speedBtn.textContent=speeds[si].toFixed(2).replace(/0$/,'')+'×';});
bar.addEventListener('click',e=>{if(audio.duration){const r=bar.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;}});
BOOK.tracks.forEach((t,i)=>{
  const li=document.createElement('li');li.className='ch';li.dataset.i=i;
  const idx=document.createElement('div');idx.className='idx';idx.textContent=String(t.index).padStart(2,'0');
  const meta=document.createElement('div');meta.className='meta';
  const ct=document.createElement('div');ct.className='ct';ct.textContent=t.title;
  const cd=document.createElement('div');cd.className='cd';cd.innerHTML='<span class="eq"><i></i><i></i><i></i><i></i></span>';
  meta.appendChild(ct);meta.appendChild(cd);
  const dur=document.createElement('div');dur.className='dur';dur.textContent=fmt(t.duration);
  li.appendChild(idx);li.appendChild(meta);li.appendChild(dur);
  li.addEventListener('click',()=>playTrack(i));
  listEl.appendChild(li);
});
BOOK.transcripts.forEach((tr)=>{
  const d=document.createElement('details');d.className='ts';
  const s=document.createElement('summary');s.textContent=tr.title;
  const c=document.createElement('div');c.className='tsc';c.textContent=tr.text;
  d.appendChild(s);d.appendChild(c);
  transcriptsEl.appendChild(d);
});
function render(){document.querySelectorAll('li.ch').forEach((li,i)=>{li.classList.toggle('active',i===cur);li.classList.toggle('playing',i===cur&&!audio.paused);});}
pStat.textContent='共 '+BOOK.tracks.length+' 章 · 约 '+(BOOK.tracks.reduce((a,b)=>a+b.duration,0)/60).toFixed(0)+' 分钟';
document.getElementById('total').textContent='总时长约 '+(BOOK.tracks.reduce((a,b)=>a+b.duration,0)/3600).toFixed(1)+' 小时 · '+BOOK.tracks.length+' 章';
</script>
